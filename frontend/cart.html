<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }

        /* ── Variant Interactive Pill ── */
        .cart-item-variant.interactive {
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }
        .cart-item-variant.interactive:hover {
            border-color: var(--brand-primary, #1b8c3d);
            background: rgba(27, 140, 61, 0.12);
            color: var(--text-primary, #ffffff);
            transform: translateY(-1px);
        }
        .cart-item-variant-arrow {
            display: inline-flex;
            align-items: center;
            opacity: 0.7;
            transition: transform 0.2s ease;
        }
        .cart-item-variant.interactive:hover .cart-item-variant-arrow {
            transform: translateY(1px);
            opacity: 1;
        }

        /* ── Variant Bottom Offcanvas Sheet ── */
        .variant-offcanvas-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.3s;
        }
        .variant-offcanvas-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .variant-offcanvas-sheet {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            max-width: 540px;
            margin: 0 auto;
            background: var(--bg-secondary, #0d0d14);
            border: 1px solid var(--border-default, rgba(255, 255, 255, 0.12));
            border-bottom: none;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.65);
            z-index: 10001;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            transform: translateY(105%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
            overflow: hidden;
        }
        html[data-theme="dark"] .variant-offcanvas-sheet {
            background: #111118;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .variant-offcanvas-sheet.active {
            transform: translateY(0);
        }

        .variant-offcanvas-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            margin: 10px auto 4px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .variant-offcanvas-header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px 16px;
            border-bottom: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.06));
            flex-shrink: 0;
        }
        .variant-offcanvas-thumb {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--border-default, rgba(255, 255, 255, 0.12));
            background: var(--bg-tertiary, #13131d);
            flex-shrink: 0;
        }
        .variant-offcanvas-header-info {
            flex: 1;
            min-width: 0;
        }
        .variant-offcanvas-title {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--text-primary, #f0f0f5);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }
        .variant-offcanvas-price {
            font-size: 1.1875rem;
            font-weight: 700;
            color: var(--brand-primary, #1b8c3d);
            margin-top: 4px;
        }
        .variant-offcanvas-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-tertiary, #1a1a28);
            border: 1px solid var(--border-default, rgba(255, 255, 255, 0.1));
            color: var(--text-secondary, #a0a0b5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .variant-offcanvas-close:hover {
            color: var(--text-primary, #f0f0f5);
            background: var(--bg-elevated, #222235);
        }

        .variant-offcanvas-body {
            padding: 16px 20px;
            overflow-y: auto;
            overscroll-behavior: contain;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .variant-offcanvas-subtitle {
            font-size: 0.8125rem;
            font-weight: 600;
            color: var(--text-secondary, #a0a0b5);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 2px;
        }
        .variant-options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .variant-option-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: var(--bg-tertiary, #13131d);
            border: 1.5px solid var(--border-subtle, rgba(255, 255, 255, 0.08));
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            user-select: none;
            box-sizing: border-box;
        }
        .variant-option-row:hover:not(.oos) {
            border-color: var(--brand-primary, #1b8c3d);
            background: rgba(27, 140, 61, 0.06);
            transform: translateX(2px);
        }
        .variant-option-row.selected {
            border-color: var(--brand-primary, #1b8c3d);
            background: rgba(27, 140, 61, 0.12);
        }
        .variant-option-row.oos {
            opacity: 0.45;
            cursor: not-allowed;
        }
        .variant-option-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border-default, rgba(255, 255, 255, 0.1));
            background: var(--bg-secondary, #06060a);
            flex-shrink: 0;
        }
        .variant-option-info {
            flex: 1;
            min-width: 0;
        }
        .variant-option-name {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary, #f0f0f5);
            word-break: break-word;
            line-height: 1.35;
        }
        .variant-option-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 3px;
        }
        .variant-option-price {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--brand-primary, #1b8c3d);
        }
        .variant-option-stock {
            font-size: 0.75rem;
            color: var(--text-tertiary, #6b6b80);
        }
        .variant-option-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--border-default, rgba(255, 255, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
            color: transparent;
        }
        .variant-option-row.selected .variant-option-check {
            background: var(--brand-primary, #1b8c3d);
            border-color: var(--brand-primary, #1b8c3d);
            color: #ffffff;
        }

        .variant-offcanvas-footer {
            padding: 14px 20px 20px;
            border-top: 1px solid var(--border-subtle, rgba(255, 255, 255, 0.06));
            background: var(--bg-secondary, #0d0d14);
            flex-shrink: 0;
        }
        .variant-confirm-btn {
            width: 100%;
            padding: 13px;
            border-radius: 14px;
            background: var(--brand-primary, #1b8c3d);
            color: #ffffff;
            font-size: 0.9375rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .variant-confirm-btn:hover:not(:disabled) {
            background: var(--brand-primary-light, #22c55e);
            box-shadow: 0 4px 18px rgba(27, 140, 61, 0.4);
            transform: translateY(-1px);
        }
        .variant-confirm-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Your Cart — BuyBIBZ</title>
    <meta name="description" content="View items in your shopping cart and proceed to checkout.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css?v=4.4">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="cart-page">
        <div class="container">
        <a class="page-back" href="products.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span data-i18n="common.back">Back</span>
        </a>
            <div class="page-header">
                <h1 data-i18n="cart.title">Shopping Cart</h1>
                <p data-i18n="cart.page_subtitle">Review your items before checkout</p>
            </div>

            <div class="cart-layout">
                <!-- Cart Items -->
                <div id="cart-items-container">
                    <!-- Loaded dynamically -->
                    <div style="padding: var(--space-4xl); text-align: center;">
                        <span class="skeleton" style="display:inline-block; width:50px; height:50px; border-radius:50%; margin-bottom:16px;"></span>
                        <div class="skeleton" style="height:20px; width:200px; margin:0 auto;"></div>
                    </div>
                </div>

                <!-- Cart Summary -->
                <aside class="cart-summary" id="cart-summary" style="display: none;">
                    <h3 data-i18n="cart.order_summary">Order Summary</h3>
                    <div class="cart-summary-row">
                        <span><span data-i18n="cart.subtotal">Subtotal</span> (<span id="summary-count">0</span> <span data-i18n="cart.items">items</span>)</span>
                        <span id="summary-subtotal">$0.00</span>
                    </div>
                    <div class="cart-summary-row">
                        <span data-i18n="cart.intl_shipping">International Shipping</span>
                        <span id="summary-shipping" style="color: var(--status-success);" data-i18n="cart.free">Free</span>
                    </div>
                    <div class="cart-summary-row">
                        <span data-i18n="cart.transaction_fee">Transaction Fee (3%)</span>
                        <span id="summary-fee">$0.00</span>
                    </div>
                    <div class="cart-summary-row">
                        <span data-i18n="cart.tax">Tax</span>
                        <span data-i18n="cart.tax_calculated">Calculated at checkout</span>
                    </div>
                    <div class="cart-summary-total">
                        <span data-i18n="cart.total">Total</span>
                        <span id="summary-total" style="color: var(--text-brand);">$0.00</span>
                    </div>
                    
                    <a href="checkout.html" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-xl);">
                        <span data-i18n="cart.proceed_checkout">Proceed to Checkout</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </a>
                    
                    <div style="text-align: center; margin-top: var(--space-lg);">
                        <button class="btn btn-ghost btn-sm" onclick="clearCart()" data-i18n="cart.clear_cart">Clear Cart</button>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <!-- Modern Confirmation Modal -->
    <div class="modal-overlay" id="confirm-modal" style="display: none;">
        <div class="modal-card confirm-modal">
            <div class="modal-header">
                <h3 id="confirm-title">Confirm Action</h3>
            </div>
            <div class="modal-body">
                <p id="confirm-message">Are you sure you want to proceed?</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" id="confirm-cancel">Cancel</button>
                <button class="btn btn-danger" id="confirm-ok">Remove</button>
            </div>
        </div>
    </div>

    <!-- Variant Bottom Offcanvas Drawer -->
    <div class="variant-offcanvas-backdrop" id="variant-offcanvas-backdrop" onclick="closeVariantDrawer()"></div>
    <div class="variant-offcanvas-sheet" id="variant-offcanvas-sheet" role="dialog" aria-modal="true" aria-labelledby="variant-drawer-title">
        <div class="variant-offcanvas-handle" onclick="closeVariantDrawer()"></div>
        <div class="variant-offcanvas-header">
            <img class="variant-offcanvas-thumb" id="variant-drawer-thumb" src="" alt="Variant Preview">
            <div class="variant-offcanvas-header-info">
                <div class="variant-offcanvas-title" id="variant-drawer-title">Product Name</div>
                <div class="variant-offcanvas-price" id="variant-drawer-price">$0.00</div>
            </div>
            <button class="variant-offcanvas-close" onclick="closeVariantDrawer()" aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="variant-offcanvas-body">
            <div class="variant-offcanvas-subtitle" id="variant-drawer-subtitle">Available Variants</div>
            <div class="variant-options-list" id="variant-drawer-options">
                <!-- Variant options dynamically populated -->
            </div>
        </div>
        <div class="variant-offcanvas-footer">
            <button class="variant-confirm-btn" id="variant-drawer-confirm-btn" onclick="confirmVariantChange()">
                <span>Confirm Change</span>
            </button>
        </div>
    </div>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa-install.js"></script>
    <script>
        // Store last known shipping fee from server
        let currentShippingFee = 0;
        let currentTransactionFee = 0;

        // Store pending updates to prevent conflicts
        const pendingUpdates = new Map();
        const updateTimeouts = new Map();

        // Modern confirm dialog
        function showConfirmModal(title, message, onConfirm) {
            const modal = document.getElementById('confirm-modal');
            const titleEl = document.getElementById('confirm-title');
            const messageEl = document.getElementById('confirm-message');
            const cancelBtn = document.getElementById('confirm-cancel');
            const okBtn = document.getElementById('confirm-ok');
            
            titleEl.textContent = title;
            messageEl.textContent = message;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            
            // Remove old listeners
            const newCancelBtn = cancelBtn.cloneNode(true);
            const newOkBtn = okBtn.cloneNode(true);
            cancelBtn.replaceWith(newCancelBtn);
            okBtn.replaceWith(newOkBtn);
            
            // Close modal function
            const closeModal = () => {
                modal.style.display = 'none';
                document.body.style.overflow = '';
            };
            
            // Add new listeners
            newCancelBtn.addEventListener('click', closeModal);
            newOkBtn.addEventListener('click', () => {
                closeModal();
                onConfirm();
            });
            
            // Close on backdrop click
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAuth()) return;
            loadCart();
        });

        async function loadCart() {
            const container = document.getElementById('cart-items-container');
            const summary = document.getElementById('cart-summary');
            
            try {
                const data = await api.getCart();
                
                if (!data.items || data.items.length === 0) {
                    const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
                    container.innerHTML = `
                        <div class="cart-empty">
                            <div class="cart-empty-icon">🛒</div>
                            <h2>${_t('cart.empty')}</h2>
                            <p>${_t('cart.empty_desc')}</p>
                            <a href="products.html" class="btn btn-primary btn-lg">${_t('cart.start_shopping')}</a>
                        </div>
                    `;
                    summary.style.display = 'none';
                    return;
                }

                currentCartItems = data.items || [];
                summary.style.display = 'block';
                document.getElementById('summary-count').textContent = data.count;
                document.getElementById('summary-subtotal').textContent = formatPrice(data.subtotal ?? data.total);
                document.getElementById('summary-total').textContent = formatPrice(data.total);

                // Shipping row
                const shippingEl = document.getElementById('summary-shipping');
                currentShippingFee = data.shipping ?? 0;
                if (currentShippingFee > 0) {
                    shippingEl.textContent = formatPrice(currentShippingFee);
                    shippingEl.style.color = '';
                } else {
                    const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
                    shippingEl.textContent = _t('cart.free');
                    shippingEl.style.color = 'var(--status-success)';
                }

                // Transaction fee row (3% of subtotal)
                currentTransactionFee = data.transaction_fee ?? 0;
                document.getElementById('summary-fee').textContent = formatPrice(currentTransactionFee);
                
                container.innerHTML = data.items.map(item => {
                    const product = item.products;
                    if (!product) return '';

                    // Use unit_price (variant override) if stored, else product.price
                    const effectivePrice = (item.unit_price != null && item.unit_price > 0)
                        ? parseFloat(item.unit_price)
                        : parseFloat(product.price);

                    // Only show compare/strikethrough price when it's the base product price
                    // (not a variant override — comparing $63.99 to $4.99 variant is misleading)
                    const hasVariantOverride = item.unit_price != null && item.unit_price > 0;
                    const hasDiscount = !hasVariantOverride && product.compare_price && parseFloat(product.compare_price) > effectivePrice;
                    const isOutOfStock = !product.stock || product.stock <= 0;

                    const displayQty = pendingUpdates.has(item.id) ? pendingUpdates.get(item.id) : item.quantity;
                    const selectedOptions = item.selected_options || {};
                    const selectedImage = selectedOptions._selected_image || product.image_url || 'https://via.placeholder.com/200x200?text=No+Image';

                    const optionLabels = { colors: 'Color', sizes: 'Size', weight: 'Weight', dimensions: 'Dimensions', variant: 'Variant' };
                    const hasMultipleVariants = Array.isArray(product.attributes?.variants) && product.attributes.variants.length > 1;

                    const selectedOptionsHtml = Object.entries(selectedOptions)
                        .filter(([key]) => key !== '_selected_image')
                        .map(([key, value]) => {
                            let cleanValue = toEnglishProductText(value, value);
                            // If value is very long (full product name), take last 3 words only
                            const words = cleanValue.split(' ');
                            if (words.length > 4) cleanValue = words.slice(-3).join(' ');

                            const isClickable = hasMultipleVariants || key === 'variant';
                            const chevron = isClickable
                                ? `<svg class="cart-item-variant-arrow" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>`
                                : '';

                            return `<span class="cart-item-variant${isClickable ? ' interactive' : ''}" ${isClickable ? `onclick="openVariantDrawer(${item.id})"` : ''} title="${isClickable ? 'Click to change variant' : ''}"><b>${toEnglishProductText(optionLabels[key] || key.replace(/_/g, ' '))}</b> ${cleanValue}${chevron}</span>`;
                        }).join('');

                    const freeShippingBadge = product.attributes?.free_shipping === true
                        ? `<span class="cart-item-shipping"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Free shipping</span>`
                        : '';
                    const outOfStockBadge = isOutOfStock ? `<span class="cart-item-oos-badge">Out of stock</span>` : '';

                    return `
                        <div class="cart-item${isOutOfStock ? ' cart-item-oos' : ''}" id="cart-item-${item.id}" data-item-id="${item.id}" data-price="${effectivePrice}">
                            <a href="product-detail.html?id=${product.id}" class="cart-item-image">
                                <img src="${selectedImage}" alt="${product.name}" style="${isOutOfStock ? 'opacity:0.5;' : ''}">
                            </a>
                            <div class="cart-item-details">
                                <a href="product-detail.html?id=${product.id}" class="cart-item-link">
                                    <div class="cart-item-name">${product.name}</div>
                                </a>
                                ${(selectedOptionsHtml || freeShippingBadge || outOfStockBadge) ? `<div class="cart-item-variants">${selectedOptionsHtml}${freeShippingBadge}${outOfStockBadge}</div>` : ''}
                                <div class="cart-item-footer">
                                    <div class="cart-item-pricing">
                                        ${hasDiscount ? `<div class="cart-item-price-compare">${formatPrice(product.compare_price)}</div>` : ''}
                                        <div class="cart-item-price">${formatPrice(effectivePrice)}</div>
                                    </div>
                                    <div class="cart-qty-controls${isOutOfStock ? ' cart-qty-controls-disabled' : ''}">
                                        <button class="cart-qty-btn" onclick="changeQuantity(${item.id}, -1)" ${isOutOfStock ? 'disabled' : ''}>−</button>
                                        <span class="cart-qty-value" data-quantity="${displayQty}">${displayQty}</span>
                                        <button class="cart-qty-btn" onclick="changeQuantity(${item.id}, 1)" ${isOutOfStock ? 'disabled' : ''}>+</button>
                                    </div>
                                </div>
                            </div>
                            <button class="cart-item-remove" onclick="removeItem(${item.id})" title="Remove item">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                            </button>
                        </div>
                    `;
                }).join('');
                
            } catch (err) {
                container.innerHTML = `
                    <div style="padding: var(--space-4xl); text-align: center;">
                        <p class="text-secondary">${err.message}</p>
                    </div>
                `;
            }
        }

        function changeQuantity(itemId, delta) {
            const itemElement = document.querySelector(`#cart-item-${itemId}`);
            if (!itemElement) return;
            
            const qtyElement = itemElement.querySelector('.cart-qty-value');
            const currentQty = parseInt(qtyElement.dataset.quantity);
            const newQty = currentQty + delta;
            
            if (newQty < 1) {
                removeItem(itemId);
                return;
            }
            
            // Update UI immediately
            qtyElement.textContent = newQty;
            qtyElement.dataset.quantity = newQty;
            
            // Store pending update
            pendingUpdates.set(itemId, newQty);
            
            // Update totals immediately
            updateTotalsUI();
            
            // Clear existing timeout for this item
            if (updateTimeouts.has(itemId)) {
                clearTimeout(updateTimeouts.get(itemId));
            }
            
            // Debounce API call - wait 500ms after last click
            const timeoutId = setTimeout(() => {
                saveQuantityToServer(itemId, newQty);
            }, 500);
            
            updateTimeouts.set(itemId, timeoutId);
        }

        function updateTotalsUI() {
            let subtotal = 0;
            let totalItems = 0;
            
            document.querySelectorAll('.cart-item').forEach(itemElement => {
                const qtyElement = itemElement.querySelector('.cart-qty-value');
                const quantity = parseInt(qtyElement.dataset.quantity);
                const price = parseFloat(itemElement.dataset.price);
                
                subtotal += price * quantity;
                totalItems++;
            });
            
            document.getElementById('summary-count').textContent = totalItems;
            document.getElementById('summary-subtotal').textContent = formatPrice(subtotal);
            currentTransactionFee = Math.round(subtotal * 0.03 * 100) / 100;
            document.getElementById('summary-fee').textContent = formatPrice(currentTransactionFee);
            document.getElementById('summary-total').textContent = formatPrice(subtotal + currentShippingFee + currentTransactionFee);
        }

        async function saveQuantityToServer(itemId, quantity) {
            try {
                await api.updateCartItem(itemId, quantity);
                
                // Remove from pending updates
                pendingUpdates.delete(itemId);
                updateTimeouts.delete(itemId);
                
                // Sync with server to get accurate totals
                const cartData = await api.getCart();
                
                // Update summary with server data
                document.getElementById('summary-count').textContent = cartData.count;
                document.getElementById('summary-subtotal').textContent = formatPrice(cartData.total);
                document.getElementById('summary-total').textContent = formatPrice(cartData.total);
                
                updateCartBadge();
            } catch (err) {
                // On error, reload cart to sync with server
                showToast(err.message, 'error');
                pendingUpdates.delete(itemId);
                updateTimeouts.delete(itemId);
                loadCart();
            }
        }

        async function removeItem(itemId) {
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            showConfirmModal(
                _t('cart.remove_title'),
                _t('cart.remove_confirm'),
                async () => {
                    // Optimistically remove from UI
                    const itemElement = document.querySelector(`#cart-item-${itemId}`);
                    const itemPrice = parseFloat(itemElement.dataset.price);
                    const itemQty = parseInt(itemElement.querySelector('.cart-qty-value').dataset.quantity);
                    
                    // Fade out animation
                    itemElement.style.opacity = '0.5';
                    itemElement.style.pointerEvents = 'none';
                    
                    // Update totals immediately
                    const summaryCount = document.getElementById('summary-count');
                    const summarySubtotal = document.getElementById('summary-subtotal');
                    const summaryTotal = document.getElementById('summary-total');
                    
                    const currentTotal = parseFloat(summarySubtotal.textContent.replace(/[^0-9.]/g, ''));
                    const newTotal = currentTotal - (itemPrice * itemQty);
                    const newCount = parseInt(summaryCount.textContent) - 1;
                    
                    if (newCount === 0) {
                        // Show empty cart immediately
                        const _t2 = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
                        document.getElementById('cart-items-container').innerHTML = `
                            <div class="cart-empty">
                                <div class="cart-empty-icon">🛒</div>
                                <h2>${_t2('cart.empty')}</h2>
                                <p>${_t2('cart.empty_desc')}</p>
                                <a href="products.html" class="btn btn-primary btn-lg">${_t2('cart.start_shopping')}</a>
                            </div>
                        `;
                        document.getElementById('cart-summary').style.display = 'none';
                    } else {
                        summaryCount.textContent = newCount;
                        summarySubtotal.textContent = formatPrice(Math.max(0, newTotal));
                        summaryTotal.textContent = formatPrice(Math.max(0, newTotal));
                        
                        // Remove element after fade
                        setTimeout(() => itemElement.remove(), 200);
                    }
                    
                    try {
                        // Make API call in background
                        await api.removeCartItem(itemId);
                        showToast(typeof i18n !== 'undefined' ? i18n.t('cart.item_removed') : 'Item removed', 'success');
                        updateCartBadge();
                        
                        // Clear pending updates for this item
                        pendingUpdates.delete(itemId);
                        if (updateTimeouts.has(itemId)) {
                            clearTimeout(updateTimeouts.get(itemId));
                            updateTimeouts.delete(itemId);
                        }
                    } catch (err) {
                        showToast(err.message, 'error');
                        // Reload on error
                        loadCart();
                    }
                }
            );
        }

        async function clearCart() {
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            showConfirmModal(
                _t('cart.clear_title'),
                _t('cart.clear_confirm'),
                async () => {
                    // Optimistically clear UI
                    const container = document.getElementById('cart-items-container');
                    const summary = document.getElementById('cart-summary');
                    
                    container.innerHTML = `
                        <div class="cart-empty">
                            <div class="cart-empty-icon">🛒</div>
                            <h2>${_t('cart.empty')}</h2>
                            <p>${_t('cart.empty_desc')}</p>
                            <a href="products.html" class="btn btn-primary btn-lg">${_t('cart.start_shopping')}</a>
                        </div>
                    `;
                    summary.style.display = 'none';
                    
                    try {
                        // Make API call in background
                        await api.clearCart();
                        showToast(_t('cart.cart_cleared'), 'success');
                        updateCartBadge();
                        
                        // Clear all pending updates
                        pendingUpdates.clear();
                        updateTimeouts.forEach(timeout => clearTimeout(timeout));
                        updateTimeouts.clear();
                    } catch (err) {
                        showToast(err.message, 'error');
                        // Reload on error
                        loadCart();
                    }
                }
            );
        }

        // ── Variant Offcanvas Drawer Handlers ───────────────────────
        let currentCartItems = [];
        let drawerCartItemId = null;
        let drawerVariants = [];
        let drawerSelectedIndex = -1;
        let drawerProduct = null;

        function getProductVariants(product) {
            const rawVariants = product.attributes?.variants;
            if (Array.isArray(rawVariants) && rawVariants.length > 0) {
                const cleaned = rawVariants
                    .filter(v => v && v.variant_name && v.variant_name !== 'Default')
                    .map((v, idx) => ({
                        ...v,
                        index: idx,
                        label: typeof toEnglishProductText === 'function' ? toEnglishProductText(v.variant_name, 'Standard') : v.variant_name,
                    }));

                const shortenLabel = (label) => {
                    const words = label.split(' ');
                    if (words.length > 4) return words.slice(-3).join(' ');
                    return label;
                };

                const labelCount = cleaned.reduce((counts, variant) => {
                    const short = shortenLabel(variant.label);
                    counts[short] = (counts[short] || 0) + 1;
                    return counts;
                }, {});

                return cleaned.map((v, idx) => {
                    const short = shortenLabel(v.label);
                    const displayLabel = labelCount[short] > 1 ? `${short} · ${v.sku_id || idx + 1}` : short;
                    return {
                        ...v,
                        index: idx,
                        displayLabel: displayLabel,
                        shortLabel: displayLabel,
                        price: v.retail_price_usd ? parseFloat(v.retail_price_usd) : parseFloat(product.price),
                        image: v.image_url || product.image_url,
                        stock: v.stock != null ? v.stock : 999,
                        outOfStock: (v.stock || 0) <= 0 && v.stock != null,
                    };
                });
            }
            return [];
        }

        function openVariantDrawer(cartItemId) {
            const item = (currentCartItems || []).find(i => i.id === cartItemId);
            if (!item || !item.products) return;

            drawerCartItemId = cartItemId;
            drawerProduct = item.products;
            drawerVariants = getProductVariants(drawerProduct);

            if (!drawerVariants || drawerVariants.length === 0) {
                showToast('No other variants available for this product', 'info');
                return;
            }

            const currentSelectedVariant = item.selected_options?.variant || '';
            const currentImg = item.selected_options?._selected_image || drawerProduct.image_url;

            drawerSelectedIndex = drawerVariants.findIndex(v =>
                v.shortLabel.toLowerCase() === currentSelectedVariant.toLowerCase() ||
                v.displayLabel.toLowerCase() === currentSelectedVariant.toLowerCase() ||
                (currentImg && v.image === currentImg)
            );
            if (drawerSelectedIndex === -1) drawerSelectedIndex = 0;

            renderVariantDrawer();

            const backdrop = document.getElementById('variant-offcanvas-backdrop');
            const sheet = document.getElementById('variant-offcanvas-sheet');
            if (backdrop) backdrop.classList.add('active');
            if (sheet) sheet.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function renderVariantDrawer() {
            const selectedVar = drawerVariants[drawerSelectedIndex] || drawerVariants[0];

            const thumbEl = document.getElementById('variant-drawer-thumb');
            const titleEl = document.getElementById('variant-drawer-title');
            const priceEl = document.getElementById('variant-drawer-price');
            const subtitleEl = document.getElementById('variant-drawer-subtitle');
            const confirmBtn = document.getElementById('variant-drawer-confirm-btn');

            if (thumbEl) thumbEl.src = selectedVar?.image || drawerProduct.image_url || 'https://via.placeholder.com/200x200?text=No+Image';
            if (titleEl) titleEl.textContent = drawerProduct.name;
            if (priceEl) priceEl.textContent = formatPrice(selectedVar ? selectedVar.price : drawerProduct.price);
            if (subtitleEl) subtitleEl.textContent = `Select Option (${drawerVariants.length} variants available)`;

            if (confirmBtn) {
                if (selectedVar && selectedVar.outOfStock) {
                    confirmBtn.disabled = true;
                    confirmBtn.innerHTML = '<span>Out of Stock</span>';
                } else {
                    confirmBtn.disabled = false;
                    confirmBtn.innerHTML = '<span>Confirm Change</span>';
                }
            }

            const listEl = document.getElementById('variant-drawer-options');
            if (listEl) {
                listEl.innerHTML = drawerVariants.map((v, idx) => {
                    const isSelected = idx === drawerSelectedIndex;
                    const oos = v.outOfStock;
                    return `
                        <div class="variant-option-row${isSelected ? ' selected' : ''}${oos ? ' oos' : ''}" onclick="${oos ? '' : `selectDrawerVariant(${idx})`}">
                            <img class="variant-option-img" src="${v.image || drawerProduct.image_url || 'https://via.placeholder.com/100x100?text=No+Image'}" alt="${v.displayLabel}">
                            <div class="variant-option-info">
                                <div class="variant-option-name">${v.displayLabel}</div>
                                <div class="variant-option-meta">
                                    <span class="variant-option-price">${formatPrice(v.price)}</span>
                                    ${oos ? '<span class="variant-option-stock" style="color:var(--status-danger);">Out of stock</span>' : '<span class="variant-option-stock">In stock</span>'}
                                </div>
                            </div>
                            <div class="variant-option-check">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function selectDrawerVariant(index) {
            if (drawerVariants[index]?.outOfStock) return;
            drawerSelectedIndex = index;
            renderVariantDrawer();
        }

        function closeVariantDrawer() {
            const backdrop = document.getElementById('variant-offcanvas-backdrop');
            const sheet = document.getElementById('variant-offcanvas-sheet');
            if (backdrop) backdrop.classList.remove('active');
            if (sheet) sheet.classList.remove('active');
            document.body.style.overflow = '';
        }

        async function confirmVariantChange() {
            if (drawerSelectedIndex === -1 || !drawerVariants[drawerSelectedIndex]) return;
            const selectedVar = drawerVariants[drawerSelectedIndex];
            if (selectedVar.outOfStock) return;

            const cartItem = (currentCartItems || []).find(i => i.id === drawerCartItemId);
            if (!cartItem) return;

            const confirmBtn = document.getElementById('variant-drawer-confirm-btn');
            if (confirmBtn) {
                confirmBtn.disabled = true;
                confirmBtn.innerHTML = `
                    <span class="spinner" style="display:inline-block; width:16px; height:16px; border:2px solid #ffffff; border-top-color:transparent; border-radius:50%; animation:spin 0.6s linear infinite;"></span>
                    <span>Updating...</span>
                `;
            }

            try {
                const newOptions = { ...(cartItem.selected_options || {}) };
                newOptions.variant = selectedVar.shortLabel;
                if (selectedVar.image) {
                    newOptions._selected_image = selectedVar.image;
                }
                const newPrice = selectedVar.price;

                await api.updateCartItem(drawerCartItemId, {
                    selected_options: newOptions,
                    unit_price: newPrice
                });

                closeVariantDrawer();
                showToast(`Variant updated to ${selectedVar.displayLabel}`, 'success');
                await loadCart();
                updateCartBadge();
            } catch (err) {
                showToast(err.message || 'Failed to update variant', 'error');
                if (confirmBtn) {
                    confirmBtn.disabled = false;
                    confirmBtn.innerHTML = '<span>Confirm Change</span>';
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVariantDrawer();
        });
    </script>
</body>
</html>
