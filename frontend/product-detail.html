<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Product — BuyBIBZ</title>
    <meta name="description" content="View product details, customer reviews, and add to cart.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="product-detail">
        <div class="container">
            <!-- Loading skeleton -->
            <div class="product-detail-grid" id="product-content">
                <div class="product-detail-image-gallery">
                    <div class="main-image-container skeleton" style="aspect-ratio: 1;"></div>
                </div>
                <div>
                    <div class="skeleton" style="height: 40px; width: 80%; margin-bottom: 16px;"></div>
                    <div class="skeleton" style="height: 30px; width: 40%; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="height: 100px; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="height: 50px; width: 60%;"></div>
                </div>
            </div>

            <!-- Reviews Section -->
            <div class="reviews-section" id="reviews-section" style="display: none;">
                <h2>Customer Reviews</h2>
                <div id="reviews-list"></div>

                <div class="review-form" id="review-form-container" style="display: none;">
                    <h3>Write a Review</h3>
                    <form id="review-form">
                        <div class="form-group">
                            <label class="form-label">Rating</label>
                            <div class="star-rating-input" id="star-rating">
                                <span class="star" data-value="1">★</span>
                                <span class="star" data-value="2">★</span>
                                <span class="star" data-value="3">★</span>
                                <span class="star" data-value="4">★</span>
                                <span class="star" data-value="5">★</span>
                            </div>
                            <input type="hidden" id="review-rating" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="review-comment">Your Review</label>
                            <textarea id="review-comment" class="form-textarea" placeholder="Share your experience with this product..." rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Review</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa-install.js"></script>
    <script>
        let productId = null;
        let selectedQty = 1;
        let selectedVariants = {};

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            productId = parseInt(params.get('id'));

            if (!productId) {
                document.getElementById('product-content').innerHTML = `
                    <div style="grid-column:1/-1; text-align: center; padding: var(--space-4xl);">
                        <h2>Product not found</h2>
                        <p class="text-secondary" style="margin-top: var(--space-sm); margin-bottom: var(--space-xl);">The product you're looking for doesn't exist.</p>
                        <a href="products.html" class="btn btn-primary">Browse Products</a>
                    </div>
                `;
                return;
            }

            try {
                const product = await api.getProduct(productId);
                renderProduct(product);
                renderReviews(product.reviews || []);

                document.title = `${product.name} — BuyBIBZ`;
            } catch (err) {
                document.getElementById('product-content').innerHTML = `
                    <div style="grid-column:1/-1; text-align: center; padding: var(--space-4xl);">
                        <h2>Unable to load product</h2>
                        <p class="text-secondary" style="margin-top: var(--space-sm);">${err.message}</p>
                    </div>
                `;
            }
        });

        function renderProduct(product) {
            selectedQty = 1;
            selectedVariants = {};
            const category = product.categories;
            const discount = product.compare_price
                ? Math.round(((product.compare_price - product.price) / product.compare_price) * 100)
                : 0;
            const inStock = product.stock > 0;
            const hasFreeShipping = product.attributes?.free_shipping === true;

            // Handle images - use product_images array if available, otherwise fallback to single image_url
            const images = product.product_images && product.product_images.length > 0
                ? product.product_images.sort((a, b) => a.display_order - b.display_order)
                : [{ image_url: product.image_url || 'https://via.placeholder.com/600x600?text=No+Image', alt_text: product.name }];

            const mainImage = images[0];

            document.getElementById('product-content').innerHTML = `
                <div class="product-detail-image-gallery">
                    <div class="main-image-container">
                        <img src="${mainImage.image_url}" alt="${mainImage.alt_text || product.name}" id="main-product-image" class="main-product-image">
                    </div>
                    ${images.length > 1 ? `
                    <div class="thumbnail-gallery">
                        ${images.map((img, index) => `
                            <div class="thumbnail ${index === 0 ? 'active' : ''}" onclick="selectImage(${index})">
                                <img src="${img.image_url}" alt="${img.alt_text || product.name}">
                            </div>
                        `).join('')}
                    </div>
                    ` : ''}
                </div>
                <div class="product-detail-info">
                    <div class="product-detail-kicker">
                        ${category ? `<span class="product-category-pill">${category.name}</span>` : ''}
                        ${hasFreeShipping ? `<span class="product-free-shipping-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>Free shipping</span>` : ''}
                    </div>
                    <h1>${product.name}</h1>

                    <div class="product-card-rating" style="margin-bottom: var(--space-lg); font-size: 1.1rem;">
                        ${renderStars(product.rating_avg || 0, product.rating_count || 0)}
                    </div>

                    <div class="product-detail-price">
                        <span class="price-current">${formatPrice(product.price)}</span>
                        ${product.compare_price ? `
                            <span class="price-compare">${formatPrice(product.compare_price)}</span>
                            <span class="discount-tag">-${discount}% OFF</span>
                        ` : ''}
                    </div>

                    <p class="product-detail-desc">${product.description || 'No description available.'}</p>

                    <div class="product-detail-meta product-purchase-meta">
                        <div class="product-detail-meta-item">
                            <span class="stock-indicator ${inStock ? 'in-stock' : 'out-of-stock'}"></span>
                            <span class="value">
                                ${inStock ? `${product.stock} available · Ready to ship` : 'Out of stock'}
                            </span>
                        </div>
                    </div>

                    ${renderAttributes(product.attributes)}

                    ${inStock ? `
                    <div class="product-detail-actions">
                        <div class="qty-selector">
                            <button onclick="updateQty(-1)">−</button>
                            <span class="qty-value" id="qty-display">1</span>
                            <button onclick="updateQty(1)">+</button>
                        </div>
                        <button class="btn btn-primary btn-lg" onclick="addSelectedProductToCart(${product.id})" style="flex:1;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                            Add to Cart
                        </button>
                    </div>
                    ` : `
                    <button class="btn btn-secondary btn-lg" disabled style="opacity: 0.5; cursor: not-allowed;">
                        Out of Stock
                    </button>
                    `}
                </div>
            `;

            // Store images in window for selectImage function
            window.productImages = images;
        }

        function selectImage(index) {
            const mainImg = document.getElementById('main-product-image');
            const thumbnails = document.querySelectorAll('.thumbnail');
            
            if (window.productImages && window.productImages[index]) {
                mainImg.src = window.productImages[index].image_url;
                mainImg.alt = window.productImages[index].alt_text || '';
                
                // Update active thumbnail
                thumbnails.forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === index);
                });
            }
        }

        function renderAttributes(attrs) {
            if (!attrs || typeof attrs !== 'object' || Object.keys(attrs).length === 0) return '';

            // Colors and sizes are purchasable variants, not just product facts.
            // The remaining attributes stay as concise product information.
            const ATTR_CONFIG = {
                colors:         { label: 'Colors',          icon: '🎨', type: 'color-swatches' },
                sizes:          { label: 'Sizes',            icon: '📐', type: 'chips' },
                material:       { label: 'Material',         icon: '🧵', type: 'text' },
                weight:         { label: 'Weight',           icon: '⚖️',  type: 'text' },
                warranty:       { label: 'Warranty',         icon: '🛡️',  type: 'text' },
                free_shipping:  { label: 'Free Shipping',    icon: '🚚', type: 'badge' },
                brand:          { label: 'Brand',            icon: '🏷️',  type: 'text' },
                model:          { label: 'Model',            icon: '📦', type: 'text' },
                dimensions:     { label: 'Dimensions',       icon: '📏', type: 'text' },
                gender:         { label: 'Gender',           icon: '👤', type: 'text' },
                age_group:      { label: 'Age Group',        icon: '👶', type: 'text' },
                condition:      { label: 'Condition',        icon: '✅', type: 'text' },
                country_origin: { label: 'Made In',          icon: '🌍', type: 'text' },
            };

            // Color name → CSS color
            const COLOR_MAP = {
                red: '#ef4444', blue: '#3b82f6', green: '#22c55e', black: '#1a1a1a',
                white: '#f5f5f5', yellow: '#eab308', pink: '#ec4899', purple: '#a855f7',
                orange: '#f97316', gray: '#6b7280', grey: '#6b7280', brown: '#92400e',
                navy: '#1e3a5f', beige: '#d4b896', gold: '#d97706', silver: '#9ca3af',
            };

            const ATTRIBUTE_ICONS = {
                colors: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="8.5" r="3.5"/><circle cx="7" cy="15" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path d="M12 3a9 9 0 1 0 8.7 11.3c-.3-1.1-1.6-1.5-2.7-1.2-1.7.5-2.6-.9-1.7-2.2.8-1.2.3-3.1-1.2-3.3A9 9 0 0 0 12 3Z"/></svg>',
                sizes: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 16-16"/><path d="m7 17 2 2M11 13l2 2M15 9l2 2M5 7l2 2M9 3l2 2"/></svg>',
                free_shipping: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>',
                country_origin: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
                default: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg>',
            };

            let optionSections = '';
            let detailSections = '';

            for (const [key, value] of Object.entries(attrs)) {
                if (value === null || value === undefined || value === '') continue;
                // It is featured above the price as a purchase benefit badge.
                if (key === 'free_shipping' && value === true) continue;

                const config = ATTR_CONFIG[key] || { label: key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), icon: '•', type: Array.isArray(value) ? 'chips' : typeof value === 'boolean' ? 'badge' : 'text' };
                const attrIcon = ATTRIBUTE_ICONS[key] || ATTRIBUTE_ICONS.default;

                if (config.type === 'color-swatches' && Array.isArray(value)) {
                    optionSections += `
                        <fieldset class="variant-selector" id="variant-${key}" data-option-label="${config.label.toLowerCase()}">
                            <legend><span class="variant-icon">${attrIcon}</span><span>${config.label}: <strong class="variant-selection-note" id="${key}-selection-note">Select a color</strong></span></legend>
                            <div class="variant-color-options" role="radiogroup" aria-label="Choose a color">
                                ${value.map(c => {
                                    const bg = COLOR_MAP[c.toLowerCase()] || c;
                                    const isLight = ['white','beige','yellow','silver'].includes(c.toLowerCase());
                                    return `<button type="button" class="variant-color-option" style="--swatch-color:${bg}; --swatch-border:${isLight ? '#aab0ac' : bg};" onclick="selectVariant('${key}', '${c}')" aria-label="Choose ${c}" title="${c}"><span></span><b>${c}</b></button>`;
                                }).join('')}
                            </div>
                        </fieldset>`;
                } else if (config.type === 'chips' && Array.isArray(value)) {
                    optionSections += `
                        <fieldset class="variant-selector" id="variant-${key}" data-option-label="${config.label.toLowerCase()}">
                            <legend><span class="variant-icon">${attrIcon}</span><span>${config.label}: <strong class="variant-selection-note" id="${key}-selection-note">Select a size</strong></span></legend>
                            <div class="variant-size-options" role="radiogroup" aria-label="Choose a ${config.label.toLowerCase()}">
                                ${value.map(v => `<button type="button" class="variant-size-option" onclick="selectVariant('${key}', '${v}')">${v}</button>`).join('')}
                            </div>
                        </fieldset>`;
                } else if (config.type === 'badge' && value === true) {
                    detailSections += `
                        <div class="attr-badge-row">
                            <span class="attr-badge">${attrIcon} ${config.label}</span>
                        </div>`;
                } else if (config.type !== 'badge') {
                    detailSections += `
                        <div class="attr-row">
                            <span class="attr-label"><span class="attr-icon">${attrIcon}</span>${config.label}</span>
                            <span class="attr-value">${value}</span>
                        </div>`;
                }
            }

            if (!optionSections && !detailSections) return '';

            return `
                ${optionSections ? `<div class="product-options">${optionSections}</div>` : ''}
                ${detailSections ? `<div class="product-attributes product-facts">${detailSections}</div>` : ''}
            `;
        }

        function updateQty(delta) {
            selectedQty = Math.max(1, selectedQty + delta);
            document.getElementById('qty-display').textContent = selectedQty;
        }

        function selectVariant(type, value) {
            selectedVariants[type] = value;
            const selector = document.getElementById(`variant-${type}`);
            if (!selector) return;

            selector.classList.remove('variant-missing');
            selector.querySelectorAll('button').forEach(button => {
                const buttonValue = type === 'colors'
                    ? button.querySelector('b')?.textContent
                    : button.textContent;
                const isSelected = buttonValue === value;
                button.classList.toggle('selected', isSelected);
                button.setAttribute('aria-checked', String(isSelected));
            });
            const note = document.getElementById(`${type}-selection-note`);
            if (note) note.textContent = value;
        }

        async function addSelectedProductToCart(id) {
            const selectors = Array.from(document.querySelectorAll('.variant-selector'));
            const missing = selectors.filter(selector => !selectedVariants[selector.id.replace('variant-', '')]);
            if (missing.length) {
                missing.forEach(selector => selector.classList.add('variant-missing'));
                missing[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                showToast(`Please choose ${missing.map(selector => selector.dataset.optionLabel).join(' and ')}.`, 'warning');
                return;
            }
            await addToCart(id, selectedQty, selectedVariants);
        }

        function renderReviews(reviews) {
            const section = document.getElementById('reviews-section');
            const list = document.getElementById('reviews-list');
            section.style.display = 'block';

            if (reviews.length > 0) {
                list.innerHTML = reviews.map(review => {
                    const userName = review.profiles?.full_name || 'Anonymous';
                    return `
                        <div class="review-card">
                            <div class="review-header">
                                <div class="review-user">
                                    <div class="review-avatar">${userName.charAt(0).toUpperCase()}</div>
                                    <div>
                                        <div class="review-name">${userName}</div>
                                        <div class="review-date">${formatDate(review.created_at)}</div>
                                    </div>
                                </div>
                                <div class="product-card-rating">
                                    ${renderStars(review.rating)}
                                </div>
                            </div>
                            ${review.comment ? `<p class="review-comment">${review.comment}</p>` : ''}
                        </div>
                    `;
                }).join('');
            } else {
                list.innerHTML = '<p class="text-secondary" style="margin-bottom: var(--space-lg);">No reviews yet. Be the first to review this product!</p>';
            }

            // Show review form if logged in
            if (api.isLoggedIn()) {
                document.getElementById('review-form-container').style.display = 'block';
                initStarRating();
                initReviewForm();
            }
        }

        function initStarRating() {
            const stars = document.querySelectorAll('#star-rating .star');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = parseInt(star.dataset.value);
                    document.getElementById('review-rating').value = value;
                    stars.forEach(s => {
                        s.classList.toggle('active', parseInt(s.dataset.value) <= value);
                    });
                });

                star.addEventListener('mouseover', () => {
                    const value = parseInt(star.dataset.value);
                    stars.forEach(s => {
                        s.style.color = parseInt(s.dataset.value) <= value ? 'var(--status-warning)' : '';
                    });
                });

                star.addEventListener('mouseout', () => {
                    const currentRating = parseInt(document.getElementById('review-rating').value);
                    stars.forEach(s => {
                        s.style.color = '';
                    });
                });
            });
        }

        function initReviewForm() {
            document.getElementById('review-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const rating = parseInt(document.getElementById('review-rating').value);
                const comment = document.getElementById('review-comment').value;

                if (rating === 0) {
                    showToast('Please select a rating', 'warning');
                    return;
                }

                try {
                    await api.createReview(productId, rating, comment);
                    showToast('Review submitted!', 'success');
                    // Reload product to show new review
                    setTimeout(() => window.location.reload(), 500);
                } catch (err) {
                    showToast(err.message, 'error');
                }
            });
        }
    </script>
</body>
</html>
