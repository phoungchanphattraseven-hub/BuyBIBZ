<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Product — BuyBIBZ</title>
    <meta name="description" content="View product details, customer reviews, and add to cart.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="product-detail">
        <div class="container">
            <!-- Loading skeleton -->
            <div class="product-detail-grid" id="product-content">
                <div class="product-detail-image-gallery">
                    <div class="main-image-container skeleton" style="aspect-ratio: 1;"></div>
                </div>
                <div>
                    <div class="skeleton" style="height: 40px; width: 80%; margin-bottom: 16px;"></div>
                    <div class="skeleton" style="height: 30px; width: 40%; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="height: 100px; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="height: 50px; width: 60%;"></div>
                </div>
            </div>

            <!-- Reviews Section -->
            <div class="reviews-section" id="reviews-section" style="display: none;">
                <h2 data-i18n="product.customer_reviews">Customer Reviews</h2>
                <div id="reviews-list"></div>

                <div class="review-form" id="review-form-container" style="display: none;">
                    <h3 data-i18n="product.write_review">Write a Review</h3>
                    <form id="review-form">
                        <div class="form-group">
                            <label class="form-label" data-i18n="product.rating_label">Rating</label>
                            <div class="star-rating-input" id="star-rating">
                                <span class="star" data-value="1">★</span>
                                <span class="star" data-value="2">★</span>
                                <span class="star" data-value="3">★</span>
                                <span class="star" data-value="4">★</span>
                                <span class="star" data-value="5">★</span>
                            </div>
                            <input type="hidden" id="review-rating" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="review-comment" data-i18n="product.your_review">Your Review</label>
                            <textarea id="review-comment" class="form-textarea" data-i18n-placeholder="product.review_placeholder" placeholder="Share your experience with this product..." rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="product.submit_review">Submit Review</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa-install.js"></script>
    <script>
        let productId = null;
        let selectedQty = 1;
        let selectedVariants = {};
        let selectedImageUrl = null; // tracks the image the user clicked in the gallery

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            productId = parseInt(params.get('id'));

            if (!productId) {
                document.getElementById('product-content').innerHTML = `
                    <div style="grid-column:1/-1; text-align: center; padding: var(--space-4xl);">
                        <h2>Product not found</h2>
                        <p class="text-secondary" style="margin-top: var(--space-sm); margin-bottom: var(--space-xl);">The product you're looking for doesn't exist.</p>
                        <a href="products.html" class="btn btn-primary">Browse Products</a>
                    </div>
                `;
                return;
            }

            try {
                const product = await api.getProduct(productId);
                renderProduct(product);
                renderReviews(product.reviews || []);

                document.title = `${product.name} — BuyBIBZ`;
            } catch (err) {
                document.getElementById('product-content').innerHTML = `
                    <div style="grid-column:1/-1; text-align: center; padding: var(--space-4xl);">
                        <h2>Unable to load product</h2>
                        <p class="text-secondary" style="margin-top: var(--space-sm);">${err.message}</p>
                    </div>
                `;
            }
        });

        function renderProduct(product) {
            selectedQty = 1;
            selectedVariants = {};
            const category = product.categories;
            const discount = product.compare_price
                ? Math.round(((product.compare_price - product.price) / product.compare_price) * 100)
                : 0;
            const inStock = product.stock > 0;
            const hasFreeShipping = product.attributes?.free_shipping === true;
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;

            // Handle images - use product_images array if available, otherwise fallback to single image_url
            const images = product.product_images && product.product_images.length > 0
                ? product.product_images.sort((a, b) => a.display_order - b.display_order)
                : [{ image_url: product.image_url || 'https://via.placeholder.com/600x600?text=No+Image', alt_text: product.name }];

            const mainImage = images[0];

            document.getElementById('product-content').innerHTML = `
                <div class="product-detail-image-gallery">
                    <div class="main-image-container">
                        <img src="${mainImage.image_url}" alt="${mainImage.alt_text || product.name}" id="main-product-image" class="main-product-image">
                    </div>
                    ${images.length > 1 ? `
                    <div class="thumbnail-gallery">
                        ${images.map((img, index) => `
                            <div class="thumbnail ${index === 0 ? 'active' : ''}" onclick="selectImage(${index})">
                                <img src="${img.image_url}" alt="${img.alt_text || product.name}">
                            </div>
                        `).join('')}
                    </div>
                    ` : ''}
                </div>
                <div class="product-detail-info">
                    <div class="product-detail-kicker">
                        ${category ? `<span class="product-category-pill">${category.name}</span>` : ''}
                        ${hasFreeShipping ? `<span class="product-free-shipping-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h11v10H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>${_t('product.free_shipping')}</span>` : ''}
                    </div>
                    <h1>${product.name}</h1>

                    <div class="product-card-rating" style="margin-bottom: var(--space-lg); font-size: 1.1rem;">
                        ${renderStars(product.rating_avg || 0, product.rating_count || 0)}
                    </div>

                    <div class="product-detail-price">
                        <span class="price-current">${formatPrice(product.price)}</span>
                        ${product.compare_price ? `
                            <span class="price-compare">${formatPrice(product.compare_price)}</span>
                            <span class="discount-tag">-${discount}% OFF</span>
                        ` : ''}
                    </div>

                    <p class="product-detail-desc">${product.description || 'No description available.'}</p>

                    <div class="product-detail-meta product-purchase-meta">
                        <div class="product-detail-meta-item">
                            <span class="stock-indicator ${inStock ? 'in-stock' : 'out-of-stock'}"></span>
                            <span class="value">
                                ${inStock ? `${product.stock} ${_t('product.available')}` : _t('product.out_of_stock')}
                            </span>
                        </div>
                    </div>

                    ${renderAttributes(product.attributes)}

                    ${inStock ? `
                    <div class="product-detail-actions">
                        <div class="qty-selector">
                            <button onclick="updateQty(-1)">−</button>
                            <span class="qty-value" id="qty-display">1</span>
                            <button onclick="updateQty(1)">+</button>
                        </div>
                        <button class="btn btn-primary btn-lg" onclick="addSelectedProductToCart(${product.id})" style="flex:1;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                            ${_t('product.add_to_cart_btn')}
                        </button>
                    </div>
                    ` : `
                    <button class="btn btn-secondary btn-lg" disabled style="opacity: 0.5; cursor: not-allowed;">
                        ${_t('product.out_of_stock')}
                    </button>
                    `}
                </div>
            `;

            // Store images in window for selectImage function
            window.productImages = images;
            // Default selected image is the first (cover) image
            selectedImageUrl = mainImage.image_url;

            // Auto-select any variant that has only one option (e.g. single dimension, single weight)
            document.querySelectorAll('.variant-selector').forEach(selector => {
                const buttons = selector.querySelectorAll('button');
                if (buttons.length === 1) {
                    const key = selector.id.replace('variant-', '');
                    const buttonValue = selector.querySelector('.variant-color-option b')?.textContent
                        || buttons[0].textContent.trim();
                    selectVariant(key, buttonValue);
                }
            });
        }

        function selectImage(index) {
            const mainImg = document.getElementById('main-product-image');
            const thumbnails = document.querySelectorAll('.thumbnail');
            
            if (window.productImages && window.productImages[index]) {
                mainImg.src = window.productImages[index].image_url;
                mainImg.alt = window.productImages[index].alt_text || '';
                selectedImageUrl = window.productImages[index].image_url; // track selected image
                
                // Update active thumbnail
                thumbnails.forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === index);
                });
            }
        }

        function renderAttributes(attrs) {
            if (!attrs || typeof attrs !== 'object' || Object.keys(attrs).length === 0) return '';

            // Known attributes config: label, icon, how to render
            // type: 'chips' means the value is always selectable (even single-value)
            const ATTR_CONFIG = {
                colors:           { label: 'Colors',         type: 'color-swatches' },
                sizes:            { label: 'Sizes',           type: 'chips' },
                material:         { label: 'Material',        type: 'text' },
                weight:           { label: 'Weight',          type: 'chips' },
                warranty:         { label: 'Warranty',        type: 'text' },
                free_shipping:    { label: 'Free Shipping',   type: 'badge' },
                brand:            { label: 'Brand',           type: 'text' },
                model:            { label: 'Model',           type: 'text' },
                dimensions:       { label: 'Dimensions',      type: 'chips' },
                gender:           { label: 'Gender',          type: 'text' },
                age_group:        { label: 'Age Group',       type: 'text' },
                condition:        { label: 'Condition',       type: 'text' },
                country_origin:   { label: 'Made In',         type: 'text' },
                // ── Taobao-imported fields ──────────────────────
                taobao_item_id:   { label: 'Taobao Item Id',  type: 'text' },
                supplier_cost_usd:{ label: 'Supplier Cost',   type: 'hidden' }, // internal — hide from customers
                variants:         { label: 'Variants',        type: 'hidden' }, // rendered separately as SKU table
            };

            // Color name → CSS color
            const COLOR_MAP = {
                red: '#ef4444', blue: '#3b82f6', green: '#22c55e', black: '#1a1a1a',
                white: '#f5f5f5', yellow: '#eab308', pink: '#ec4899', purple: '#a855f7',
                orange: '#f97316', gray: '#6b7280', grey: '#6b7280', brown: '#92400e',
                navy: '#1e3a5f', beige: '#d4b896', gold: '#d97706', silver: '#9ca3af',
            };

            const ATTRIBUTE_ICONS = {
                colors:         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="19" cy="13" r="2.5"/><circle cx="6.5" cy="19" r="2.5"/><circle cx="13.5" cy="17.5" r="2.5"/><circle cx="8" cy="10" r="2.5"/></svg>',
                sizes:          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>',
                material:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>',
                weight:         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
                warranty:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
                free_shipping:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
                brand:          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
                model:          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
                dimensions:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3H3v7c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V3z"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="12" y1="9" x2="12" y2="15"/></svg>',
                gender:         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>',
                age_group:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
                condition:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
                country_origin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
                default:        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>',
            };

            let optionSections = '';
            let detailSections = '';

            for (const [key, rawValue] of Object.entries(attrs)) {
                if (rawValue === null || rawValue === undefined || rawValue === '') continue;
                // It is featured above the price as a purchase benefit badge.
                if (key === 'free_shipping' && rawValue === true) continue;

                // Look up config first to know if this attr is a selectable type
                const config = ATTR_CONFIG[key] || { label: key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), icon: '•', type: typeof rawValue === 'boolean' ? 'badge' : 'text' };

                // Skip hidden fields (internal data not shown to customers)
                if (config.type === 'hidden') continue;

                const isSelectableType = config.type === 'chips' || config.type === 'color-swatches';

                // Guard: never render plain objects or arrays as text — skip unknown complex values
                if (typeof rawValue === 'object' && !isSelectableType) continue;

                // Normalize value: arrays stay as-is; comma-separated strings get split for chip-type attrs
                let listValues;
                if (Array.isArray(rawValue)) {
                    listValues = rawValue
                        .filter(v => v !== null && v !== undefined && v !== '' && typeof v !== 'object');
                } else if (isSelectableType && typeof rawValue === 'string' && rawValue.includes(',')) {
                    // Split comma-separated string into individual selectable options
                    listValues = rawValue.split(',').map(v => v.trim()).filter(v => v !== '');
                } else {
                    listValues = null;
                }

                const value = listValues
                    ? listValues.map(v => toEnglishProductText(v))
                    : (typeof rawValue === 'string' ? toEnglishProductText(rawValue) : rawValue);

                const attrIcon = ATTRIBUTE_ICONS[key] || ATTRIBUTE_ICONS.default;

                // Build chip values for selectable types (single value also becomes a chip)
                const chipValues = isSelectableType
                    ? (Array.isArray(value) ? value : [value]).filter(v => v !== null && v !== undefined && v !== '')
                    : null;
                const isRenderedAsSelector = isSelectableType && chipValues && chipValues.length > 0;

                const selectNote = `Select ${config.label.toLowerCase()}`;

                if (isRenderedAsSelector && config.type === 'color-swatches') {
                    optionSections += `
                        <fieldset class="variant-selector" id="variant-${key}" data-option-label="${config.label.toLowerCase()}">
                            <legend><span class="variant-icon">${attrIcon}</span><span>${config.label}: <strong class="variant-selection-note" id="${key}-selection-note">${selectNote}</strong></span></legend>
                            <div class="variant-color-options" role="radiogroup" aria-label="Choose a color">
                                ${chipValues.map(c => {
                                    const bg = COLOR_MAP[c.toLowerCase()] || c;
                                    const isLight = ['white','beige','yellow','silver'].includes(c.toLowerCase());
                                    return `<button type="button" class="variant-color-option" style="--swatch-color:${bg}; --swatch-border:${isLight ? '#aab0ac' : bg};" onclick="selectVariant('${key}', '${c}')" aria-label="Choose ${c}" title="${c}"><span></span><b>${c}</b></button>`;
                                }).join('')}
                            </div>
                        </fieldset>`;
                } else if (isRenderedAsSelector) {
                    optionSections += `
                        <fieldset class="variant-selector" id="variant-${key}" data-option-label="${config.label.toLowerCase()}">
                            <legend><span class="variant-icon">${attrIcon}</span><span>${config.label}: <strong class="variant-selection-note" id="${key}-selection-note">${chipValues.length === 1 ? chipValues[0] : selectNote}</strong></span></legend>
                            <div class="variant-size-options" role="radiogroup" aria-label="Choose ${config.label.toLowerCase()}">
                                ${chipValues.map(v => `<button type="button" class="variant-size-option${chipValues.length === 1 ? ' selected' : ''}" onclick="selectVariant('${key}', '${v}')">${v}</button>`).join('')}
                            </div>
                        </fieldset>`;
                } else if (config.type === 'badge' && value === true) {
                    detailSections += `
                        <div class="attr-badge-row">
                            <span class="attr-badge">${attrIcon} ${config.label}</span>
                        </div>`;
                } else if (config.type !== 'badge') {
                    detailSections += `
                        <div class="attr-row">
                            <span class="attr-label"><span class="attr-icon">${attrIcon}</span>${config.label}</span>
                            <span class="attr-value">${value}</span>
                        </div>`;
                }
            }

            if (!optionSections && !detailSections) return '';

            // ── Taobao SKU variant selector ───────────────────────────────────
            // If the product has Taobao variants stored in attributes.variants,
            // render them as a selectable chip group
            let variantSection = '';
            const taobaoVariants = attrs.variants;
            if (Array.isArray(taobaoVariants) && taobaoVariants.length > 0) {
                // Cleaning legacy Chinese names can make multiple SKUs share
                // the same visible label (for example, several "Standard"
                // variants). Give those duplicates a stable SKU suffix so a
                // click selects exactly one chip and one cart option.
                const cleanedVariants = taobaoVariants
                    .filter(v => v && v.variant_name && v.variant_name !== 'Default')
                    .map((v, idx) => ({
                        ...v,
                        index: idx,
                        label: toEnglishProductText(v.variant_name, 'Standard'),
                    }));
                const labelCount = cleanedVariants.reduce((counts, variant) => {
                    counts[variant.label] = (counts[variant.label] || 0) + 1;
                    return counts;
                }, {});

                const variantChips = cleanedVariants
                    .map((v) => {
                        const label = labelCount[v.label] > 1
                            ? `${v.label} · SKU ${v.sku_id || v.index + 1}`
                            : v.label;
                        const price = v.retail_price_usd ? ` — $${v.retail_price_usd}` : '';
                        const outOfStock = (v.stock || 0) === 0;
                        const safeLabel = label.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        return `<button type="button"
                            class="variant-size-option${outOfStock ? ' disabled' : ''}"
                            data-value="${safeLabel}"
                            onclick="${outOfStock ? '' : `selectVariant('variant', '${safeLabel}')`}"
                            ${outOfStock ? 'disabled title="Out of stock"' : ''}
                            data-image="${v.image_url || ''}"
                            data-price="${v.retail_price_usd || ''}"
                        >${label}${price}</button>`;
                    }).join('');

                if (variantChips) {
                    const variantIcon = ATTRIBUTE_ICONS.default;
                    variantSection = `
                        <fieldset class="variant-selector" id="variant-variant" data-option-label="variant">
                            <legend>
                                <span class="variant-icon">${variantIcon}</span>
                                <span>Variant: <strong class="variant-selection-note" id="variant-selection-note">Select variant</strong></span>
                            </legend>
                            <div class="variant-size-options" role="radiogroup" aria-label="Choose a variant">
                                ${variantChips}
                            </div>
                        </fieldset>`;
                }
            }

            return `
                ${variantSection ? `<div class="product-options">${variantSection}</div>` : ''}
                ${optionSections ? `<div class="product-options">${optionSections}</div>` : ''}
                ${detailSections ? `<div class="product-attributes product-facts">${detailSections}</div>` : ''}
            `;
        }

        function updateQty(delta) {
            selectedQty = Math.max(1, selectedQty + delta);
            document.getElementById('qty-display').textContent = selectedQty;
        }

        function selectVariant(type, value) {
            selectedVariants[type] = value;
            const selector = document.getElementById(`variant-${type}`);
            if (!selector) return;

            selector.classList.remove('variant-missing');
            selector.querySelectorAll('button').forEach(button => {
                // Use data-value if present (Taobao variants), else fall back to text
                const buttonValue = button.dataset.value
                    || (type === 'colors'
                        ? button.querySelector('b')?.textContent
                        : button.textContent.split(' — ')[0].trim());
                const isSelected = buttonValue === value;
                button.classList.toggle('selected', isSelected);
                button.setAttribute('aria-checked', String(isSelected));

                // When selected, update the displayed price if variant has its own price
                if (isSelected && button.dataset.price) {
                    const priceEl = document.querySelector('.price-current');
                    if (priceEl) priceEl.textContent = `$${button.dataset.price}`;
                }

                // When selected, update main image if variant has its own image
                if (isSelected && button.dataset.image) {
                    const mainImg = document.getElementById('main-product-image');
                    if (mainImg) {
                        mainImg.src = button.dataset.image;
                        selectedImageUrl = button.dataset.image;
                    }
                }
            });
            const note = document.getElementById(`${type}-selection-note`);
            if (note) note.textContent = typeof toEnglishProductText === 'function'
                ? toEnglishProductText(value, value)
                : value;
        }

        async function addSelectedProductToCart(id) {
            const selectors = Array.from(document.querySelectorAll('.variant-selector'));
            const missing = selectors.filter(selector => !selectedVariants[selector.id.replace('variant-', '')]);
            if (missing.length) {
                missing.forEach(selector => selector.classList.add('variant-missing'));
                missing[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                showToast(`Please choose ${missing.map(selector => selector.dataset.optionLabel).join(' and ')}.`, 'warning');
                return;
            }
            // Include the selected image URL so the cart shows the right image
            const optionsWithImage = { ...selectedVariants };
            if (selectedImageUrl) optionsWithImage._selected_image = selectedImageUrl;
            await addToCart(id, selectedQty, optionsWithImage);
        }

        function renderReviews(reviews) {
            const section = document.getElementById('reviews-section');
            const list = document.getElementById('reviews-list');
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            section.style.display = 'block';

            if (reviews.length > 0) {
                list.innerHTML = reviews.map(review => {
                    const userName = review.profiles?.full_name || 'Anonymous';
                    return `
                        <div class="review-card">
                            <div class="review-header">
                                <div class="review-user">
                                    <div class="review-avatar">${userName.charAt(0).toUpperCase()}</div>
                                    <div>
                                        <div class="review-name">${userName}</div>
                                        <div class="review-date">${formatDate(review.created_at)}</div>
                                    </div>
                                </div>
                                <div class="product-card-rating">
                                    ${renderStars(review.rating)}
                                </div>
                            </div>
                            ${review.comment ? `<p class="review-comment">${review.comment}</p>` : ''}
                        </div>
                    `;
                }).join('');
            } else {
                list.innerHTML = `<p class="text-secondary" style="margin-bottom: var(--space-lg);">${_t('product.no_reviews')}</p>`;
            }

            // Show review form if logged in
            if (api.isLoggedIn()) {
                document.getElementById('review-form-container').style.display = 'block';
                initStarRating();
                initReviewForm();
            }
        }

        function initStarRating() {
            const stars = document.querySelectorAll('#star-rating .star');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = parseInt(star.dataset.value);
                    document.getElementById('review-rating').value = value;
                    stars.forEach(s => {
                        s.classList.toggle('active', parseInt(s.dataset.value) <= value);
                    });
                });

                star.addEventListener('mouseover', () => {
                    const value = parseInt(star.dataset.value);
                    stars.forEach(s => {
                        s.style.color = parseInt(s.dataset.value) <= value ? 'var(--status-warning)' : '';
                    });
                });

                star.addEventListener('mouseout', () => {
                    const currentRating = parseInt(document.getElementById('review-rating').value);
                    stars.forEach(s => {
                        s.style.color = '';
                    });
                });
            });
        }

        function initReviewForm() {
            document.getElementById('review-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
                const rating = parseInt(document.getElementById('review-rating').value);
                const comment = document.getElementById('review-comment').value;

                if (rating === 0) {
                    showToast(_t('product.rating_label'), 'warning');
                    return;
                }

                try {
                    await api.createReview(productId, rating, comment);
                    showToast(_t('product.submit_review'), 'success');
                    // Reload product to show new review
                    setTimeout(() => window.location.reload(), 500);
                } catch (err) {
                    showToast(err.message, 'error');
                }
            });
        }
    </script>
</body>
</html>
