<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Product — BuyBIBZ</title>
    <meta name="description" content="View product details, customer reviews, and add to cart.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="product-detail">
        <div class="container">
            <a class="page-back" href="products.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                <span data-i18n="common.back">Back</span>
            </a>
            <!-- Loading skeleton -->
            <div class="product-detail-grid" id="product-content">
                <div class="product-detail-image-gallery">
                    <div class="main-image-container skeleton" style="aspect-ratio: 1;"></div>
                </div>
                <div>
                    <div class="skeleton" style="height: 40px; width: 80%; margin-bottom: 16px;"></div>
                    <div class="skeleton" style="height: 30px; width: 40%; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="height: 100px; margin-bottom: 24px;"></div>
                    <div class="skeleton" style="height: 50px; width: 60%;"></div>
                </div>
            </div>

            <!-- Reviews Section -->
            <div class="reviews-section" id="reviews-section" style="display: none;">
                <div class="reviews-header">
                    <div class="reviews-heading">
                        <h2 data-i18n="product.customer_reviews">Customer Reviews</h2>
                        <div class="reviews-summary" id="reviews-summary" style="display: none;">
                            <span class="reviews-summary-score" id="reviews-avg-score"></span>
                            <div class="reviews-summary-meta">
                                <span id="reviews-avg-stars"></span>
                                <span class="reviews-summary-count" id="reviews-count-label"></span>
                            </div>
                            <a class="reviews-view-all" id="view-all-reviews-link" href="reviews.html">
                                <span data-i18n="product.view_all_reviews">View all reviews</span>
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                            </a>
                        </div>
                    </div>
                </div>
                <div id="reviews-list" class="reviews-list"></div>

                <div class="review-form" id="review-form-container" style="display: none;">
                    <h3 data-i18n="product.write_review">Write a Review</h3>
                    <form id="review-form">
                        <div class="form-group">
                            <label class="form-label" data-i18n="product.rating_label">Rating</label>
                            <div class="star-rating-input" id="star-rating">
                                <span class="star" data-value="1">★</span>
                                <span class="star" data-value="2">★</span>
                                <span class="star" data-value="3">★</span>
                                <span class="star" data-value="4">★</span>
                                <span class="star" data-value="5">★</span>
                            </div>
                            <input type="hidden" id="review-rating" value="0">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="review-comment" data-i18n="product.your_review">Your Review</label>
                            <textarea id="review-comment" class="form-textarea" data-i18n-placeholder="product.review_placeholder" placeholder="Share your experience with this product..." rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" data-i18n="product.submit_review">Submit Review</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa-install.js"></script>
    <script>
        let productId = null;
        let selectedQty = 1;
        let selectedVariants = {};
        let selectedImageUrl = null; // tracks the image the user clicked in the gallery
        let originalMainImageSrc = null; // stores the original main image for hover restoration

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            productId = parseInt(params.get('id'));

            if (!productId) {
                document.getElementById('product-content').innerHTML = `
                    <div style="grid-column:1/-1; text-align: center; padding: var(--space-4xl);">
                        <h2>Product not found</h2>
                        <p class="text-secondary" style="margin-top: var(--space-sm); margin-bottom: var(--space-xl);">The product you're looking for doesn't exist.</p>
                        <a href="products.html" class="btn btn-primary">Browse Products</a>
                    </div>
                `;
                return;
            }

            try {
                const product = await api.getProduct(productId);
                renderProduct(product);
                renderReviews(product.reviews || [], product);

                document.title = `${product.name} — BuyBIBZ`;
            } catch (err) {
                document.getElementById('product-content').innerHTML = `
                    <div style="grid-column:1/-1; text-align: center; padding: var(--space-4xl);">
                        <h2>Unable to load product</h2>
                        <p class="text-secondary" style="margin-top: var(--space-sm);">${err.message}</p>
                    </div>
                `;
            }
        });

        function renderProduct(product) {
            selectedQty = 1;
            selectedVariants = {};
            originalMainImageSrc = null; // Reset original image for new product
            const category = product.categories;
            const discount = product.compare_price
                ? Math.round(((product.compare_price - product.price) / product.compare_price) * 100)
                : 0;
            const inStock = product.stock > 0;
            const hasFreeShipping = product.attributes?.free_shipping === true;
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;

            // Build image list — priority:
            // 1. product_images table rows (with display_order, alt_text)
            // 2. product.images column (plain URL array from CJ import)
            // 3. product.image_url fallback
            let images;
            if (product.product_images && product.product_images.length > 0) {
                images = product.product_images
                    .sort((a, b) => a.display_order - b.display_order)
                    .map(img => ({ image_url: img.image_url, alt_text: img.alt_text || product.name }));
            } else if (product.images && product.images.length > 0) {
                images = product.images.map((url, i) => ({
                    image_url: url,
                    alt_text: `${product.name} — image ${i + 1}`
                }));
            } else {
                images = [{ image_url: product.image_url || 'https://via.placeholder.com/600x600?text=No+Image', alt_text: product.name }];
            }

            const mainImage = images[0];

            document.getElementById('product-content').innerHTML = `
                <div class="product-detail-image-gallery">
                    <div class="pd-gallery-layout">
                        ${images.length > 1 ? `
                        <div class="pd-thumbnails-vertical">
                            ${images.map((img, i) => `
                                <button class="pd-thumb ${i === 0 ? 'active' : ''}" onclick="selectImage(${i})" aria-label="View image ${i+1}">
                                    <img src="${img.image_url}" alt="${img.alt_text || product.name}" loading="lazy" referrerpolicy="no-referrer">
                                </button>
                            `).join('')}
                        </div>` : ''}
                        <div class="pd-main-image-wrap">
                            <div class="pd-main-image-container">
                                <img src="${mainImage.image_url}" alt="${mainImage.alt_text || product.name}" id="main-product-image" class="main-product-image" referrerpolicy="no-referrer">
                            </div>
                            ${discount > 0 ? `<span class="pd-discount-badge">-${discount}%</span>` : ''}
                            ${!inStock ? `<div class="pd-oos-overlay"><span>Out of Stock</span></div>` : ''}
                        </div>
                    </div>
                    ${images.length > 1 ? `
                    <div class="thumbnail-gallery pd-thumbnails-horizontal">
                        ${images.map((img, i) => `
                            <div class="thumbnail ${i === 0 ? 'active' : ''}" onclick="selectImage(${i})">
                                <img src="${img.image_url}" alt="${img.alt_text || product.name}" loading="lazy" referrerpolicy="no-referrer">
                            </div>
                        `).join('')}
                    </div>` : ''}
                </div>

                <div class="product-detail-info">
                    <!-- Breadcrumb -->
                    <nav class="pd-breadcrumb" aria-label="Breadcrumb">
                        <a href="index.html">Home</a>
                        <span aria-hidden="true">›</span>
                        ${category ? `<a href="products.html?category=${category.id}">${category.name}</a><span aria-hidden="true">›</span>` : ''}
                        <span class="pd-breadcrumb-current">${product.name}</span>
                    </nav>

                    <!-- Badges row -->
                    <div class="product-detail-kicker">
                        ${category ? `<span class="product-category-pill">${category.name}</span>` : ''}
                        ${hasFreeShipping ? `<span class="product-free-shipping-badge"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>Free Shipping</span>` : ''}
                    </div>

                    <!-- Title -->
                    <h1 class="pd-title">${product.name}</h1>

                    <!-- Rating -->
                    <div class="pd-rating-row">
                        ${renderStars(product.rating_avg || 0, product.rating_count || 0)}
                        ${product.rating_count > 0 ? `<span class="pd-rating-link" onclick="document.getElementById('reviews-section').scrollIntoView({behavior:'smooth'})">${product.rating_count} review${product.rating_count !== 1 ? 's' : ''}</span>` : '<span class="pd-rating-none">No reviews yet</span>'}
                    </div>

                    <!-- Price -->
                    <div class="product-detail-price">
                        <span class="price-current">${formatPrice(product.price)}</span>
                        ${product.compare_price ? `
                            <span class="price-compare">${formatPrice(product.compare_price)}</span>
                            <span class="discount-tag">-${discount}% OFF</span>
                        ` : ''}
                    </div>

                    <!-- Stock indicator -->
                    <div class="pd-stock-row">
                        <span class="stock-indicator ${inStock ? 'in-stock' : 'out-of-stock'}"></span>
                        <span class="pd-stock-label ${inStock ? 'text-success' : 'text-danger'}">
                            ${inStock ? `In Stock <span class="pd-stock-count">(${product.stock} available)</span>` : 'Out of Stock'}
                        </span>
                    </div>

                    <!-- Description -->
                    <div class="pd-description-wrap">
                        <div class="pd-description" id="pd-description"></div>
                        <button class="pd-desc-toggle" id="pd-desc-toggle" onclick="toggleDescription()" style="display:none">Show more</button>
                    </div>

                    <!-- Divider -->
                    <div class="pd-divider"></div>

                    <!-- Variants / Attributes -->
                    ${renderAttributes(product.attributes)}

                    <!-- Actions -->
                    ${inStock ? `
                    <div class="product-detail-actions">
                        <div class="qty-selector" aria-label="Quantity">
                            <button onclick="updateQty(-1)" aria-label="Decrease quantity">−</button>
                            <span class="qty-value" id="qty-display">1</span>
                            <button onclick="updateQty(1)" aria-label="Increase quantity">+</button>
                        </div>
                        <button class="btn btn-primary btn-lg pd-add-btn" onclick="addSelectedProductToCart(${product.id})">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>
                            Add to Cart
                        </button>
                    </div>
                    ` : `
                    <button class="btn btn-secondary btn-lg" disabled style="opacity:0.5;cursor:not-allowed;width:100%;margin-bottom:var(--space-xl);">
                        Out of Stock
                    </button>
                    `}

                    <!-- Trust badges -->
                    <div class="pd-trust-badges">
                        <div class="pd-trust-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <span>Secure Checkout</span>
                        </div>
                        <div class="pd-trust-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
                            <span>Fast Delivery</span>
                        </div>
                        <div class="pd-trust-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                            <span>Easy Returns</span>
                        </div>
                    </div>

                    <!-- CJ detail images gallery (populated after render) -->
                    <div class="pd-detail-gallery" id="pd-detail-gallery" style="display:none;"></div>
                </div>
            `;

            // Set description safely (may contain HTML from CJ)
            const descEl = document.getElementById('pd-description');
            if (descEl) {
                const raw = product.description || '';

                // Parse the description HTML
                const parser = new DOMParser();
                const doc = parser.parseFromString(raw, 'text/html');

                // Separate images from text content
                const allImgs = Array.from(doc.querySelectorAll('img'));
                const descImgUrls = allImgs
                    .map(img => img.src || img.getAttribute('src') || '')
                    .filter(src => src && src.startsWith('http'));

                // Remove img tags from description to keep only text
                allImgs.forEach(img => {
                    const parent = img.parentElement;
                    img.remove();
                    // Remove empty wrapper elements left behind
                    if (parent && parent !== doc.body && parent.innerHTML.trim() === '') {
                        parent.remove();
                    }
                });

                const textContent = doc.body.innerHTML.trim();

                // Render text description
                if (textContent && textContent !== '<br>' && textContent.length > 5) {
                    descEl.innerHTML = textContent;
                    requestAnimationFrame(() => {
                        const toggleBtn = document.getElementById('pd-desc-toggle');
                        if (toggleBtn && descEl.scrollHeight > descEl.clientHeight + 10) {
                            toggleBtn.style.display = 'flex';
                            toggleBtn.innerHTML = `Show more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
                        }
                    });
                } else {
                    descEl.closest('.pd-description-wrap').style.display = 'none';
                }

                // Render CJ detail images gallery below add-to-cart
                const galleryEl = document.getElementById('pd-detail-gallery');
                if (galleryEl && descImgUrls.length > 0) {
                    const PREVIEW = 3; // show 3 images before "Show more"
                    const hasMore = descImgUrls.length > PREVIEW;

                    galleryEl.innerHTML = `
                        <div class="pd-detail-gallery-header">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                            Product Details
                            <span class="pd-detail-gallery-count">${descImgUrls.length} photos</span>
                        </div>
                        <div class="pd-detail-gallery-grid" id="pd-gallery-grid">
                            ${descImgUrls.map((src, i) => `
                                <div class="pd-detail-img-item ${i >= PREVIEW ? 'pd-detail-img-hidden' : ''}" data-index="${i}">
                                    <img src="${src}" alt="${product.name} detail ${i + 1}" loading="lazy" referrerpolicy="no-referrer">
                                </div>
                            `).join('')}
                        </div>
                        ${hasMore ? `
                        <button class="pd-detail-gallery-toggle" id="pd-gallery-toggle" onclick="toggleGallery()">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
                            Show all ${descImgUrls.length} photos
                        </button>
                        ` : ''}
                    `;
                    galleryEl.style.display = 'block';

                    // Click any detail image to zoom fullscreen
                    galleryEl.addEventListener('click', e => {
                        const img = e.target.closest('.pd-detail-img-item')?.querySelector('img');
                        if (!img) return;
                        const overlay = document.createElement('div');
                        overlay.className = 'pd-img-zoomed';
                        overlay.innerHTML = `<img src="${img.src}" alt="${img.alt}" referrerpolicy="no-referrer">`;
                        overlay.addEventListener('click', () => overlay.remove());
                        document.body.appendChild(overlay);
                    });
                }
            }

            window.productImages = images;
            selectedImageUrl = mainImage.image_url;
            originalMainImageSrc = mainImage.image_url; // Initialize original image

            // Auto-select any variant that has only one option (e.g. single dimension, single weight)
            document.querySelectorAll('.variant-selector').forEach(selector => {
                const buttons = selector.querySelectorAll('button');
                if (buttons.length === 1) {
                    const key = selector.id.replace('variant-', '');
                    const buttonValue = selector.querySelector('.variant-color-option b')?.textContent
                        || buttons[0].textContent.trim();
                    selectVariant(key, buttonValue);
                }
            });

            // Hover a variant chip → preview its image; click → select + price update
            wireVariantHoverPreview();
        }

        function toggleGallery() {
            const grid = document.getElementById('pd-gallery-grid');
            const btn = document.getElementById('pd-gallery-toggle');
            if (!grid || !btn) return;
            const hidden = grid.querySelectorAll('.pd-detail-img-hidden');
            const isExpanded = hidden.length === 0;
            if (isExpanded) {
                // Collapse — hide items after PREVIEW
                grid.querySelectorAll('.pd-detail-img-item').forEach((el, i) => {
                    if (i >= 3) el.classList.add('pd-detail-img-hidden');
                });
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg> Show all photos`;
                btn.classList.remove('expanded');
            } else {
                // Expand all
                hidden.forEach(el => el.classList.remove('pd-detail-img-hidden'));
                btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg> Show less`;
                btn.classList.add('expanded');
            }
        }

        function toggleDescription() {
            const desc = document.getElementById('pd-description');
            const btn = document.getElementById('pd-desc-toggle');
            if (!desc || !btn) return;
            const isExpanded = desc.classList.toggle('pd-description--expanded');
            btn.classList.toggle('expanded', isExpanded);
            btn.innerHTML = isExpanded
                ? `Show less <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`
                : `Show more <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>`;
        }

        function selectImage(index) {
            const mainImg = document.getElementById('main-product-image');
            if (window.productImages && window.productImages[index]) {
                mainImg.src = window.productImages[index].image_url;
                mainImg.alt = window.productImages[index].alt_text || '';
                selectedImageUrl = window.productImages[index].image_url;
                originalMainImageSrc = window.productImages[index].image_url; // Update original to current selection
                document.querySelectorAll('.pd-thumb, .thumbnail').forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === index);
                });
            }
        }

        function renderAttributes(attrs) {
            if (!attrs || typeof attrs !== 'object' || Object.keys(attrs).length === 0) return '';

            // Known attributes config: label, icon, how to render
            // type: 'chips' means the value is always selectable (even single-value)
            const ATTR_CONFIG = {
                colors:           { label: 'Colors',         type: 'color-swatches' },
                sizes:            { label: 'Sizes',           type: 'chips' },
                material:         { label: 'Material',        type: 'text' },
                weight:           { label: 'Weight',          type: 'chips' },
                warranty:         { label: 'Warranty',        type: 'text' },
                free_shipping:    { label: 'Free Shipping',   type: 'hidden' },
                brand:            { label: 'Brand',           type: 'hidden' },
                model:            { label: 'Model',           type: 'text' },
                dimensions:       { label: 'Dimensions',      type: 'chips' },
                gender:           { label: 'Gender',          type: 'text' },
                age_group:        { label: 'Age Group',       type: 'text' },
                condition:        { label: 'Condition',       type: 'text' },
                country_origin:   { label: 'Made In',         type: 'text' },
                // ── CJ / Taobao-imported fields ──────────────────────
                cj_pid:           { label: 'CJ PID',          type: 'hidden' },
                sku:              { label: 'SKU',              type: 'hidden' },
                category:         { label: 'Category',         type: 'hidden' },
                taobao_item_id:   { label: 'Taobao Item Id',   type: 'hidden' },
                supplier_cost_usd:{ label: 'Supplier Cost',    type: 'hidden' },
                variants:         { label: 'Variants',         type: 'hidden' },
            };

            // Color name → CSS color
            const COLOR_MAP = {
                red: '#ef4444', blue: '#3b82f6', green: '#22c55e', black: '#1a1a1a',
                white: '#f5f5f5', yellow: '#eab308', pink: '#ec4899', purple: '#a855f7',
                orange: '#f97316', gray: '#6b7280', grey: '#6b7280', brown: '#92400e',
                navy: '#1e3a5f', beige: '#d4b896', gold: '#d97706', silver: '#9ca3af',
            };

            const ATTRIBUTE_ICONS = {
                colors:         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="19" cy="13" r="2.5"/><circle cx="6.5" cy="19" r="2.5"/><circle cx="13.5" cy="17.5" r="2.5"/><circle cx="8" cy="10" r="2.5"/></svg>',
                sizes:          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>',
                material:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.57a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.57a2 2 0 0 0-1.34-2.23z"/></svg>',

                warranty:       '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',

                brand:          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>',
                model:          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>',
                dimensions:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 3H3v7c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V3z"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="12" y1="9" x2="12" y2="15"/></svg>',
                gender:         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>',
                age_group:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
                condition:      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>',
                country_origin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
                default:        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>',
            };

            let optionSections = '';
            let detailSections = '';

            for (const [key, rawValue] of Object.entries(attrs)) {
                if (rawValue === null || rawValue === undefined || rawValue === '') continue;
                // It is featured above the price as a purchase benefit badge.
                if (key === 'free_shipping' && rawValue === true) continue;

                // Look up config first to know if this attr is a selectable type
                const config = ATTR_CONFIG[key] || { label: key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()), icon: '•', type: typeof rawValue === 'boolean' ? 'badge' : 'text' };

                // Skip hidden fields (internal data not shown to customers)
                if (config.type === 'hidden') continue;

                // Skip any value that is a URL (internal supplier/product links)
                if (typeof rawValue === 'string' && /^https?:\/\//i.test(rawValue.trim())) continue;

                // Skip keys that look like internal IDs or links even if not in config
                if (/url|link|_id$|pid$|item_id/i.test(key) && !(ATTR_CONFIG[key]?.type === 'chips' || ATTR_CONFIG[key]?.type === 'color-swatches')) continue;

                const isSelectableType = config.type === 'chips' || config.type === 'color-swatches';

                // Guard: never render plain objects or arrays as text — skip unknown complex values
                if (typeof rawValue === 'object' && !isSelectableType) continue;

                // Normalize value: arrays stay as-is; comma-separated strings get split for chip-type attrs
                let listValues;
                if (Array.isArray(rawValue)) {
                    listValues = rawValue
                        .filter(v => v !== null && v !== undefined && v !== '' && typeof v !== 'object');
                } else if (isSelectableType && typeof rawValue === 'string' && rawValue.includes(',')) {
                    // Split comma-separated string into individual selectable options
                    listValues = rawValue.split(',').map(v => v.trim()).filter(v => v !== '');
                } else {
                    listValues = null;
                }

                const value = listValues
                    ? listValues.map(v => toEnglishProductText(v))
                    : (typeof rawValue === 'string' ? toEnglishProductText(rawValue) : rawValue);

                const attrIcon = ATTRIBUTE_ICONS[key] || ATTRIBUTE_ICONS.default;

                // Build chip values for selectable types (single value also becomes a chip)
                const chipValues = isSelectableType
                    ? (Array.isArray(value) ? value : [value]).filter(v => v !== null && v !== undefined && v !== '')
                    : null;
                const isRenderedAsSelector = isSelectableType && chipValues && chipValues.length > 0;

                const selectNote = `Select ${config.label.toLowerCase()}`;

                if (isRenderedAsSelector && config.type === 'color-swatches') {
                    optionSections += `
                        <fieldset class="variant-selector" id="variant-${key}" data-option-label="${config.label.toLowerCase()}">
                            <legend><span class="variant-icon">${attrIcon}</span><span>${config.label}: <strong class="variant-selection-note" id="${key}-selection-note">${selectNote}</strong></span></legend>
                            <div class="variant-color-options" role="radiogroup" aria-label="Choose a color">
                                ${chipValues.map(c => {
                                    const bg = COLOR_MAP[c.toLowerCase()] || c;
                                    const isLight = ['white','beige','yellow','silver'].includes(c.toLowerCase());
                                    return `<button type="button" class="variant-color-option" style="--swatch-color:${bg}; --swatch-border:${isLight ? '#aab0ac' : bg};" onclick="selectVariant('${key}', '${c}')" aria-label="Choose ${c}" title="${c}"><span></span><b>${c}</b></button>`;
                                }).join('')}
                            </div>
                        </fieldset>`;
                } else if (isRenderedAsSelector) {
                    optionSections += `
                        <fieldset class="variant-selector" id="variant-${key}" data-option-label="${config.label.toLowerCase()}">
                            <legend><span class="variant-icon">${attrIcon}</span><span>${config.label}: <strong class="variant-selection-note" id="${key}-selection-note">${chipValues.length === 1 ? chipValues[0] : selectNote}</strong></span></legend>
                            <div class="variant-size-options" role="radiogroup" aria-label="Choose ${config.label.toLowerCase()}">
                                ${chipValues.map(v => `<button type="button" class="variant-size-option${chipValues.length === 1 ? ' selected' : ''}" onclick="selectVariant('${key}', '${v}')">${v}</button>`).join('')}
                            </div>
                        </fieldset>`;
                } else if (config.type === 'badge' && value === true) {
                    detailSections += `
                        <div class="attr-badge-row">
                            <span class="attr-badge">${attrIcon} ${config.label}</span>
                        </div>`;
                } else if (config.type !== 'badge') {
                    detailSections += `
                        <div class="attr-row">
                            <span class="attr-label"><span class="attr-icon">${attrIcon}</span>${config.label}</span>
                            <span class="attr-value">${value}</span>
                        </div>`;
                }
            }

            // ── CJ / Taobao SKU variant selector ─────────────────────────────
            // Build BEFORE the early-return so products that only have variants
            // (and no other attributes) still render the selector.
            let variantSection = '';
            const taobaoVariants = attrs.variants;
            if (Array.isArray(taobaoVariants) && taobaoVariants.length > 0) {
                const cleanedVariants = taobaoVariants
                    .filter(v => v && v.variant_name && v.variant_name !== 'Default')
                    .map((v, idx) => ({
                        ...v,
                        index: idx,
                        label: toEnglishProductText(v.variant_name, 'Standard'),
                    }));

                // Find the common prefix shared by all variant labels and strip it
                // so "Vacuum Cleaner Black" and "Vacuum Cleaner White" → "Black" / "White"
                const allLabels = cleanedVariants.map(v => v.label);
                let commonWords = allLabels.length > 1
                    ? allLabels[0].split(' ').filter(word =>
                        word.length > 1 && allLabels.every(l => l.startsWith(word) || l.includes(' ' + word + ' ') || l.endsWith(' ' + word))
                        && allLabels.filter(l => !l.includes(word)).length === 0
                    )
                    : [];
                // Simple prefix strip: find how many leading words all labels share
                const firstWords = allLabels[0].split(' ');
                let prefixLen = 0;
                for (let i = 0; i < firstWords.length; i++) {
                    if (allLabels.every(l => l.split(' ')[i] === firstWords[i])) {
                        prefixLen = i + 1;
                    } else break;
                }
                const stripPrefix = prefixLen > 0 && prefixLen < firstWords.length
                    ? firstWords.slice(0, prefixLen).join(' ')
                    : '';

                const shortenLabel = (label) => {
                    // First try prefix stripping
                    if (stripPrefix && label.startsWith(stripPrefix)) {
                        const stripped = label.slice(stripPrefix.length).trim();
                        if (stripped) return stripped;
                    }
                    // Fallback: if label is long (> 4 words), take the last 3 words
                    // This handles CJ names like "Vacuum Cleaner ... A White Wireless" → "A White Wireless"
                    const words = label.split(' ');
                    if (words.length > 4) {
                        return words.slice(-3).join(' ');
                    }
                    return label;
                };

                const labelCount = cleanedVariants.reduce((counts, variant) => {
                    const short = shortenLabel(variant.label);
                    counts[short] = (counts[short] || 0) + 1;
                    return counts;
                }, {});

                const variantChips = cleanedVariants
                    .map((v, i) => {
                        const shortLabel = shortenLabel(v.label);
                        const displayLabel = labelCount[shortLabel] > 1
                            ? `${shortLabel} · ${v.sku_id || i + 1}`
                            : shortLabel;
                        const outOfStock = (v.stock || 0) === 0;
                        // Store short label as value so cart shows "White Wireless" not full product name
                        const safeLabel = displayLabel.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                        return `<button type="button"
                            class="variant-size-option pd-variant-chip${outOfStock ? ' oos' : ''}"
                            data-value="${safeLabel}"
                            onclick="${outOfStock ? '' : `selectVariant('variant', '${safeLabel}')`}"
                            ${outOfStock ? 'disabled title="Out of stock"' : ''}
                            data-image="${v.image_url || ''}"
                            data-price="${v.retail_price_usd || ''}"
                        >${displayLabel}${v.retail_price_usd ? `<span class="pd-chip-price">$${parseFloat(v.retail_price_usd).toFixed(2)}</span>` : ''}${outOfStock ? '<span class="pd-chip-oos">Out of stock</span>' : ''}</button>`;
                    }).join('');

                if (variantChips) {
                    const variantIcon = ATTRIBUTE_ICONS.default;
                    variantSection = `
                        <fieldset class="variant-selector" id="variant-variant" data-option-label="variant">
                            <legend>
                                <span class="variant-icon">${variantIcon}</span>
                                <span>Variant: <strong class="variant-selection-note" id="variant-selection-note">Select variant</strong></span>
                            </legend>
                            <div class="variant-size-options" role="radiogroup" aria-label="Choose a variant">
                                ${variantChips}
                            </div>
                        </fieldset>`;
                }
            }

            if (!variantSection && !optionSections && !detailSections) return '';

            return `
                ${variantSection ? `<div class="product-options">${variantSection}</div>` : ''}
                ${optionSections ? `<div class="product-options">${optionSections}</div>` : ''}
                ${detailSections ? `<div class="product-attributes product-facts">${detailSections}</div>` : ''}
            `;
        }

        function updateQty(delta) {
            selectedQty = Math.max(1, selectedQty + delta);
            document.getElementById('qty-display').textContent = selectedQty;
        }

        function selectVariant(type, value) {
            const selector = document.getElementById(`variant-${type}`);
            if (!selector) return;

            // Toggle: clicking an already-selected variant deselects it
            const isAlreadySelected = selectedVariants[type] === value;
            if (isAlreadySelected) {
                delete selectedVariants[type];
                selector.querySelectorAll('button').forEach(btn => {
                    btn.classList.remove('selected');
                    btn.setAttribute('aria-checked', 'false');
                });
                const note = document.getElementById(`${type}-selection-note`);
                if (note) note.textContent = `Select ${selector.dataset.optionLabel || type}`;
                closeVariantPopup();
                return;
            }

            selectedVariants[type] = value;
            selector.classList.remove('variant-missing');
            selector.querySelectorAll('button').forEach(button => {
                const buttonValue = button.dataset.value
                    || (type === 'colors'
                        ? button.querySelector('b')?.textContent
                        : button.textContent.split(' — ')[0].trim());
                const isSelected = buttonValue === value;
                button.classList.toggle('selected', isSelected);
                button.setAttribute('aria-checked', String(isSelected));

                if (isSelected && button.dataset.price) {
                    const priceEl = document.querySelector('.price-current');
                    if (priceEl) priceEl.textContent = `$${button.dataset.price}`;
                }

                if (isSelected && button.dataset.image) {
                    const mainImg = document.getElementById('main-product-image');
                    if (mainImg) {
                        mainImg.src = button.dataset.image;
                        selectedImageUrl = button.dataset.image;
                        originalMainImageSrc = button.dataset.image; // Update original to current selection
                    }
                    showVariantImagePopup(button.dataset.image, value, button.dataset.price);
                }
            });

            const note = document.getElementById(`${type}-selection-note`);
            if (note) note.textContent = typeof toEnglishProductText === 'function'
                ? toEnglishProductText(value, value)
                : value;
        }

        let _variantPopupTimer = null;
        let _variantScrollListener = null;
        let _variantPopupIsHover = false;

        // Popup sound effect using Web Audio API
        function playPopupSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // Create a pleasant notification sound
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(600, audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.15);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.15);
            } catch (e) {
                // Silently fail if audio is not supported
                console.log('Audio not supported:', e);
            }
        }

        // Close sound effect
        function playCloseSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                // Create a gentle close sound
                oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(300, audioContext.currentTime + 0.08);
                
                gainNode.gain.setValueAtTime(0.08, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                // Silently fail if audio is not supported
                console.log('Audio not supported:', e);
            }
        }

        function showVariantImagePopup(imgSrc, label, price, opts = {}) {
            // Hover previews pass { silent: true } so they don't beep
            if (!opts.silent) playPopupSound();

            // Remove any existing popup and listeners
            const existing = document.getElementById('variant-img-popup');
            if (existing) existing.remove();
            if (_variantPopupTimer) { clearTimeout(_variantPopupTimer); _variantPopupTimer = null; }
            if (_variantScrollListener) { window.removeEventListener('scroll', _variantScrollListener); _variantScrollListener = null; }

            const popup = document.createElement('div');
            popup.id = 'variant-img-popup';
            popup.className = 'variant-img-popup';
            popup.setAttribute('role', 'dialog');
            popup.setAttribute('aria-label', 'Selected variant preview');
            _variantPopupIsHover = !!opts.silent;

            const cleanLabel = typeof toEnglishProductText === 'function'
                ? toEnglishProductText(label, label)
                : label;

            popup.innerHTML = `
                <button class="variant-img-popup-close" onclick="closeVariantPopup()" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
                <div class="variant-img-popup-img-wrap">
                    <img src="${imgSrc}" alt="${cleanLabel}" referrerpolicy="no-referrer">
                </div>
                <div class="variant-img-popup-info">
                    <span class="variant-img-popup-label">${cleanLabel}</span>
                    ${price ? `<span class="variant-img-popup-price">$${parseFloat(price).toFixed(2)}</span>` : ''}
                </div>
                <div class="variant-img-popup-hint">Scroll up to see full image</div>
            `;

            document.body.appendChild(popup);
            requestAnimationFrame(() => popup.classList.add('show'));

            // Auto-dismiss when user scrolls up to see the main product image
            const mainImg = document.getElementById('main-product-image');
            _variantScrollListener = () => {
                if (!mainImg) return;
                const rect = mainImg.getBoundingClientRect();
                // Main image is visible in viewport
                if (rect.top >= 0 && rect.bottom <= window.innerHeight) {
                    closeVariantPopup();
                }
            };
            window.addEventListener('scroll', _variantScrollListener, { passive: true });
        }

        function closeVariantPopup(silent = false) {
            // Play close sound (skipped for hover previews)
            if (!silent) playCloseSound();

            const popup = document.getElementById('variant-img-popup');
            if (popup) {
                popup.classList.remove('show');
                setTimeout(() => popup.remove(), 300);
            }
            _variantPopupIsHover = false;
            if (_variantPopupTimer) { clearTimeout(_variantPopupTimer); _variantPopupTimer = null; }
            if (_variantScrollListener) { window.removeEventListener('scroll', _variantScrollListener); _variantScrollListener = null; }
        }

        // Hover preview: change the main image to the variant's image without selecting it.
        // Clicking the chip still runs selectVariant() (price + main image update + popup).
        function wireVariantHoverPreview() {
            document.querySelectorAll('.variant-selector button[data-image]').forEach(chip => {
                if (chip.dataset.hoverWired) return;
                chip.dataset.hoverWired = '1';
                
                chip.addEventListener('mouseenter', () => {
                    const mainImg = document.getElementById('main-product-image');
                    if (mainImg && chip.dataset.image) {
                        // Store original image on first hover
                        if (!originalMainImageSrc) {
                            originalMainImageSrc = mainImg.src;
                        }
                        // Change main image to variant image
                        mainImg.src = chip.dataset.image;
                    }
                });
                
                chip.addEventListener('mouseleave', () => {
                    const mainImg = document.getElementById('main-product-image');
                    if (mainImg && originalMainImageSrc) {
                        // Restore original image
                        mainImg.src = originalMainImageSrc;
                    }
                });
            });
            
            // Also wire thumbnail gallery for hover functionality
            document.querySelectorAll('.thumbnail, .pd-thumb').forEach(thumb => {
                if (thumb.dataset.hoverWired) return;
                thumb.dataset.hoverWired = '1';
                
                thumb.addEventListener('mouseenter', () => {
                    const img = thumb.querySelector('img');
                    const mainImg = document.getElementById('main-product-image');
                    if (img && mainImg && img.src) {
                        // Store original image on first hover
                        if (!originalMainImageSrc) {
                            originalMainImageSrc = mainImg.src;
                        }
                        mainImg.src = img.src;
                    }
                });
                
                thumb.addEventListener('mouseleave', () => {
                    const mainImg = document.getElementById('main-product-image');
                    if (mainImg && originalMainImageSrc) {
                        // Restore original image
                        mainImg.src = originalMainImageSrc;
                    }
                });
            });
        }

        async function addSelectedProductToCart(id) {
            const selectors = Array.from(document.querySelectorAll('.variant-selector'));
            const missing = selectors.filter(selector => !selectedVariants[selector.id.replace('variant-', '')]);
            if (missing.length) {
                missing.forEach(selector => selector.classList.add('variant-missing'));
                missing[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                showToast(`Please choose ${missing.map(selector => selector.dataset.optionLabel).join(' and ')}.`, 'warning');
                return;
            }

            // Build options with image
            const optionsWithImage = { ...selectedVariants };
            if (selectedImageUrl) optionsWithImage._selected_image = selectedImageUrl;

            // Find selected variant price from the active chip's data-price
            let variantPrice = null;
            document.querySelectorAll('.variant-selector button.selected[data-price]').forEach(btn => {
                const p = parseFloat(btn.dataset.price);
                if (!isNaN(p) && p > 0) variantPrice = p;
            });

            await addToCartWithPrice(id, selectedQty, optionsWithImage, variantPrice);
        }

        function renderReviews(reviews, product = null) {
            const section = document.getElementById('reviews-section');
            const list = document.getElementById('reviews-list');
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            section.style.display = 'block';

            // ── Summary: average score + stars + count ──
            // Prefer the product's canonical aggregate (matches the hero rating row);
            // fall back to computing from the review list.
            const summary = document.getElementById('reviews-summary');
            if (reviews.length > 0) {
                const avg = (product && product.rating_avg != null && product.rating_count > 0)
                    ? product.rating_avg
                    : reviews.reduce((sum, r) => sum + (Number(r.rating) || 0), 0) / reviews.length;
                const count = (product && product.rating_count > 0) ? product.rating_count : reviews.length;
                document.getElementById('reviews-avg-score').textContent = Number(avg).toFixed(1);
                document.getElementById('reviews-avg-stars').innerHTML = renderStars(avg);
                const countLabel = count === 1
                    ? _t('product.based_on_one_review')
                    : _t('product.based_on_reviews').replace('{n}', count);
                document.getElementById('reviews-count-label').textContent = countLabel;
                const viewAllLink = document.getElementById('view-all-reviews-link');
                if (viewAllLink) viewAllLink.href = 'reviews.html?id=' + (product?.id || productId);
                summary.style.display = 'flex';
            }

            if (reviews.length > 0) {
                const currentUserId = api.isLoggedIn() ? api.getUser()?.id : null;
                const isAdmin = api.isLoggedIn() && api.isAdmin();
                list.innerHTML = reviews.map(review => {
                    const userName = review.profiles?.full_name || 'Anonymous';
                    const canDelete = currentUserId != null && (
                        (review.user_id != null && String(review.user_id) === String(currentUserId))
                        || isAdmin
                    );
                    return `
                        <div class="review-card">
                            <div class="review-header">
                                <div class="review-user">
                                    <div class="review-avatar">${userName.charAt(0).toUpperCase()}</div>
                                    <div>
                                        <div class="review-name">${userName}</div>
                                        <div class="review-date">${formatDate(review.created_at)}</div>
                                    </div>
                                </div>
                                <div class="review-actions">
                                    <div class="review-rating">
                                        ${renderStars(review.rating)}
                                    </div>
                                    ${canDelete ? `
                                    <button class="review-delete" data-review-id="${review.id}" title="${_t('product.delete_review')}" aria-label="${_t('product.delete_review')}">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                    </button>` : ''}
                                </div>
                            </div>
                            ${review.comment ? `<p class="review-comment">${review.comment}</p>` : ''}
                        </div>
                    `;
                }).join('');
                wireReviewDelete(list, _t);
            } else {
                list.innerHTML = `
                    <div class="reviews-empty">
                        <div class="reviews-empty-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        </div>
                        <p>${_t('product.no_reviews')}</p>
                        <span>${_t('product.be_first_review')}</span>
                    </div>
                `;
            }

            // Show review form if logged in
            if (api.isLoggedIn()) {
                document.getElementById('review-form-container').style.display = 'block';
                initStarRating();
                initReviewForm();
            }
        }

        // Two-step delete: first click arms the button ("Confirm?"), second click deletes.
        function wireReviewDelete(container, _t) {
            const TRASH_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
            container.addEventListener('click', async (e) => {
                const btn = e.target.closest('.review-delete');
                if (!btn || btn.disabled) return;
                e.preventDefault();
                e.stopPropagation();

                if (!btn.classList.contains('confirming')) {
                    btn.classList.add('confirming');
                    btn.innerHTML = `<span>${_t('product.delete_confirm')}</span>`;
                    setTimeout(() => {
                        if (btn.isConnected) {
                            btn.classList.remove('confirming');
                            btn.innerHTML = TRASH_SVG;
                        }
                    }, 3000);
                    return;
                }

                btn.disabled = true;
                try {
                    await api.deleteReview(btn.dataset.reviewId);
                    showToast(_t('product.review_deleted'), 'success');
                    setTimeout(() => window.location.reload(), 500);
                } catch (err) {
                    showToast(err.message, 'error');
                    btn.disabled = false;
                }
            });
        }

        function initStarRating() {
            const stars = document.querySelectorAll('#star-rating .star');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = parseInt(star.dataset.value);
                    document.getElementById('review-rating').value = value;
                    stars.forEach(s => {
                        s.classList.toggle('active', parseInt(s.dataset.value) <= value);
                    });
                });

                star.addEventListener('mouseover', () => {
                    const value = parseInt(star.dataset.value);
                    stars.forEach(s => {
                        s.style.color = parseInt(s.dataset.value) <= value ? 'var(--status-warning)' : '';
                    });
                });

                star.addEventListener('mouseout', () => {
                    const currentRating = parseInt(document.getElementById('review-rating').value);
                    stars.forEach(s => {
                        s.style.color = '';
                    });
                });
            });
        }

        function initReviewForm() {
            document.getElementById('review-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
                const rating = parseInt(document.getElementById('review-rating').value);
                const comment = document.getElementById('review-comment').value;

                if (rating === 0) {
                    showToast(_t('product.rating_label'), 'warning');
                    return;
                }

                try {
                    await api.createReview(productId, rating, comment);
                    showToast(_t('product.submit_review'), 'success');
                    // Reload product to show new review
                    setTimeout(() => window.location.reload(), 500);
                } catch (err) {
                    showToast(err.message, 'error');
                }
            });
        }
    </script>
</body>
</html>
