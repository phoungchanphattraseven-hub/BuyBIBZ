<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #06060a;
            color: white;
        }
        
        .box {
            height: 400px;
            margin: 20px;
            padding: 20px;
            background: #1a1a28;
            border: 2px solid #1B8C3D;
        }
    </style>
</head>
<body>
    <h1 style="padding: 20px;">SCROLL TEST</h1>
    <p style="padding: 0 20px;">Try scrolling with your mouse wheel on this page. If this works but index.html doesn't, there's something specific blocking index.html.</p>
    
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
    <div class="box">Box 5</div>
    <div class="box">Box 6</div>
    <div class="box">Box 7</div>
    <div class="box">Box 8</div>
    
    <script>
        console.log('Scroll test loaded');
        window.addEventListener('wheel', (e) => {
            console.log('Wheel event detected:', e.deltaY);
        });
    </script>
</body>
</html>
