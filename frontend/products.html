<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Shop — BuyBIBZ</title>
    <meta name="description" content="Browse our curated collection of premium products. Filter by category, price, and rating.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <!-- Sticky Search Bar -->
    <div class="sticky-search-wrapper" id="sticky-search-wrapper">
        <div class="container">
            <div class="page-header-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.3-4.3"/>
                </svg>
                <input type="text" id="sticky-search-input" placeholder="Search..." aria-label="Search products">
                <button type="button" class="search-submit-btn" id="sticky-search-submit" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                </button>
                <button type="button" class="search-clear-btn" id="sticky-search-clear" aria-label="Clear search" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 6 6 18M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <main class="catalog-page">
        <div class="container">
            <div class="page-header">
                <div class="page-header-text">
                    <h1 id="catalog-title" data-i18n="products.all_products">All Products</h1>
                    <p id="catalog-subtitle" data-i18n="products.premium_collection">Discover our premium collection</p>
                </div>
                <div class="page-header-search">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.3-4.3"/>
                    </svg>
                    <input type="text" id="page-search-input" placeholder="Search..." aria-label="Search products">
                    <button type="button" class="search-submit-btn" id="search-submit-btn" aria-label="Search">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.3-4.3"/>
                        </svg>
                    </button>
                    <button type="button" class="search-clear-btn" id="search-clear-btn" aria-label="Clear search" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Modern Horizontal Category Carousel / Chips Bar -->
            <div class="category-pills-container">
                <div class="category-pills-track" id="category-pills">
                    <button type="button" class="category-pill active" data-category="">
                        <span class="pill-icon">✨</span>
                        <span class="pill-label">All Categories</span>
                    </button>
                </div>
            </div>

            <!-- Modern Mobile Filter & Sort Toolbar -->
            <div class="mobile-catalog-bar">
                <div class="mobile-catalog-info">
                    <span class="catalog-count" id="mobile-results-count">Loading...</span>
                </div>
                <div class="mobile-catalog-actions">
                    <button type="button" class="btn-mobile-filter" id="open-filter-sheet" aria-label="Open filter options">
                        <svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="4" y1="21" x2="4" y2="14"></line>
                            <line x1="4" y1="10" x2="4" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12" y2="3"></line>
                            <line x1="20" y1="21" x2="20" y2="16"></line>
                            <line x1="20" y1="12" x2="20" y2="3"></line>
                            <line x1="1" y1="14" x2="7" y2="14"></line>
                            <line x1="9" y1="8" x2="15" y2="8"></line>
                            <line x1="17" y1="16" x2="23" y2="16"></line>
                        </svg>
                        <span data-i18n="products.filters">Filters</span>
                        <span class="filter-badge" id="filter-badge" style="display: none;">0</span>
                    </button>
                    <div class="mobile-sort-wrapper">
                        <select id="mobile-sort-select" class="mobile-sort-select" aria-label="Sort products">
                            <option value="newest" data-i18n="products.newest">Newest</option>
                            <option value="price_asc" data-i18n="products.price_low">Price: Low to High</option>
                            <option value="price_desc" data-i18n="products.price_high">Price: High to Low</option>
                            <option value="rating" data-i18n="products.top_rated">Top Rated</option>
                        </select>
                        <svg class="sort-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>
            </div>

            <!-- Active Filter Chips (Removable tags) -->
            <div class="active-filter-chips" id="active-filter-chips" style="display: none;"></div>

            <div class="catalog-layout">
                <!-- Sidebar Filters (Desktop) -->
                <aside class="catalog-sidebar">
                    <div class="filter-section">
                        <div class="filter-section-header">
                            <h3 data-i18n="products.categories">Categories</h3>
                        </div>
                        <div id="filter-categories">
                            <label class="filter-option active" data-category="">
                                <input type="radio" name="category" value="" checked> <span data-i18n="products.all_categories">All Categories</span>
                            </label>
                        </div>
                    </div>

                    <div class="filter-section">
                        <div class="filter-section-header">
                            <h3 data-i18n="products.price_range">Price Range</h3>
                        </div>
                        <label class="filter-option active" data-price="">
                            <input type="radio" name="price" value="" checked> <span data-i18n="products.all_prices">All Prices</span>
                        </label>
                        <label class="filter-option" data-price="0-50">
                            <input type="radio" name="price" value="0-50"> <span data-i18n="products.under_50">Under $50</span>
                        </label>
                        <label class="filter-option" data-price="50-100">
                            <input type="radio" name="price" value="50-100"> <span data-i18n="products.50_100">$50 — $100</span>
                        </label>
                        <label class="filter-option" data-price="100-250">
                            <input type="radio" name="price" value="100-250"> <span data-i18n="products.100_250">$100 — $250</span>
                        </label>
                        <label class="filter-option" data-price="250-9999">
                            <input type="radio" name="price" value="250-9999"> <span data-i18n="products.250_plus">$250+</span>
                        </label>
                    </div>

                    <div class="filter-section">
                        <div class="filter-section-header">
                            <h3 data-i18n="products.sort_by">Sort By</h3>
                        </div>
                        <label class="filter-option active">
                            <input type="radio" name="sort" value="newest" checked> <span data-i18n="products.newest">Newest</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="sort" value="price_asc"> <span data-i18n="products.price_low">Price: Low to High</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="sort" value="price_desc"> <span data-i18n="products.price_high">Price: High to Low</span>
                        </label>
                        <label class="filter-option">
                            <input type="radio" name="sort" value="rating"> <span data-i18n="products.top_rated">Top Rated</span>
                        </label>
                    </div>
                </aside>

                <!-- Products Content -->
                <div class="catalog-main-content">
                    <div class="catalog-header desktop-only-header">
                        <span class="catalog-count" id="results-count">Loading...</span>
                    </div>

                    <div class="products-grid" id="products-grid">
                        <!-- Products loaded dynamically -->
                    </div>

                    <div class="pagination" id="pagination"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Filter Bottom Sheet Modal -->
    <div class="filter-sheet-overlay" id="filter-sheet-overlay"></div>
    <div class="filter-sheet" id="filter-sheet" role="dialog" aria-modal="true" aria-label="Product Filters">
        <div class="filter-sheet-handle"></div>
        <div class="filter-sheet-header">
            <div class="filter-sheet-title-group">
                <h3 data-i18n="products.filters_refinements">Filters & Refinements</h3>
                <button type="button" class="btn-sheet-reset" id="sheet-reset-btn" data-i18n="products.reset_all">Reset All</button>
            </div>
            <button type="button" class="filter-sheet-close" id="close-filter-sheet" aria-label="Close filters">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>
        <div class="filter-sheet-body">
            <!-- Price Range -->
            <div class="sheet-section">
                <h4 class="sheet-section-title" data-i18n="products.price_range">Price Range</h4>
                <div class="sheet-chips-grid" id="sheet-price-chips">
                    <button type="button" class="sheet-chip active" data-price="" data-i18n="products.all_prices">All Prices</button>
                    <button type="button" class="sheet-chip" data-price="0-50" data-i18n="products.under_50">Under $50</button>
                    <button type="button" class="sheet-chip" data-price="50-100" data-i18n="products.50_100">$50 — $100</button>
                    <button type="button" class="sheet-chip" data-price="100-250" data-i18n="products.100_250">$100 — $250</button>
                    <button type="button" class="sheet-chip" data-price="250-9999" data-i18n="products.250_plus">$250+</button>
                </div>
            </div>

            <!-- Sort By -->
            <div class="sheet-section">
                <h4 class="sheet-section-title" data-i18n="products.sort_by">Sort By</h4>
                <div class="sheet-chips-grid" id="sheet-sort-chips">
                    <button type="button" class="sheet-chip active" data-sort="newest">✨ <span data-i18n="products.newest">Newest</span></button>
                    <button type="button" class="sheet-chip" data-sort="price_asc">💵 <span data-i18n="products.price_low">Price: Low to High</span></button>
                    <button type="button" class="sheet-chip" data-sort="price_desc">💎 <span data-i18n="products.price_high">Price: High to Low</span></button>
                    <button type="button" class="sheet-chip" data-sort="rating">⭐ <span data-i18n="products.top_rated">Top Rated</span></button>
                </div>
            </div>

            <!-- Categories in Bottom Sheet -->
            <div class="sheet-section">
                <h4 class="sheet-section-title" data-i18n="products.categories">Category</h4>
                <div class="sheet-chips-grid" id="sheet-category-chips">
                    <button type="button" class="sheet-chip active" data-category="">✨ <span data-i18n="products.all_categories">All Categories</span></button>
                </div>
            </div>
        </div>
        <div class="filter-sheet-footer">
            <button type="button" class="btn btn-primary btn-block btn-apply-filter" id="apply-filters-btn" data-i18n="products.show_products">
                Show Products
            </button>
        </div>
    </div>

    <footer class="footer" id="footer"></footer>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa-install.js"></script>
    <script>
        let currentPage = 1;
        let currentFilters = {
            search: '',
            category: '',
            sort: 'newest',
            min_price: null,
            max_price: null,
            featured: null,
        };
        let categoryList = [];

        document.addEventListener('DOMContentLoaded', async () => {
            // Parse URL params
            const params = new URLSearchParams(window.location.search);
            if (params.get('search')) currentFilters.search = params.get('search');
            if (params.get('category')) currentFilters.category = params.get('category');
            if (params.get('sort')) currentFilters.sort = params.get('sort');
            if (params.get('featured')) currentFilters.featured = params.get('featured') === 'true';

            // Update title if searching
            if (currentFilters.search) {
                document.getElementById('catalog-title').textContent = `${typeof i18n !== 'undefined' ? i18n.t('nav.search_placeholder').replace('...','') : 'Search'}: "${currentFilters.search}"`;
            }
            if (currentFilters.featured) {
                document.getElementById('catalog-title').textContent = typeof i18n !== 'undefined' ? i18n.t('section.featured') : 'Featured Products';
                document.getElementById('catalog-subtitle').textContent = typeof i18n !== 'undefined' ? i18n.t('section.featured_desc') : 'Our hand-picked selection of premium items';
            }

            // Sync sort select
            const mobileSortSelect = document.getElementById('mobile-sort-select');
            if (mobileSortSelect) {
                mobileSortSelect.value = currentFilters.sort || 'newest';
                mobileSortSelect.addEventListener('change', (e) => {
                    setSortFilter(e.target.value);
                });
            }

            // Load categories for filter pills and sidebar
            await loadCategories();

            // Setup Bottom Sheet Drawer
            setupFilterSheet();

            // Set initial filter state across all UI controls
            syncAllFilterControls();

            // Listen to desktop sidebar price inputs
            document.querySelectorAll('input[name="price"]').forEach(input => {
                input.addEventListener('change', () => {
                    setPriceFilter(input.value);
                });
            });

            // Listen to desktop sidebar sort inputs
            document.querySelectorAll('input[name="sort"]').forEach(input => {
                input.addEventListener('change', () => {
                    setSortFilter(input.value);
                });
            });

            // Setup Mobile Search Input
            setupMobileSearch();

            // Setup sticky search scroll behavior
            setupStickySearch();

            // Initial products load
            loadProducts();
        });

        async function loadCategories() {
            try {
                const catData = await api.getCategories();
                const categories = catData.categories || [];
                categoryList = categories;

                // 1. Render Mobile Category Pills Track
                const pillsTrack = document.getElementById('category-pills');
                if (pillsTrack) {
                    pillsTrack.innerHTML = `
                        <button type="button" class="category-pill ${!currentFilters.category ? 'active' : ''}" data-category="">
                            <span class="pill-icon">✨</span>
                            <span class="pill-label">All Categories</span>
                        </button>
                    `;
                    categories.forEach(cat => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = `category-pill ${currentFilters.category == cat.id ? 'active' : ''}`;
                        btn.dataset.category = cat.id;
                        btn.innerHTML = `
                            <span class="pill-icon">${cat.icon || '🏷️'}</span>
                            <span class="pill-label">${cat.name}</span>
                        `;
                        btn.addEventListener('click', () => {
                            setCategoryFilter(cat.id);
                        });
                        pillsTrack.appendChild(btn);
                    });

                    // Add click listener for 'All Categories' pill
                    pillsTrack.querySelector('[data-category=""]').addEventListener('click', () => {
                        setCategoryFilter('');
                    });
                }

                // 2. Render Desktop Sidebar Categories
                const catContainer = document.getElementById('filter-categories');
                if (catContainer) {
                    catContainer.innerHTML = `
                        <label class="filter-option ${!currentFilters.category ? 'active' : ''}" data-category="">
                            <input type="radio" name="category" value="" ${!currentFilters.category ? 'checked' : ''}> All Categories
                        </label>
                    `;
                    categories.forEach(cat => {
                        const label = document.createElement('label');
                        label.className = `filter-option ${currentFilters.category == cat.id ? 'active' : ''}`;
                        label.dataset.category = cat.id;
                        label.innerHTML = `
                            <input type="radio" name="category" value="${cat.id}" ${currentFilters.category == cat.id ? 'checked' : ''}>
                            ${cat.icon || ''} ${cat.name}
                        `;
                        label.querySelector('input').addEventListener('change', () => {
                            setCategoryFilter(cat.id);
                        });
                        catContainer.appendChild(label);
                    });

                    // Add listener for sidebar 'All Categories'
                    catContainer.querySelector('input[value=""]').addEventListener('change', () => {
                        setCategoryFilter('');
                    });
                }

                // 3. Render Sheet Category Chips
                const sheetCatChips = document.getElementById('sheet-category-chips');
                if (sheetCatChips) {
                    sheetCatChips.innerHTML = `
                        <button type="button" class="sheet-chip ${!currentFilters.category ? 'active' : ''}" data-category="">
                            ✨ All Categories
                        </button>
                    `;
                    categories.forEach(cat => {
                        const chip = document.createElement('button');
                        chip.type = 'button';
                        chip.className = `sheet-chip ${currentFilters.category == cat.id ? 'active' : ''}`;
                        chip.dataset.category = cat.id;
                        chip.innerHTML = `${cat.icon || '🏷️'} ${cat.name}`;
                        chip.addEventListener('click', () => {
                            setCategoryFilter(cat.id);
                        });
                        sheetCatChips.appendChild(chip);
                    });

                    sheetCatChips.querySelector('[data-category=""]').addEventListener('click', () => {
                        setCategoryFilter('');
                    });
                }

            } catch (err) {
                console.error('Error loading categories:', err);
            }
        }

        function setCategoryFilter(categoryId) {
            currentFilters.category = categoryId;
            currentPage = 1;
            syncAllFilterControls();
            loadProducts();
        }

        function setPriceFilter(priceValue) {
            const [min, max] = priceValue ? priceValue.split('-').map(Number) : [null, null];
            currentFilters.min_price = min;
            currentFilters.max_price = max;
            currentPage = 1;
            syncAllFilterControls();
            loadProducts();
        }

        function setSortFilter(sortValue) {
            currentFilters.sort = sortValue;
            currentPage = 1;
            syncAllFilterControls();
            loadProducts();
        }

        function resetAllFilters() {
            currentFilters.category = '';
            currentFilters.min_price = null;
            currentFilters.max_price = null;
            currentFilters.sort = 'newest';
            currentPage = 1;
            syncAllFilterControls();
            loadProducts();
        }

        function syncAllFilterControls() {
            // 1. Sync category pills
            document.querySelectorAll('#category-pills .category-pill').forEach(pill => {
                const isMatch = (pill.dataset.category || '') == (currentFilters.category || '');
                pill.classList.toggle('active', isMatch);
                if (isMatch) {
                    pill.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            });

            // 2. Sync sidebar category radios
            document.querySelectorAll('#filter-categories .filter-option').forEach(opt => {
                const isMatch = (opt.dataset.category || '') == (currentFilters.category || '');
                opt.classList.toggle('active', isMatch);
                const input = opt.querySelector('input');
                if (input) input.checked = isMatch;
            });

            // 3. Sync sheet category chips
            document.querySelectorAll('#sheet-category-chips .sheet-chip').forEach(chip => {
                const isMatch = (chip.dataset.category || '') == (currentFilters.category || '');
                chip.classList.toggle('active', isMatch);
            });

            // 4. Sync price radios (sidebar) and chips (sheet)
            const currentPriceKey = (currentFilters.min_price !== null && currentFilters.max_price !== null)
                ? `${currentFilters.min_price}-${currentFilters.max_price}`
                : '';

            document.querySelectorAll('aside [data-price]').forEach(opt => {
                const isMatch = (opt.dataset.price || '') == currentPriceKey;
                opt.classList.toggle('active', isMatch);
                const input = opt.querySelector('input');
                if (input) input.checked = isMatch;
            });

            document.querySelectorAll('#sheet-price-chips .sheet-chip').forEach(chip => {
                const isMatch = (chip.dataset.price || '') == currentPriceKey;
                chip.classList.toggle('active', isMatch);
            });

            // 5. Sync sort radios (sidebar), select (mobile), and chips (sheet)
            document.querySelectorAll('aside input[name="sort"]').forEach(input => {
                const isMatch = input.value === currentFilters.sort;
                input.checked = isMatch;
                input.closest('.filter-option')?.classList.toggle('active', isMatch);
            });

            const mobileSortSelect = document.getElementById('mobile-sort-select');
            if (mobileSortSelect) mobileSortSelect.value = currentFilters.sort;

            document.querySelectorAll('#sheet-sort-chips .sheet-chip').forEach(chip => {
                const isMatch = chip.dataset.sort === currentFilters.sort;
                chip.classList.toggle('active', isMatch);
            });

            // 6. Update Active Filters Tag Bar & Badge Counter
            updateFilterBadgeAndTags(currentPriceKey);
        }

        function updateFilterBadgeAndTags(currentPriceKey) {
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            let activeCount = 0;
            const tags = [];

            if (currentFilters.category) {
                activeCount++;
                const catObj = categoryList.find(c => c.id == currentFilters.category);
                const name = catObj ? `${catObj.icon || ''} ${catObj.name}` : _t('products.categories');
                tags.push({ label: name, onRemove: () => setCategoryFilter('') });
            }

            if (currentPriceKey) {
                activeCount++;
                const priceLabels = {
                    '0-50': _t('products.under_50'),
                    '50-100': _t('products.50_100'),
                    '100-250': _t('products.100_250'),
                    '250-9999': _t('products.250_plus'),
                };
                tags.push({
                    label: priceLabels[currentPriceKey] || currentPriceKey,
                    onRemove: () => setPriceFilter('')
                });
            }

            if (currentFilters.sort && currentFilters.sort !== 'newest') {
                activeCount++;
                const sortLabels = {
                    'price_asc': _t('products.price_low'),
                    'price_desc': _t('products.price_high'),
                    'rating': _t('products.top_rated'),
                };
                tags.push({
                    label: sortLabels[currentFilters.sort] || currentFilters.sort,
                    onRemove: () => setSortFilter('newest')
                });
            }

            // Update badge on mobile filters button
            const badge = document.getElementById('filter-badge');
            if (badge) {
                if (activeCount > 0) {
                    badge.textContent = activeCount;
                    badge.style.display = 'inline-flex';
                } else {
                    badge.style.display = 'none';
                }
            }

            // Render active filter chips bar
            const tagsContainer = document.getElementById('active-filter-chips');
            if (tagsContainer) {
                if (tags.length > 0) {
                    tagsContainer.style.display = 'flex';
                    tagsContainer.innerHTML = '';
                    
                    tags.forEach(tag => {
                        const tagEl = document.createElement('div');
                        tagEl.className = 'active-tag';
                        tagEl.innerHTML = `
                            <span>${tag.label}</span>
                            <button type="button" class="tag-remove" aria-label="Remove filter">✕</button>
                        `;
                        tagEl.querySelector('.tag-remove').addEventListener('click', tag.onRemove);
                        tagsContainer.appendChild(tagEl);
                    });

                    const clearBtn = document.createElement('button');
                    clearBtn.type = 'button';
                    clearBtn.className = 'tag-clear-all';
                    clearBtn.textContent = _t('products.clear_all');
                    clearBtn.addEventListener('click', resetAllFilters);
                    tagsContainer.appendChild(clearBtn);
                } else {
                    tagsContainer.style.display = 'none';
                    tagsContainer.innerHTML = '';
                }
            }
        }

        function setupFilterSheet() {
            const openBtn = document.getElementById('open-filter-sheet');
            const closeBtn = document.getElementById('close-filter-sheet');
            const overlay = document.getElementById('filter-sheet-overlay');
            const sheet = document.getElementById('filter-sheet');
            const resetBtn = document.getElementById('sheet-reset-btn');
            const applyBtn = document.getElementById('apply-filters-btn');

            function openSheet() {
                sheet?.classList.add('open');
                overlay?.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function closeSheet() {
                sheet?.classList.remove('open');
                overlay?.classList.remove('open');
                document.body.style.overflow = '';
            }

            openBtn?.addEventListener('click', openSheet);
            closeBtn?.addEventListener('click', closeSheet);
            overlay?.addEventListener('click', closeSheet);
            applyBtn?.addEventListener('click', closeSheet);

            resetBtn?.addEventListener('click', () => {
                resetAllFilters();
            });

            // Listen to price chips inside sheet
            document.querySelectorAll('#sheet-price-chips .sheet-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    setPriceFilter(chip.dataset.price || '');
                });
            });

            // Listen to sort chips inside sheet
            document.querySelectorAll('#sheet-sort-chips .sheet-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    setSortFilter(chip.dataset.sort || 'newest');
                });
            });
        }

        function setupMobileSearch() {
            const searchInput = document.getElementById('page-search-input');
            const clearBtn = document.getElementById('search-clear-btn');
            const submitBtn = document.getElementById('search-submit-btn');

            function performSearch() {
                const value = searchInput.value.trim();
                currentFilters.search = value;
                currentPage = 1;
                
                // Update title
                const title = document.getElementById('catalog-title');
                if (title) {
                    if (value) {
                        title.textContent = `Search: "${value}"`;
                    } else if (currentFilters.featured) {
                        title.textContent = 'Featured Products';
                    } else {
                        title.textContent = 'All Products';
                    }
                }
                
                updateApplyButtonText();
                loadProducts();
            }

            if (searchInput) {
                // Set initial value if search param exists
                if (currentFilters.search) {
                    searchInput.value = currentFilters.search;
                    if (clearBtn) clearBtn.style.display = 'flex';
                }

                // Show/hide buttons based on input
                searchInput.addEventListener('input', (e) => {
                    const value = e.target.value.trim();
                    if (clearBtn) clearBtn.style.display = value ? 'flex' : 'none';
                });

                // Handle enter key
                searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        performSearch();
                        searchInput.blur();
                    }
                });

                // Handle search button click
                if (submitBtn) {
                    submitBtn.addEventListener('click', () => {
                        performSearch();
                    });
                }

                // Handle clear button
                if (clearBtn) {
                    clearBtn.addEventListener('click', () => {
                        searchInput.value = '';
                        clearBtn.style.display = 'none';
                        currentFilters.search = '';
                        currentPage = 1;
                        
                        const title = document.getElementById('catalog-title');
                        if (title) {
                            if (currentFilters.featured) {
                                title.textContent = 'Featured Products';
                            } else {
                                title.textContent = 'All Products';
                            }
                        }
                        
                        updateApplyButtonText();
                        loadProducts();
                    });
                }
            }
        }

        function updateApplyButtonText() {
            // This will be called after loadProducts updates the count
            // But we can trigger it manually here for immediate feedback
        }

        function setupStickySearch() {
            const stickyWrapper = document.getElementById('sticky-search-wrapper');
            const stickyInput = document.getElementById('sticky-search-input');
            const stickyClearBtn = document.getElementById('sticky-search-clear');
            const stickySubmitBtn = document.getElementById('sticky-search-submit');
            const pageInput = document.getElementById('page-search-input');
            const pageClearBtn = document.getElementById('search-clear-btn');
            const pageHeader = document.querySelector('.page-header');

            if (!stickyWrapper || !stickyInput || !pageInput || !pageHeader) return;

            // Show/hide sticky search based on scroll
            window.addEventListener('scroll', () => {
                const pageHeaderRect = pageHeader.getBoundingClientRect();
                const navHeight = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--nav-height')) || 64;
                
                if (pageHeaderRect.bottom < navHeight) {
                    stickyWrapper.classList.add('visible');
                    stickyWrapper.classList.add('scrolled');
                } else {
                    stickyWrapper.classList.remove('visible');
                    stickyWrapper.classList.remove('scrolled');
                }
            });

            // Sync inputs
            function syncInputs(sourceInput, targetInput, sourceClear, targetClear) {
                targetInput.value = sourceInput.value;
                const hasValue = sourceInput.value.trim().length > 0;
                if (sourceClear) sourceClear.style.display = hasValue ? 'flex' : 'none';
                if (targetClear) targetClear.style.display = hasValue ? 'flex' : 'none';
            }

            function performStickySearch() {
                const value = stickyInput.value.trim();
                currentFilters.search = value;
                currentPage = 1;
                syncInputs(stickyInput, pageInput, stickyClearBtn, pageClearBtn);
                
                const title = document.getElementById('catalog-title');
                if (title) {
                    if (value) {
                        title.textContent = `Search: "${value}"`;
                    } else if (currentFilters.featured) {
                        title.textContent = 'Featured Products';
                    } else {
                        title.textContent = 'All Products';
                    }
                }
                
                updateApplyButtonText();
                loadProducts();
            }

            // Set initial values
            if (currentFilters.search) {
                stickyInput.value = currentFilters.search;
                if (stickyClearBtn) stickyClearBtn.style.display = 'flex';
            }

            // Handle input changes (just for showing clear button)
            stickyInput.addEventListener('input', (e) => {
                const value = e.target.value.trim();
                syncInputs(stickyInput, pageInput, stickyClearBtn, pageClearBtn);
            });

            // Handle enter key
            stickyInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performStickySearch();
                    stickyInput.blur();
                }
            });

            // Handle search button
            if (stickySubmitBtn) {
                stickySubmitBtn.addEventListener('click', () => {
                    performStickySearch();
                });
            }

            // Handle clear button
            if (stickyClearBtn) {
                stickyClearBtn.addEventListener('click', () => {
                    stickyInput.value = '';
                    pageInput.value = '';
                    stickyClearBtn.style.display = 'none';
                    if (pageClearBtn) pageClearBtn.style.display = 'none';
                    currentFilters.search = '';
                    currentPage = 1;
                    
                    const title = document.getElementById('catalog-title');
                    if (title) {
                        if (currentFilters.featured) {
                            title.textContent = 'Featured Products';
                        } else {
                            title.textContent = 'All Products';
                        }
                    }
                    
                    updateApplyButtonText();
                    loadProducts();
                });
            }

            // Sync page input changes to sticky input
            pageInput.addEventListener('input', () => {
                syncInputs(pageInput, stickyInput, pageClearBtn, stickyClearBtn);
            });
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = Array(6).fill('<div class="product-card"><div class="product-card-image skeleton" style="padding-top:100%"></div><div class="product-card-body"><div class="skeleton" style="height:16px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:20px;width:80%;margin-bottom:8px"></div><div class="skeleton" style="height:16px;width:40%"></div></div></div>').join('');

            try {
                const params = {
                    page: currentPage,
                    limit: 12,
                    sort: currentFilters.sort,
                };
                if (currentFilters.search) params.search = currentFilters.search;
                if (currentFilters.category) params.category = currentFilters.category;
                if (currentFilters.min_price !== null) params.min_price = currentFilters.min_price;
                if (currentFilters.max_price !== null) params.max_price = currentFilters.max_price;
                if (currentFilters.featured !== null) params.featured = currentFilters.featured;

                const data = await api.getProducts(params);

                const countText = `${data.total} product${data.total !== 1 ? 's' : ''} found`;
                const desktopCount = document.getElementById('results-count');
                const mobileCount = document.getElementById('mobile-results-count');
                if (desktopCount) desktopCount.textContent = countText;
                if (mobileCount) mobileCount.textContent = countText;

                const applyBtn = document.getElementById('apply-filters-btn');
                if (applyBtn) {
                    applyBtn.textContent = `Show ${data.total} Product${data.total !== 1 ? 's' : ''}`;
                }

                if (data.products && data.products.length > 0) {
                    grid.innerHTML = data.products.map(renderProductCard).join('');
                    renderPagination(data.page, data.pages);
                } else {
                    grid.innerHTML = `
                        <div style="grid-column:1/-1; text-align:center; padding: var(--space-4xl);">
                            <div style="font-size: 3rem; margin-bottom: var(--space-md); opacity: 0.3;">🔍</div>
                            <h3 style="margin-bottom: var(--space-sm);">No products found</h3>
                            <p class="text-secondary">Try adjusting your filters or search terms.</p>
                            <button class="btn btn-outline" style="margin-top: var(--space-md);" onclick="resetAllFilters()">Reset Filters</button>
                        </div>
                    `;
                    document.getElementById('pagination').innerHTML = '';
                }
            } catch (err) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding: var(--space-4xl);">
                        <p class="text-secondary">Unable to load products. Make sure the backend is running.</p>
                    </div>
                `;
            }
        }

        function renderPagination(page, totalPages) {
            const container = document.getElementById('pagination');
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            if (page > 1) {
                html += `<button class="pagination-btn" onclick="goToPage(${page - 1})">←</button>`;
            }
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || Math.abs(i - page) <= 1) {
                    html += `<button class="pagination-btn ${i === page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
                } else if (Math.abs(i - page) === 2) {
                    html += `<span style="color: var(--text-tertiary);">…</span>`;
                }
            }
            if (page < totalPages) {
                html += `<button class="pagination-btn" onclick="goToPage(${page + 1})">→</button>`;
            }
            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadProducts();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
