<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Orders — BuyBIBZ</title>
    <meta name="description" content="View your order history.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css?v=1789005309">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="orders-page">
        <div class="container">
        <a class="page-back back-visible" href="profile.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span data-i18n="common.back">Back</span>
        </a>
            <div class="page-header">
                <h1 data-i18n="orders.title">My Orders</h1>
                <p data-i18n="orders.subtitle">Track and view your past orders</p>
            </div>

            <div id="orders-list">
                <!-- Loaded dynamically -->
                <div id="orders-skeleton">
                    <div class="skeleton" style="height: 80px; width: 100%; margin-bottom: 16px; border-radius: 10px;"></div>
                    <div class="skeleton" style="height: 80px; width: 100%; margin-bottom: 16px; border-radius: 10px;"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js?v=1789003450"></script>
    <script src="js/app.js?v=1789005309"></script>
    <script src="js/pwa-install.js"></script>
    <script>
        // Simple debug log
        console.log('orders.html script loaded');
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOMContentLoaded fired');
            
            // Check auth but don't stop execution - requireAuth will redirect if needed
            requireAuth();
            
            console.log('Starting loadOrders');

            // Show timeout fallback if orders never load after 12s
            const skeletonTimeout = setTimeout(() => {
                const skeleton = document.getElementById('orders-skeleton');
                if (skeleton) {
                    skeleton.innerHTML = `
                        <div style="text-align:center;padding:var(--space-4xl);background:var(--bg-glass);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);">
                            <div style="font-size:2.5rem;margin-bottom:var(--space-md);opacity:0.4;">&#9201;</div>
                            <h3 style="margin-bottom:var(--space-sm);">Taking too long</h3>
                            <p class="text-secondary" style="margin-bottom:var(--space-xl);">The server is not responding. Please check your connection or try again.</p>
                            <button class="btn btn-primary" onclick="location.reload()">Retry</button>
                        </div>`;
                }
            }, 12000);

            loadOrders().finally(() => {
                console.log('loadOrders completed');
                clearTimeout(skeletonTimeout);
            });
        });

        // Store orders for print lookup — avoids embedding JSON in onclick attributes
        const _ordersCache = new Map();

        async function loadOrders() {
            const container = document.getElementById('orders-list');
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;

            try {
                console.log('Loading orders...');
                
                // Check if user is logged in
                if (!api.isLoggedIn()) {
                    console.error('User not logged in');
                    container.innerHTML = `
                        <div style="text-align: center; padding: var(--space-4xl); background: var(--bg-glass); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);">
                            <div style="font-size: 3rem; margin-bottom: var(--space-md); opacity: 0.5;">&#128274;</div>
                            <h2 style="margin-bottom: var(--space-sm);">Authentication Required</h2>
                            <p class="text-secondary" style="margin-bottom: var(--space-xl);">Please log in to view your orders.</p>
                            <a href="auth.html?redirect=orders.html" class="btn btn-primary">Login</a>
                        </div>
                    `;
                    return;
                }

                console.log('User is logged in, calling API...');
                const data = await api.getOrders();
                console.log('Orders API response:', data);

                // Clear skeleton — we have a response now
                container.innerHTML = '';

                // Cache orders by ID for print lookup
                (data.orders || []).forEach(o => _ordersCache.set(o.id, o));

                if (!data.orders || data.orders.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: var(--space-4xl); background: var(--bg-glass); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);">
                            <div style="font-size: 3rem; margin-bottom: var(--space-md); opacity: 0.5;">&#128230;</div>
                            <h2 style="margin-bottom: var(--space-sm);">${_t('orders.no_orders')}</h2>
                            <p class="text-secondary" style="margin-bottom: var(--space-xl);">${_t('orders.no_orders_desc')}</p>
                            <a href="products.html" class="btn btn-primary">${_t('orders.start_shopping')}</a>
                        </div>
                    `;
                    return;
                }
                
                container.innerHTML = '';
                data.orders.forEach(order => {
                    const items = order.order_items || [];
                    const itemCount = items.reduce((sum, item) => sum + item.quantity, 0);
                    const orderUid = order.order_uid || '#' + order.id;
                    const shortOrderUid = order.order_uid
                        ? order.order_uid.slice(0, 8) + '…' + order.order_uid.slice(-4)
                        : orderUid;

                    // ── Build items HTML safely (no nested template literals) ──
                    let itemsHtml = '';
                    items.forEach(item => {
                        const imgSrc = (item.selected_options || {})._selected_image
                            || item.product_image
                            || 'https://via.placeholder.com/100?text=Img';
                        const visibleOpts = Object.entries(item.selected_options || {})
                            .filter(([k]) => k !== '_selected_image');
                        let optsHtml = '';
                        visibleOpts.forEach(([k, v]) => {
                            const cleanK = toEnglishProductText(k.replace(/_/g, ' '));
                            const cleanV = toEnglishProductText(v, 'Standard');
                            const vWords = cleanV.split(' ');
                            const shortV = vWords.length > 4 ? vWords.slice(-3).join(' ') : cleanV;
                            optsHtml += '<div class="order-item-variant">' + cleanK + ': ' + shortV + '</div>';
                        });
                        const nameHtml = item.product_id
                            ? '<a href="product-detail.html?id=' + item.product_id + '" class="order-item-name">' + item.product_name + '</a>'
                            : '<span class="order-item-name">' + item.product_name + '</span>';
                        itemsHtml += '<div class="order-item">'
                            + '<div class="order-item-image"><img src="' + imgSrc + '" alt="' + item.product_name.replace(/"/g, '&quot;') + '" loading="lazy"></div>'
                            + '<div class="order-item-info">'
                            + nameHtml
                            + optsHtml
                            + '<div class="order-item-unit">' + formatPrice(item.price) + ' × ' + item.quantity + '</div>'
                            + '</div>'
                            + '<div class="order-item-total">' + formatPrice(item.subtotal) + '</div>'
                            + '</div>';
                    });

                    // ── Notes block ──
                    const notesHtml = order.notes
                        ? '<div class="summary-block summary-notes">'
                          + '<div class="notes-label">' + _t('orders.notes') + '</div>'
                          + '<div class="notes-text">' + order.notes + '</div>'
                          + '</div>'
                        : '';

                    const shippingFeeVal = order.shipping_fee > 0 ? formatPrice(order.shipping_fee) : _t('orders.free');

                    const html = '<div class="order-card">'
                        // Header
                        + '<div class="order-card-header" data-toggle-order="' + order.id + '">'
                        +   '<div class="order-card-identity">'
                        +     '<span class="order-eyebrow">' + _t('orders.order_uid') + '</span>'
                        +     '<div class="order-uid-row">'
                        +       '<code class="order-uid" title="' + orderUid + '">' + shortOrderUid + '</code>'
                        +     '</div>'
                        +     '<div class="order-date">' + formatDate(order.created_at) + ' • ' + itemCount + ' ' + (itemCount !== 1 ? _t('orders.items_plural') : _t('orders.items')) + '</div>'
                        +   '</div>'
                        +   '<div class="order-card-summary">'
                        +     '<div class="order-total">' + formatPrice(order.total) + '</div>'
                        +     renderStatusBadge(order.status)
                        +     '<span class="order-expand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>'
                        +   '</div>'
                        + '</div>'
                        // Body
                        + '<div class="order-card-body" id="order-details-' + order.id + '">'
                        +   '<div class="order-uid-detail">'
                        +     '<span>' + _t('orders.order_uid') + '</span>'
                        +     '<code>' + orderUid + '</code>'
                        +   '</div>'
                        +   renderOrderTracker(order.status)
                        +   '<div class="order-details-grid">'
                        +     '<section class="order-items-col">'
                        +       '<h4 class="order-section-title">' + _t('orders.items_label') + '</h4>'
                        +       '<div class="order-items-list">' + itemsHtml + '</div>'
                        +     '</section>'
                        +   '</div>'
                        +   '<div class="order-footer-grid">'
                        +     '<div class="order-shipping-info">'
                        +       '<h4 class="order-section-title">' + _t('orders.shipping_details') + '</h4>'
                        +       '<div class="shipping-address">'
                        +         '<div class="shipping-name">' + order.shipping_name + '</div>'
                        +         '<div class="shipping-line">' + order.shipping_address + '</div>'
                        +         (order.shipping_village ? '<div class="shipping-line">' + order.shipping_village + '</div>' : '')
                        +         (order.shipping_commune ? '<div class="shipping-line">' + order.shipping_commune + '</div>' : '')
                        +         (order.shipping_district ? '<div class="shipping-line">' + order.shipping_district + '</div>' : '')
                        +         ((order.shipping_province || order.shipping_city || order.shipping_postal)
                                      ? '<div class="shipping-line">' + [order.shipping_province || order.shipping_city, order.shipping_postal].filter(Boolean).join(', ') + '</div>'
                                      : '')
                        +         (order.shipping_phone
                                      ? '<div class="shipping-phone"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 80 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>' + order.shipping_phone + '</span></div>'
                                      : '')
                        +       '</div>'
                        +       notesHtml
                        +     '</div>'
                        +     '<aside class="order-summary-panel">'
                        +       '<div class="summary-totals">'
                        +         '<div class="summary-row"><span class="summary-label">' + _t('orders.subtotal') + '</span><span class="summary-value">' + formatPrice((order.total || 0) - (order.shipping_fee || 0) - (order.transaction_fee || 0)) + '</span></div>'
                        +         '<div class="summary-row"><span class="summary-label">' + _t('orders.intl_shipping') + '</span><span class="summary-value' + (order.shipping_fee > 0 ? '' : ' summary-free') + '">' + shippingFeeVal + '</span></div>'
                        +         '<div class="summary-row"><span class="summary-label">' + _t('cart.transaction_fee') + '</span><span class="summary-value">' + formatPrice(order.transaction_fee || 0) + '</span></div>'
                        +         '<div class="summary-row summary-total"><span>' + _t('orders.total') + '</span><span>' + formatPrice(order.total) + '</span></div>'
                        +       '</div>'
                        +     '</aside>'
                        +   '</div>'
                        + '</div>'
                        + '</div>';

                    container.insertAdjacentHTML('beforeend', html);
                });

                // ── Event delegation — no inline onclick needed ──
                container.addEventListener('click', e => {
                    // Toggle order details
                    const header = e.target.closest('[data-toggle-order]');
                    if (header) { toggleOrderDetails(parseInt(header.dataset.toggleOrder)); return; }
                }, { once: false });
                
            } catch (err) {
                console.error('Orders loading error:', err);
                container.innerHTML = `
                    <div style="text-align: center; padding: var(--space-4xl); background: var(--bg-glass); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);">
                        <div style="font-size: 3rem; margin-bottom: var(--space-md); opacity: 0.5;">&#9888;</div>
                        <h2 style="margin-bottom: var(--space-sm);">Failed to Load Orders</h2>
                        <p class="text-secondary" style="margin-bottom: var(--space-md);">${err.message}</p>
                        <button class="btn btn-primary" onclick="location.reload()">Retry</button>
                    </div>
                `;
            }
        }

        function toggleOrderDetails(orderId) {
            const body = document.getElementById(`order-details-${orderId}`);
            if (body.classList.contains('show')) {
                body.classList.remove('show');
            } else {
                body.classList.add('show');
            }
        }

        function renderOrderTracker(status) {
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            let statusText = '';
            let pPercent = '0%';

            if (status === 'cancelled') {
                statusText = _t('orders.status_cancelled');
                return `
                    <div class="order-tracker cancelled">
                        <div class="tracker-steps" style="max-width: 300px; margin: 0 auto;">
                            <div class="tracker-progress-wrapper">
                                <div class="tracker-progress-bar" style="--progress: 100%;"></div>
                            </div>
                            <div class="tracker-step completed">
                                <div class="step-icon">&#10003;</div>
                                <div class="step-label">${_t('orders.placed')}</div>
                            </div>
                            <div class="tracker-step active">
                                <div class="step-icon">&#10005;</div>
                                <div class="step-label">${_t('orders.cancelled')}</div>
                            </div>
                        </div>
                        <div class="tracker-description" style="color: var(--status-error); font-weight: 600;">
                            ${statusText}
                        </div>
                    </div>
                `;
            }

            let s1 = '', s2 = '', s3 = '', s4 = '';
            let icon1 = '1', icon2 = '2', icon3 = '3', icon4 = '4';

            switch (status) {
                case 'pending':
                    s1 = 'active'; icon1 = '&#x1F6D2;'; pPercent = '0%';
                    statusText = _t('orders.status_pending');
                    break;
                case 'processing':
                    s1 = 'completed'; icon1 = '&#10003;'; s2 = 'active'; icon2 = '&#x2699;'; pPercent = '33.33%';
                    statusText = _t('orders.status_processing');
                    break;
                case 'shipped':
                    s1 = 'completed'; icon1 = '&#10003;'; s2 = 'completed'; icon2 = '&#10003;';
                    s3 = 'active'; icon3 = '&#x1F69A;'; pPercent = '66.66%';
                    statusText = _t('orders.status_shipped');
                    break;
                case 'delivered':
                    s1 = 'completed'; icon1 = '&#10003;'; s2 = 'completed'; icon2 = '&#10003;';
                    s3 = 'completed'; icon3 = '&#10003;'; s4 = 'completed'; icon4 = '&#x1F381;'; pPercent = '100%';
                    statusText = _t('orders.status_delivered');
                    break;
                default:
                    s1 = 'active'; icon1 = '&#x1F6D2;'; pPercent = '0%';
                    statusText = _t('orders.status_default');
            }

            return `
                <div class="order-tracker">
                    <div class="tracker-steps">
                        <div class="tracker-progress-wrapper">
                            <div class="tracker-progress-bar" style="--progress: ${pPercent};"></div>
                        </div>
                        <div class="tracker-step ${s1}">
                            <div class="step-icon">${icon1}</div>
                            <div class="step-label">${_t('orders.placed')}</div>
                        </div>
                        <div class="tracker-step ${s2}">
                            <div class="step-icon">${icon2}</div>
                            <div class="step-label">${_t('orders.processing')}</div>
                        </div>
                        <div class="tracker-step ${s3}">
                            <div class="step-icon">${icon3}</div>
                            <div class="step-label">${_t('orders.shipped')}</div>
                        </div>
                        <div class="tracker-step ${s4}">
                            <div class="step-icon">${icon4}</div>
                            <div class="step-label">${_t('orders.delivered')}</div>
                        </div>
                    </div>
                    <div class="tracker-description">
                        ${statusText}
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
