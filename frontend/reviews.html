<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Product Reviews — BuyBIBZ</title>
    <meta name="description" content="Read customer reviews and ratings for this product.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="reviews-page">
        <div class="container">
            <a class="reviews-back" id="back-link" href="products.html">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                <span>Back</span>
            </a>

            <!-- Product mini card -->
            <div class="reviews-product" id="reviews-product">
                <div class="reviews-product-thumb skeleton"></div>
                <div class="reviews-product-meta">
                    <div class="skeleton" style="height: 22px; width: 70%; margin-bottom: 10px;"></div>
                    <div class="skeleton" style="height: 16px; width: 35%;"></div>
                </div>
            </div>

            <!-- Rating summary + distribution -->
            <div class="reviews-summary-panel" id="reviews-summary-panel" style="display: none;">
                <div class="rsp-score">
                    <span class="rsp-avg" id="rsp-avg">0.0</span>
                    <div class="rsp-stars" id="rsp-stars"></div>
                    <span class="rsp-count" id="rsp-count"></span>
                </div>
                <div class="rsp-bars" id="rsp-bars"></div>
            </div>

            <!-- Review list -->
            <div class="reviews-list" id="reviews-list"></div>

            <!-- Pagination -->
            <div class="reviews-more" id="reviews-more" style="display: none;">
                <span class="reviews-showing" id="showing-label"></span>
                <button class="btn btn-secondary" id="show-more-btn"></button>
            </div>

            <!-- Write a Review -->
            <div class="review-form" id="review-form-container" style="display: none;">
                <h3 data-i18n="product.write_review">Write a Review</h3>
                <form id="review-form">
                    <div class="form-group">
                        <label class="form-label" data-i18n="product.rating_label">Rating</label>
                        <div class="star-rating-input" id="star-rating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <input type="hidden" id="review-rating" value="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="review-comment" data-i18n="product.your_review">Your Review</label>
                        <textarea id="review-comment" class="form-textarea" data-i18n-placeholder="product.review_placeholder" placeholder="Share your experience with this product..." rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" data-i18n="product.submit_review">Submit Review</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa-install.js"></script>
    <script>
        const PAGE_SIZE = 5;
        let productId = null;
        let allReviews = [];
        let visibleCount = PAGE_SIZE;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            productId = parseInt(params.get('id'));
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;

            if (!productId) {
                document.getElementById('reviews-list').innerHTML = `
                    <div class="reviews-empty">
                        <p>Product not found</p>
                        <span><a href="products.html">Browse products</a></span>
                    </div>`;
                return;
            }

            document.getElementById('back-link').href = 'product-detail.html?id=' + productId;

            try {
                const [product, reviewData] = await Promise.all([
                    api.getProduct(productId),
                    api.getReviews(productId)
                ]);
                allReviews = reviewData.reviews || [];

                renderProductCard(product);
                renderSummary();
                renderVisibleReviews();
                renderPagination();
            } catch (err) {
                document.getElementById('reviews-list').innerHTML = `
                    <div class="reviews-empty">
                        <p>Unable to load reviews</p>
                        <span>${err.message}</span>
                    </div>`;
            }

            if (allReviews.length === 0) {
                // Apply translations to static data-i18n elements
                if (typeof i18n !== 'undefined') i18n.applyTranslations();
            }

            // Delete handlers — delegated on the list container so they
            // survive "Show more" re-renders
            wireReviewDelete(document.getElementById('reviews-list'), _t);

            // Show review form if logged in
            if (api.isLoggedIn()) {
                document.getElementById('review-form-container').style.display = 'block';
                initStarRating();
                initReviewForm();
            }
        });

        // Two-step delete: first click arms the button ("Confirm?"), second click deletes.
        function wireReviewDelete(container, _t) {
            const TRASH_SVG = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>';
            container.addEventListener('click', async (e) => {
                const btn = e.target.closest('.review-delete');
                if (!btn || btn.disabled) return;
                e.preventDefault();
                e.stopPropagation();

                if (!btn.classList.contains('confirming')) {
                    btn.classList.add('confirming');
                    btn.innerHTML = `<span>${_t('product.delete_confirm')}</span>`;
                    setTimeout(() => {
                        if (btn.isConnected) {
                            btn.classList.remove('confirming');
                            btn.innerHTML = TRASH_SVG;
                        }
                    }, 3000);
                    return;
                }

                btn.disabled = true;
                try {
                    await api.deleteReview(btn.dataset.reviewId);
                    showToast(_t('product.review_deleted'), 'success');
                    setTimeout(() => window.location.reload(), 500);
                } catch (err) {
                    showToast(err.message, 'error');
                    btn.disabled = false;
                }
            });
        }

        function renderProductCard(product) {
            const img = (product.images && product.images[0]) || product.image_url || 'logo/logo.jpg';
            const el = document.getElementById('reviews-product');
            el.innerHTML = `
                <a href="product-detail.html?id=${product.id}" class="reviews-product-thumb">
                    <img src="${img}" alt="${String(product.name).replace(/"/g, '&quot;')}" referrerpolicy="no-referrer">
                </a>
                <div class="reviews-product-meta">
                    <a href="product-detail.html?id=${product.id}" class="reviews-product-name">${product.name}</a>
                    <div class="reviews-product-price">${formatPrice(product.price)}</div>
                </div>`;
        }

        function renderSummary() {
            if (allReviews.length === 0) return;
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            const count = allReviews.length;
            const avg = allReviews.reduce((s, r) => s + (Number(r.rating) || 0), 0) / count;

            document.getElementById('rsp-avg').textContent = avg.toFixed(1);
            document.getElementById('rsp-stars').innerHTML = renderStars(avg);
            document.getElementById('rsp-count').textContent = count === 1
                ? _t('product.based_on_one_review')
                : _t('product.based_on_reviews').replace('{n}', count);

            // Distribution 5 → 1
            const dist = [0, 0, 0, 0, 0];
            allReviews.forEach(r => {
                const star = Math.round(Number(r.rating) || 0);
                if (star >= 1 && star <= 5) dist[star - 1]++;
            });
            const barsHtml = [5, 4, 3, 2, 1].map(star => {
                const n = dist[star - 1];
                const pct = count > 0 ? Math.round((n / count) * 100) : 0;
                return `
                    <div class="rsp-bar-row">
                        <span class="rsp-bar-label">${star} <span class="rsp-bar-star">★</span></span>
                        <div class="rsp-bar-track"><div class="rsp-bar-fill" style="width: ${pct}%;"></div></div>
                        <span class="rsp-bar-count">${n}</span>
                    </div>`;
            }).join('');
            document.getElementById('rsp-bars').innerHTML = barsHtml;
            document.getElementById('reviews-summary-panel').style.display = 'flex';
        }

        function renderVisibleReviews() {
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            const list = document.getElementById('reviews-list');
            if (allReviews.length === 0) {
                list.innerHTML = `
                    <div class="reviews-empty">
                        <div class="reviews-empty-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        </div>
                        <p>${_t('product.no_reviews')}</p>
                        <span>${_t('product.be_first_review')}</span>
                    </div>`;
                return;
            }

            const currentUserId = api.isLoggedIn() ? api.getUser()?.id : null;
            const isAdmin = api.isLoggedIn() && api.isAdmin();
            const shown = allReviews.slice(0, visibleCount);
            list.innerHTML = shown.map(review => {
                const userName = review.profiles?.full_name || 'Anonymous';
                const canDelete = currentUserId != null && (
                    (review.user_id != null && String(review.user_id) === String(currentUserId))
                    || isAdmin
                );
                return `
                    <div class="review-card">
                        <div class="review-header">
                            <div class="review-user">
                                <div class="review-avatar">${userName.charAt(0).toUpperCase()}</div>
                                <div>
                                    <div class="review-name">${userName}</div>
                                    <div class="review-date">${formatDate(review.created_at)}</div>
                                </div>
                            </div>
                            <div class="review-actions">
                                <div class="review-rating">
                                    ${renderStars(review.rating)}
                                </div>
                                ${canDelete ? `
                                <button class="review-delete" data-review-id="${review.id}" title="${_t('product.delete_review')}" aria-label="${_t('product.delete_review')}">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                </button>` : ''}
                            </div>
                        </div>
                        ${review.comment ? `<p class="review-comment">${review.comment}</p>` : ''}
                    </div>`;
            }).join('');
        }

        function renderPagination() {
            if (allReviews.length <= PAGE_SIZE) return;
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            const moreWrap = document.getElementById('reviews-more');
            const btn = document.getElementById('show-more-btn');
            const label = document.getElementById('showing-label');

            const update = () => {
                renderVisibleReviews();
                label.textContent = _t('product.reviews_showing')
                    .replace('{a}', Math.min(visibleCount, allReviews.length))
                    .replace('{b}', allReviews.length);
                btn.style.display = visibleCount < allReviews.length ? 'inline-flex' : 'none';
            };

            btn.textContent = _t('product.show_more_reviews');
            btn.addEventListener('click', () => {
                visibleCount += PAGE_SIZE;
                update();
            });
            update();
            moreWrap.style.display = 'flex';
        }

        function initStarRating() {
            const stars = document.querySelectorAll('#star-rating .star');
            stars.forEach(star => {
                star.addEventListener('click', () => {
                    const value = parseInt(star.dataset.value);
                    document.getElementById('review-rating').value = value;
                    stars.forEach(s => {
                        s.classList.toggle('active', parseInt(s.dataset.value) <= value);
                    });
                });

                star.addEventListener('mouseover', () => {
                    const value = parseInt(star.dataset.value);
                    stars.forEach(s => {
                        s.style.color = parseInt(s.dataset.value) <= value ? 'var(--status-warning)' : '';
                    });
                });

                star.addEventListener('mouseout', () => {
                    stars.forEach(s => { s.style.color = ''; });
                });
            });
        }

        function initReviewForm() {
            document.getElementById('review-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
                const rating = parseInt(document.getElementById('review-rating').value);
                const comment = document.getElementById('review-comment').value;

                if (rating === 0) {
                    showToast(_t('product.rating_label'), 'warning');
                    return;
                }

                try {
                    await api.createReview(productId, rating, comment);
                    showToast(_t('product.submit_review'), 'success');
                    setTimeout(() => window.location.reload(), 500);
                } catch (err) {
                    showToast(err.message, 'error');
                }
            });
        }
    </script>
</body>
</html>
