<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Orders Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        pre { background: #f4f4f4; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Orders Loading Test</h1>
    <div id="log"></div>
    <button onclick="runTest()">Run Test</button>
    
    <script src="js/api.js"></script>
    <script>
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'status ' + type;
            div.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            document.getElementById('log').appendChild(div);
            console.log(message);
        }
        
        async function runTest() {
            document.getElementById('log').innerHTML = '';
            
            try {
                log('Step 1: Check if user is logged in...');
                if (!api.isLoggedIn()) {
                    log('❌ User not logged in', 'error');
                    log('Please login at: http://localhost:5500/auth.html', 'info');
                    return;
                }
                log('✅ User is logged in', 'success');
                
                log('Step 2: Calling api.getOrders()...');
                const data = await api.getOrders();
                log('✅ API call successful', 'success');
                
                log('Step 3: Parsing response...');
                const orders = data.orders || [];
                log(`✅ Found ${orders.length} orders`, 'success');
                
                if (orders.length > 0) {
                    const pre = document.createElement('pre');
                    pre.textContent = JSON.stringify(orders[0], null, 2);
                    document.getElementById('log').appendChild(pre);
                }
                
            } catch (error) {
                log('❌ Error: ' + error.message, 'error');
                console.error(error);
            }
        }
        
        // Auto-run on page load
        setTimeout(runTest, 500);
    </script>
</body>
</html>
