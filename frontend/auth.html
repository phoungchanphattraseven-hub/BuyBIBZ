<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — BuyBIBZ</title>
    <meta name="description" content="Sign in to your BuyBIBZ account or create a new one.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="auth-page">
        <!-- Decorative Background -->
        <div class="hero-bg">
            <div class="hero-bg-gradient"></div>
            <div class="hero-orb hero-orb-1"></div>
            <div class="hero-orb hero-orb-2"></div>
        </div>

        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1 id="auth-title">Welcome Back</h1>
                    <p id="auth-subtitle">Sign in to continue shopping at BuyBIBZ</p>
                </div>

                <div class="auth-tabs">
                    <button class="auth-tab active" id="login-tab">Sign In</button>
                    <button class="auth-tab" id="register-tab">Create Account</button>
                </div>

                <!-- Login Form -->
                <div class="auth-form active" id="login-form">
                    <form id="login-form-el">
                        <div class="form-group">
                            <label class="form-label" for="login-email">Email Address</label>
                            <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="login-password">Password</label>
                            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-sm);">
                            Sign In
                        </button>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="auth-form" id="register-form">
                    <form id="register-form-el">
                        <div class="form-group">
                            <label class="form-label" for="register-name">Full Name</label>
                            <input type="text" id="register-name" class="form-input" placeholder="Your full name" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="register-email">Email Address</label>
                            <input type="email" id="register-email" class="form-input" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="register-password">Password</label>
                            <input type="password" id="register-password" class="form-input" placeholder="Min. 6 characters" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="register-confirm-password">Confirm Password</label>
                            <input type="password" id="register-confirm-password" class="form-input" placeholder="Confirm your password" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-sm);">
                            Create Account
                        </button>
                    </form>
                </div>

                <div class="auth-divider">or</div>
                <p class="auth-terms">
                    By signing in, you agree to our Terms of Service and Privacy Policy.
                </p>
            </div>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Redirect if already logged in
            if (api.isLoggedIn()) {
                const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
                window.location.href = redirect;
                return;
            }
            initAuth();
        });
    </script>
</body>
</html>
