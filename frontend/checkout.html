<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Checkout — BuyBIBZ</title>
    <meta name="description" content="Secure checkout for your BuyBIBZ order.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="checkout-page" id="checkout-main">
        <div class="container">
        <a class="page-back" href="cart.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span data-i18n="common.back">Back</span>
        </a>
            <div class="page-header">
                <h1 data-i18n="checkout.title">Checkout</h1>
                <p data-i18n="checkout.subtitle">Complete your order securely</p>
            </div>

            <div class="checkout-layout">
                <!-- Shipping Form -->
                <div class="checkout-form-card">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-xl);">
                        <h2 style="margin: 0;" data-i18n="checkout.shipping_details">Shipping Details</h2>
                        <div style="display: flex; align-items: center; gap: var(--space-sm);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--brand-primary);"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                            <span style="font-size: var(--font-sm); color: var(--text-secondary);">🇰🇭 Cambodia</span>
                        </div>
                    </div>
                    
                    <!-- Address from profile (if available) -->
                    <div id="saved-address-display" style="display: none;">
                        <div class="address-card">
                            <div class="address-card-header">
                                <div class="address-card-title">
                                    <div class="address-card-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                    </div>
                                    <h3 data-i18n="checkout.delivery_address">Delivery Address</h3>
                                </div>
                                <button type="button" class="btn-edit-address" id="btn-edit-address" data-i18n="checkout.edit">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
                                    <span data-i18n="checkout.edit">Edit</span>
                                </button>
                            </div>
                            <div id="saved-address-content" class="address-card-content">
                                <!-- Filled by JS -->
                            </div>
                        </div>
                        
                        <!-- Order Notes when using saved address -->
                        <div class="form-group" style="margin-top: var(--space-lg);">
                            <label class="form-label" for="notes-saved" data-i18n="checkout.order_notes">Order Notes (Optional)</label>
                            <textarea id="notes-saved" class="form-textarea" rows="3" data-i18n-placeholder="checkout.notes_placeholder" placeholder="Special instructions for delivery..."></textarea>
                        </div>
                        
                        <div class="payment-section">
                            <h3 class="payment-section-title" data-i18n="checkout.payment_method">Payment Method</h3>
                            
                            <!-- Cash on Delivery -->
                            <label class="payment-option payment-option-selected" onclick="selectPayment('cod', this)">
                                <div class="payment-option-content">
                                    <div class="payment-option-radio">
                                        <input type="radio" name="payment" value="cod" checked>
                                        <span class="radio-indicator"></span>
                                    </div>
                                    <div class="payment-option-details">
                                        <div class="payment-option-header">
                                            <span class="payment-option-name" data-i18n="checkout.cod">Cash on Delivery</span>
                                            <span class="payment-option-badge payment-option-badge-success" data-i18n="checkout.cod_available">Available</span>
                                        </div>
                                        <p class="payment-option-desc" data-i18n="checkout.cod_desc">Pay with cash when your order is delivered</p>
                                    </div>
                                </div>
                            </label>
                            
                            <!-- KHQR Payment -->
                            <label class="payment-option" onclick="selectPayment('khqr', this)">
                                <div class="payment-option-content">
                                    <div class="payment-option-radio">
                                        <input type="radio" name="payment" value="khqr">
                                        <span class="radio-indicator"></span>
                                    </div>
                                    <div class="payment-option-details">
                                        <div class="payment-option-header">
                                            <span class="payment-option-name" data-i18n="checkout.khqr">KHQR (Bakong)</span>
                                            <span class="payment-option-badge payment-option-badge-warning" data-i18n="checkout.khqr_instant">Instant</span>
                                        </div>
                                        <p class="payment-option-desc" data-i18n="checkout.khqr_desc">Scan QR code with any Cambodian banking app</p>
                                    </div>
                                </div>
                            </label>
                        </div>
                        
                        <button type="button" class="btn btn-primary btn-lg btn-full" id="submit-saved-btn" data-i18n="checkout.place_order">
                            Place Order
                        </button>
                    </div>

                    <form id="checkout-form">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-xl);">
                            <h2 style="margin: 0;" data-i18n="checkout.shipping_details">Shipping Details</h2>
                            <div style="display: flex; align-items: center; gap: var(--space-sm);">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--brand-primary);"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                <span style="font-size: var(--font-sm); color: var(--text-secondary);">🇰🇭 Cambodia</span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="shipping_name" data-i18n="checkout.full_name">Full Name</label>
                            <input type="text" id="shipping_name" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="shipping_phone" data-i18n="checkout.phone">Phone Number</label>
                            <input type="tel" id="shipping_phone" class="form-input" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="shipping_country" data-i18n="checkout.country">Country</label>
                            <div class="country-locked">
                                <span class="country-flag">🇰🇭</span>
                                <span>Cambodia</span>
                                <span class="country-note" data-i18n="checkout.country_locked">Cambodia only</span>
                            </div>
                        </div>

                        <div class="grid grid-2 gap-md">
                            <div class="form-group kh-combo-group">
                                <label class="form-label" for="shipping_province" data-i18n="checkout.province">Province / City</label>
                                <input type="text" id="shipping_province" class="form-input"
                                       placeholder="Select or type to search" data-i18n-placeholder="checkout.combo_placeholder" autocomplete="off">
                                <input type="hidden" id="shipping_province_code">
                            </div>
                            <div class="form-group kh-combo-group">
                                <label class="form-label" for="shipping_district" data-i18n="checkout.district">District / Khan / Srok</label>
                                <input type="text" id="shipping_district" class="form-input" disabled
                                       placeholder="Select or type to search" data-i18n-placeholder="checkout.combo_placeholder" autocomplete="off">
                                <input type="hidden" id="shipping_district_code">
                            </div>
                        </div>

                        <div class="grid grid-2 gap-md">
                            <div class="form-group kh-combo-group">
                                <label class="form-label" for="shipping_commune" data-i18n="checkout.commune">Commune / Sangkat</label>
                                <input type="text" id="shipping_commune" class="form-input" disabled
                                       placeholder="Select or type to search" data-i18n-placeholder="checkout.combo_placeholder" autocomplete="off">
                                <input type="hidden" id="shipping_commune_code">
                            </div>
                            <div class="form-group kh-combo-group">
                                <label class="form-label" for="shipping_village" data-i18n="checkout.village">Village / Phum (Optional)</label>
                                <input type="text" id="shipping_village" class="form-input" disabled
                                       placeholder="Select or type to search" data-i18n-placeholder="checkout.combo_placeholder" autocomplete="off">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="shipping_address" data-i18n="checkout.street">Street Address / House No.</label>
                            <input type="text" id="shipping_address" class="form-input">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="shipping_postal" data-i18n="checkout.postal">Postal Code (Optional)</label>
                            <input type="text" id="shipping_postal" class="form-input">
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="notes" data-i18n="checkout.order_notes">Order Notes (Optional)</label>
                            <textarea id="notes" class="form-textarea" rows="3" data-i18n-placeholder="checkout.notes_placeholder" placeholder="Special instructions for delivery..."></textarea>
                        </div>
                        
                        <div class="payment-section">
                            <h3 class="payment-section-title" data-i18n="checkout.payment_method">Payment Method</h3>
                            
                            <!-- Cash on Delivery -->
                            <label class="payment-option payment-option-selected" onclick="selectPayment('cod', this)">
                                <div class="payment-option-content">
                                    <div class="payment-option-radio">
                                        <input type="radio" name="payment" value="cod" checked>
                                        <span class="radio-indicator"></span>
                                    </div>
                                    <div class="payment-option-details">
                                        <div class="payment-option-header">
                                            <span class="payment-option-name" data-i18n="checkout.cod">Cash on Delivery</span>
                                            <span class="payment-option-badge payment-option-badge-success" data-i18n="checkout.cod_available">Available</span>
                                        </div>
                                        <p class="payment-option-desc" data-i18n="checkout.cod_desc">Pay with cash when your order is delivered</p>
                                    </div>
                                </div>
                            </label>
                            
                            <!-- KHQR Payment -->
                            <label class="payment-option" onclick="selectPayment('khqr', this)">
                                <div class="payment-option-content">
                                    <div class="payment-option-radio">
                                        <input type="radio" name="payment" value="khqr">
                                        <span class="radio-indicator"></span>
                                    </div>
                                    <div class="payment-option-details">
                                        <div class="payment-option-header">
                                            <span class="payment-option-name" data-i18n="checkout.khqr">KHQR (Bakong)</span>
                                            <span class="payment-option-badge payment-option-badge-warning" data-i18n="checkout.khqr_instant">Instant</span>
                                        </div>
                                        <p class="payment-option-desc" data-i18n="checkout.khqr_desc">Scan QR code with any Cambodian banking app</p>
                                    </div>
                                </div>
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top: var(--space-2xl);" id="submit-btn" data-i18n="checkout.place_order">
                            Place Order
                        </button>
                    </form>
                </div>

                <!-- Order Summary -->
                <div class="order-summary-card">
                    <div class="cart-summary" style="position: static; padding: var(--space-xl);">
                        <h3 data-i18n="cart.order_summary">Order Summary</h3>
                        
                        <div id="checkout-items" style="margin-bottom: var(--space-lg); max-height: 300px; overflow-y: auto; padding-right: 10px;">
                            <!-- Items loaded dynamically -->
                        </div>
                        
                        <div class="cart-summary-row" style="border-top: 1px solid var(--border-subtle); padding-top: var(--space-md);">
                            <span><span data-i18n="cart.subtotal">Subtotal</span> (<span id="summary-count">0</span> <span data-i18n="cart.items">items</span>)</span>
                            <span id="summary-subtotal">$0.00</span>
                        </div>
                        <div class="cart-summary-row">
                            <span data-i18n="checkout.intl_shipping">International Shipping</span>
                            <span id="summary-shipping" style="color: var(--status-success);" data-i18n="cart.free">Free</span>
                        </div>
                        <div class="cart-summary-row">
                            <span data-i18n="cart.transaction_fee">Transaction Fee (3%)</span>
                            <span id="summary-fee">$0.00</span>
                        </div>
                        <div class="cart-summary-total">
                            <span data-i18n="cart.total">Total</span>
                            <span id="summary-total" style="color: var(--text-brand);">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/kh-address-data.js"></script>
    <script src="js/kh-address.js"></script>
    <script src="js/pwa-install.js"></script>
    <script>
        let selectedPaymentMethod = 'cod';
        
        function selectPayment(method, element) {
            selectedPaymentMethod = method;
            
            // Update styles using CSS classes
            document.querySelectorAll('.payment-option').forEach(label => {
                label.classList.remove('payment-option-selected');
            });
            
            element.classList.add('payment-option-selected');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (!requireAuth()) return;

            let savedAddress = null;

            // Cascading Cambodia address pickers (province → district → commune → village)
            const addressPickers = window.KHAddressUI ? KHAddressUI.initCheckoutPickers() : null;

            // Load profile to check for saved address
            try {
                console.log('Loading profile for checkout...');
                
                // First try to get cached data from localStorage for instant display
                const cachedUser = localStorage.getItem('buybibz_user');
                if (cachedUser) {
                    try {
                        const user = JSON.parse(cachedUser);
                        console.log('Cached user data:', user);
                        
                        if (user.phone) {
                            savedAddress = user;
                            
                            // Show the saved address display from cache
                            document.getElementById('saved-address-display').style.display = 'block';
                            
                            // Build address display with Cambodia-specific fields if available
                            let addressLines = [
                                `<strong>${user.full_name || ''}</strong>`,
                                user.phone
                            ];
                            
                            // Build location parts
                            let locationParts = [];
                            if (user.address) locationParts.push(user.address);
                            if (user.province || user.city) locationParts.push(user.province || user.city);
                            if (user.district) locationParts.push(user.district);
                            if (user.commune) locationParts.push(user.commune);
                            if (user.village) locationParts.push(user.village);
                            if (user.postal_code) locationParts.push(user.postal_code);
                            
                            if (locationParts.length > 0) {
                                addressLines.push(locationParts.join(', '));
                            }
                            
                            document.getElementById('saved-address-content').innerHTML = addressLines.join('<br>');
                            console.log('Address display updated from cache:', addressLines);

                            // Hide the form initially
                            document.getElementById('checkout-form').style.display = 'none';
                        }
                    } catch (e) {
                        console.error('Failed to parse cached user:', e);
                    }
                }
                
                // Then load fresh data from API
                const profileResult = await api.getProfile();
                console.log('Profile result:', profileResult);
                
                if (profileResult && profileResult.user) {
                    const p = profileResult.user;
                    console.log('User profile data from API:', p);

                    // Check if user has complete address (now only requires phone)
                    if (p.phone) {
                        savedAddress = p;

                        // Show the saved address display
                        document.getElementById('saved-address-display').style.display = 'block';
                        
                        // Build address display with Cambodia-specific fields if available
                        let addressLines = [
                            `<strong>${p.full_name || api.getUser()?.full_name || ''}</strong>`,
                            p.phone
                        ];
                        
                        // Build location parts
                        let locationParts = [];
                        if (p.address) locationParts.push(p.address);
                        if (p.province || p.city) locationParts.push(p.province || p.city);
                        if (p.district) locationParts.push(p.district);
                        if (p.commune) locationParts.push(p.commune);
                        if (p.village) locationParts.push(p.village);
                        if (p.postal_code) locationParts.push(p.postal_code);
                        
                        if (locationParts.length > 0) {
                            addressLines.push(locationParts.join(', '));
                        }
                        
                        document.getElementById('saved-address-content').innerHTML = addressLines.join('<br>');
                        console.log('Address display updated from API:', addressLines);

                        // Hide the form initially
                        document.getElementById('checkout-form').style.display = 'none';

                        // Only add edit button listener if not already added
                        if (!document.getElementById('btn-edit-address').hasAttribute('data-listener-added')) {
                            document.getElementById('btn-edit-address').setAttribute('data-listener-added', 'true');
                            
                            // Edit button shows the form
                            document.getElementById('btn-edit-address').addEventListener('click', () => {
                                document.getElementById('saved-address-display').style.display = 'none';
                                document.getElementById('checkout-form').style.display = 'block';

                                // Pre-fill the form
                                document.getElementById('shipping_name').value = p.full_name || api.getUser()?.full_name || '';
                                document.getElementById('shipping_phone').value = p.phone || '';
                                document.getElementById('shipping_address').value = p.address || '';
                                document.getElementById('shipping_postal').value = p.postal_code || '';
                                
                                // Pre-fill Cambodia address fields if available
                                if (addressPickers) {
                                    if (p.province_code) {
                                        document.getElementById('shipping_province_code').value = p.province_code;
                                        document.getElementById('shipping_province').value = p.province || p.city || '';
                                        document.getElementById('shipping_district').disabled = false;
                                        
                                        if (p.district_code) {
                                            document.getElementById('shipping_district_code').value = p.district_code;
                                            document.getElementById('shipping_district').value = p.district || '';
                                            document.getElementById('shipping_commune').disabled = false;
                                            
                                            if (p.commune_code) {
                                                document.getElementById('shipping_commune_code').value = p.commune_code;
                                                document.getElementById('shipping_commune').value = p.commune || '';
                                                document.getElementById('shipping_village').disabled = false;
                                                
                                                if (p.village) {
                                                    document.getElementById('shipping_village').value = p.village;
                                                }
                                            }
                                        }
                                    } else {
                                        // Fallback to legacy city field
                                        addressPickers.preselect(p.city);
                                    }
                                }
                            });
                        }
                    } else {
                        console.log('User does not have phone number, showing form');
                        // No complete address, show form with warning
                        const user = api.getUser();
                        if (user) {
                            document.getElementById('shipping_name').value = user.full_name || '';
                            if (user.phone) document.getElementById('shipping_phone').value = user.phone;
                        }

                        if (p.address) document.getElementById('shipping_address').value = p.address;
                        if (p.postal_code) document.getElementById('shipping_postal').value = p.postal_code;
                        if (p.phone) document.getElementById('shipping_phone').value = p.phone;
                        
                        // Pre-fill Cambodia address fields if available
                        if (addressPickers) {
                            if (p.province_code) {
                                document.getElementById('shipping_province_code').value = p.province_code;
                                document.getElementById('shipping_province').value = p.province || p.city || '';
                                document.getElementById('shipping_district').disabled = false;
                                
                                if (p.district_code) {
                                    document.getElementById('shipping_district_code').value = p.district_code;
                                    document.getElementById('shipping_district').value = p.district || '';
                                    document.getElementById('shipping_commune').disabled = false;
                                    
                                    if (p.commune_code) {
                                        document.getElementById('shipping_commune_code').value = p.commune_code;
                                        document.getElementById('shipping_commune').value = p.commune || '';
                                        document.getElementById('shipping_village').disabled = false;
                                        
                                        if (p.village) {
                                            document.getElementById('shipping_village').value = p.village;
                                        }
                                    }
                                }
                            } else {
                                // Fallback to legacy city field
                                addressPickers.preselect(p.city);
                            }
                        }
                    }
                }
            } catch (err) {
                console.error('Failed to load profile address:', err);
                // Show form on error
                document.getElementById('checkout-form').style.display = 'block';
                document.getElementById('saved-address-display').style.display = 'none';
            }

            loadCheckoutSummary();
            initCheckoutForm(savedAddress);
            
            // Handle Place Order button for saved address
            if (savedAddress) {
                document.getElementById('submit-saved-btn')?.addEventListener('click', async () => {
                    await processOrder(savedAddress, true);
                });
            }
        });
        
        async function processOrder(savedAddress = null, isSavedAddress = false) {
            const btn = isSavedAddress ? document.getElementById('submit-saved-btn') : document.getElementById('submit-btn');
            
            let orderData;
            if (isSavedAddress && savedAddress) {
                orderData = {
                    shipping_name: savedAddress.full_name || api.getUser()?.full_name || '',
                    shipping_phone: savedAddress.phone,
                    shipping_address: savedAddress.address,
                    shipping_city: savedAddress.city,
                    shipping_postal: savedAddress.postal_code || '',
                    notes: document.getElementById('notes-saved')?.value || null,
                    payment_method: selectedPaymentMethod,
                };
                
                // Add Cambodia-specific address fields if available
                if (savedAddress.province) {
                    orderData.shipping_province = savedAddress.province;
                    orderData.shipping_province_code = savedAddress.province_code;
                }
                if (savedAddress.district) {
                    orderData.shipping_district = savedAddress.district;
                    orderData.shipping_district_code = savedAddress.district_code;
                }
                if (savedAddress.commune) {
                    orderData.shipping_commune = savedAddress.commune;
                    orderData.shipping_commune_code = savedAddress.commune_code;
                }
                if (savedAddress.village) {
                    orderData.shipping_village = savedAddress.village;
                }
            } else {
                // Validate required fields (name and phone)
                if (!document.getElementById('shipping_name').value.trim()) {
                    showToast(typeof i18n !== 'undefined' ? i18n.t('checkout.name_required') : 'Name is required', 'warning');
                    document.getElementById('shipping_name').focus();
                    return;
                }
                if (!document.getElementById('shipping_phone').value.trim()) {
                    showToast(typeof i18n !== 'undefined' ? i18n.t('checkout.phone_required') : 'Phone number is required', 'warning');
                    document.getElementById('shipping_phone').focus();
                    return;
                }

                const provinceName = document.getElementById('shipping_province').value.trim();
                const districtName = document.getElementById('shipping_district').value.trim();
                const communeName = document.getElementById('shipping_commune').value.trim();
                const villageName = document.getElementById('shipping_village')?.value.trim() || '';
                
                const provinceCode = document.getElementById('shipping_province_code').value;
                const districtCode = document.getElementById('shipping_district_code').value;
                const communeCode = document.getElementById('shipping_commune_code').value;

                orderData = {
                    shipping_name: document.getElementById('shipping_name').value,
                    shipping_phone: document.getElementById('shipping_phone').value,
                    shipping_address: document.getElementById('shipping_address').value,
                    shipping_city: provinceName,
                    shipping_province: provinceName,
                    shipping_province_code: provinceCode,
                    shipping_district: districtName,
                    shipping_district_code: districtCode,
                    shipping_commune: communeName,
                    shipping_commune_code: communeCode,
                    shipping_village: villageName || null,
                    shipping_postal: document.getElementById('shipping_postal').value,
                    notes: document.getElementById('notes').value || null,
                    payment_method: selectedPaymentMethod,
                };
            }

            btn.disabled = true;
            btn.innerHTML = `${typeof i18n !== 'undefined' ? i18n.t('checkout.processing_btn') : 'Processing...'} <svg style="animation: spin 1s linear infinite; margin-left: 8px;" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`;

            try {
                const res = await api.createOrder(orderData);
                
                // If KHQR payment, show QR code
                if (selectedPaymentMethod === 'khqr') {
                    showKHQRPayment(res, orderData);
                } else {
                    showOrderSuccess(res);
                }
                
                updateCartBadge();
            } catch (err) {
                showToast(err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = typeof i18n !== 'undefined' ? i18n.t('checkout.place_order') : 'Place Order';
            }
        }
        
        function showKHQRPayment(orderRes, orderData) {
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            const total = document.getElementById('summary-total').textContent;
            
            document.getElementById('checkout-main').innerHTML = `
                <div class="container" style="max-width: 500px; text-align: center; padding: var(--space-2xl) var(--space-lg);">
                    <div style="margin-bottom: var(--space-xl);">
                        <div style="width: 64px; height: 64px; background: rgba(27, 140, 61, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-md);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--brand-primary);"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h.01M7 12h.01M7 17h.01M12 7h.01M12 12h.01M12 17h.01M17 7h.01M17 12h.01M17 17h.01"/></svg>
                        </div>
                        <h1 style="font-size: var(--font-2xl); margin-bottom: var(--space-sm);">${_t('checkout.scan_to_pay')}</h1>
                        <p style="color: var(--text-secondary);">${_t('orders.order_uid')}: ${orderRes.order_uid || orderRes.order_id}</p>
                    </div>
                    
                    <div style="background: white; padding: var(--space-xl); border-radius: var(--radius-xl); margin-bottom: var(--space-xl); box-shadow: var(--shadow-lg);">
                        <div id="khqr-code" style="display: flex; justify-content: center; margin-bottom: var(--space-md);"></div>
                        <div style="font-size: var(--font-3xl); font-weight: 800; color: var(--text-inverse); margin-bottom: var(--space-xs);">${total}</div>
                        <div style="font-size: var(--font-sm); color: #666;">${_t('checkout.scan_desc')}</div>
                    </div>
                    
                    <div class="address-card">
                        <div class="address-card-header">
                            <div class="address-card-title">
                                <div class="address-card-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                                </div>
                                <h3>${_t('checkout.delivery_to')}</h3>
                            </div>
                        </div>
                        <div class="address-card-content">
                            <strong>${orderData.shipping_name}</strong><br>
                            ${orderData.shipping_phone}<br>
                            ${(() => {
                                const addressParts = [orderData.shipping_address, orderData.shipping_city];
                                if (orderData.shipping_district) addressParts.push(orderData.shipping_district);
                                if (orderData.shipping_commune) addressParts.push(orderData.shipping_commune);
                                if (orderData.shipping_village) addressParts.push(orderData.shipping_village);
                                if (orderData.shipping_postal) addressParts.push(orderData.shipping_postal);
                                return addressParts.filter(Boolean).join(', ');
                            })()}
                        </div>
                    </div>
                    
                    <p style="font-size: var(--font-sm); color: var(--text-tertiary); margin-bottom: var(--space-lg);">
                        ${_t('checkout.after_payment')}
                    </p>
                    
                    <div style="display: flex; gap: var(--space-md); justify-content: center; flex-wrap: wrap;">
                        <a href="orders.html" class="btn btn-primary">${_t('checkout.view_orders')}</a>
                        <a href="products.html" class="btn btn-secondary">${_t('checkout.continue_shopping')}</a>
                    </div>
                </div>
            `;
            
            // Generate QR code (using a placeholder - integrate with real KHQR API)
            generateKHQR(orderRes.order_uid || orderRes.order_id, total);
        }
        
        function generateKHQR(orderUid, amount) {
            // Placeholder QR code generation
            // In production, integrate with Cambodia's KHQR API
            const qrContainer = document.getElementById('khqr-code');
            const qrData = `KHQR:order_${orderUid}:${amount}`;
            
            // Using a simple QR placeholder
            qrContainer.innerHTML = `
                <svg viewBox="0 0 200 200" width="200" height="200" style="background: white;">
                    <rect width="200" height="200" fill="white"/>
                    <rect x="20" y="20" width="40" height="40" fill="black"/>
                    <rect x="140" y="20" width="40" height="40" fill="black"/>
                    <rect x="20" y="140" width="40" height="40" fill="black"/>
                    <rect x="80" y="80" width="40" height="40" fill="black"/>
                    <text x="100" y="105" text-anchor="middle" font-size="10" fill="black">KHQR</text>
                </svg>
                <p style="font-size: var(--font-xs); color: #666; margin-top: var(--space-sm);">
                    <strong>Note:</strong> QR code integration with KHQR/Bakong API required for production
                </p>
            `;
        }
        
        function showOrderSuccess(res) {
            const _t = typeof i18n !== 'undefined' ? i18n.t.bind(i18n) : (k) => k;
            document.getElementById('checkout-main').innerHTML = `
                <div class="container order-success">
                    <div class="success-checkmark">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                    </div>
                    <h1 style="font-size: var(--font-3xl); margin-bottom: var(--space-md);">${_t('checkout.order_confirmed')}</h1>
                    <p style="color: var(--text-secondary); font-size: var(--font-lg); margin-bottom: var(--space-xl);">
                        ${_t('checkout.thank_you')}<br>
                        ${_t('orders.order_uid')} ${res.order_uid || res.order_id} ${_t('checkout.order_placed')}
                    </p>
                    <div style="display: flex; gap: var(--space-md); justify-content: center;">
                        <a href="orders.html" class="btn btn-primary btn-lg">${_t('checkout.view_orders')}</a>
                        <a href="products.html" class="btn btn-secondary btn-lg">${_t('checkout.continue_shopping')}</a>
                    </div>
                </div>
            `;
        }

        async function loadCheckoutSummary() {
            try {
                const data = await api.getCart();
                
                if (!data.items || data.items.length === 0) {
                    showToast(typeof i18n !== 'undefined' ? i18n.t('checkout.empty_cart_warning') : 'Your cart is empty', 'warning');
                    window.location.href = 'cart.html';
                    return;
                }

                document.getElementById('summary-count').textContent = data.count;
                document.getElementById('summary-subtotal').textContent = formatPrice(data.subtotal ?? data.total);
                document.getElementById('summary-fee').textContent = formatPrice(data.transaction_fee ?? 0);
                document.getElementById('summary-total').textContent = formatPrice(data.total);

                const shippingEl = document.getElementById('summary-shipping');
                const shippingFee = data.shipping ?? 0;
                if (shippingFee > 0) {
                    shippingEl.textContent = formatPrice(shippingFee);
                    shippingEl.style.color = '';
                } else {
                    shippingEl.textContent = typeof i18n !== 'undefined' ? i18n.t('cart.free') : 'Free';
                    shippingEl.style.color = 'var(--status-success)';
                }
                
                const itemsContainer = document.getElementById('checkout-items');
                itemsContainer.innerHTML = data.items.map(item => {
                    const product = item.products;
                    const selectedOptions = item.selected_options || {};
                    const selectedImage = selectedOptions._selected_image || product.image_url || 'https://via.placeholder.com/50x50?text=Img';
                    const optionLabels = { colors: 'Color', sizes: 'Size', weight: 'Weight', dimensions: 'Dimensions', variant: 'Variant' };
                    const optionsText = Object.entries(selectedOptions)
                        .filter(([key]) => key !== '_selected_image')
                        .map(([key, value]) => `${toEnglishProductText(optionLabels[key] || key.replace(/_/g, ' '))}: ${toEnglishProductText(value, 'Standard')}`)
                        .join(' · ');
                    return `
                        <div style="display: flex; gap: var(--space-sm); margin-bottom: var(--space-sm); align-items: center;">
                            <div style="position: relative; flex-shrink: 0;">
                                <img src="${selectedImage}" alt="${product.name}" style="width: 50px; height: 50px; object-fit: cover; border-radius: var(--radius-sm);">
                                <span style="position: absolute; top: -5px; right: -5px; background: var(--bg-elevated); color: var(--text-primary); width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; border: 1px solid var(--border-default); font-weight: 700;">${item.quantity}</span>
                            </div>
                            <div style="flex: 1; font-size: var(--font-sm); min-width: 0;">
                                <div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;">${product.name}</div>
                                ${optionsText ? `<div style="color: var(--text-tertiary); font-size: var(--font-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px;">${optionsText}</div>` : ''}
                                <div style="color: var(--text-tertiary);">${formatPrice(product.price)}</div>
                            </div>
                            <div style="font-weight: 700; font-size: var(--font-sm); flex-shrink: 0;">
                                ${formatPrice(product.price * item.quantity)}
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (err) {
                showToast('Failed to load order summary', 'error');
            }
        }

        function initCheckoutForm(savedAddress) {
            document.getElementById('checkout-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                await processOrder(savedAddress, false);
            });
        }
    </script>
    <style>
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
