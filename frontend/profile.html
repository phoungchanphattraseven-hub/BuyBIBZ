<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile Settings — BuyBIBZ</title>
    <meta name="description" content="Manage your account profile and shipping address.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="profile-page">
        <div class="container profile-container">
        <a class="page-back" href="index.html">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span data-i18n="common.back">Back</span>
        </a>
            <div class="page-header" style="text-align: left; margin-bottom: var(--space-xl); padding: 0 var(--space-md);">
                <h1 data-i18n="profile.title">Settings</h1>
            </div>

            <!-- Profile hero -->
            <div class="profile-hero">
                <div class="profile-avatar" id="ph-avatar">U</div>
                <div class="profile-hero-info">
                    <div class="profile-hero-name" id="ph-name">&nbsp;</div>
                    <div class="profile-hero-email" id="ph-email">&nbsp;</div>
                </div>
                <a class="profile-hero-orders" href="orders.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
                    <span data-i18n="nav.orders">My Orders</span>
                </a>
            </div>

            <form id="combined-settings-form">
                <!-- Personal Information -->
                <div class="settings-group">
                    <div class="settings-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span data-i18n="profile.personal">Personal Information</span>
                    </div>
                    <div class="settings-list">
                        <div class="settings-item">
                            <label class="settings-label" for="profile-name"><span data-i18n="profile.name">Name</span></label>
                            <div class="settings-control">
                                <input type="text" id="profile-name" class="settings-input" placeholder="John Doe" autocomplete="name">
                            </div>
                        </div>
                        <div class="settings-item">
                            <label class="settings-label" for="profile-phone"><span data-i18n="profile.phone">Phone</span><span class="req">*</span></label>
                            <div class="settings-control">
                                <input type="tel" id="profile-phone" class="settings-input" placeholder="+1 (555) 000-0000" autocomplete="tel" required>
                            </div>
                        </div>
                        <div class="settings-item">
                            <label class="settings-label" for="profile-email"><span data-i18n="profile.email">Email</span></label>
                            <div class="settings-control">
                                <input type="email" id="profile-email" class="settings-input" disabled>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Shipping Address -->
                <div class="settings-group">
                    <div class="settings-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                        <span data-i18n="profile.shipping">Shipping Address</span>
                    </div>
                    <div class="settings-list">
                        <div class="settings-item">
                            <label class="settings-label" data-i18n="checkout.country">Country</label>
                            <div class="country-locked" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--bg-tertiary); border: 1px solid var(--border-default); border-radius: var(--radius-sm);">
                                <span class="country-flag">🇰🇭</span>
                                <span>Cambodia</span>
                                <span class="country-note" style="font-size: 0.75rem; color: var(--text-tertiary); margin-left: auto;" data-i18n="checkout.country_locked">Cambodia only</span>
                            </div>
                        </div>
                        
                        <div class="settings-row">
                            <div class="settings-item kh-combo-group">
                                <label class="settings-label" for="profile_province"><span data-i18n="checkout.province">Province / City</span></label>
                                <div class="settings-control">
                                    <input type="text" id="profile_province" class="settings-input"
                                           placeholder="Select or type to search" data-i18n-placeholder="checkout.combo_placeholder" autocomplete="off">
                                    <input type="hidden" id="profile_province_code">
                                </div>
                            </div>
                            <div class="settings-item kh-combo-group">
                                <label class="settings-label" for="profile_district"><span data-i18n="checkout.district">District / Khan / Srok</span></label>
                                <div class="settings-control">
                                    <input type="text" id="profile_district" class="settings-input" disabled
                                           placeholder="Select or type to search" data-i18n-placeholder="checkout.combo_placeholder" autocomplete="off">
                                    <input type="hidden" id="profile_district_code">
                                </div>
                            </div>
                        </div>

                        <div class="settings-row">
                            <div class="settings-item kh-combo-group">
                                <label class="settings-label" for="profile_commune"><span data-i18n="checkout.commune">Commune / Sangkat</span></label>
                                <div class="settings-control">
                                    <input type="text" id="profile_commune" class="settings-input" disabled
                                           placeholder="Select or type to search" data-i18n-placeholder="checkout.combo_placeholder" autocomplete="off">
                                    <input type="hidden" id="profile_commune_code">
                                </div>
                            </div>
                            <div class="settings-item kh-combo-group">
                                <label class="settings-label" for="profile_village"><span data-i18n="checkout.village">Village / Phum (Optional)</span></label>
                                <div class="settings-control">
                                    <input type="text" id="profile_village" class="settings-input" disabled
                                           placeholder="Select or type to search" data-i18n-placeholder="checkout.combo_placeholder" autocomplete="off">
                                </div>
                            </div>
                        </div>

                        <div class="settings-item">
                            <label class="settings-label" for="profile-address"><span data-i18n="checkout.street">Street Address / House No.</span></label>
                            <div class="settings-control">
                                <input type="text" id="profile-address" class="settings-input" placeholder="123 Main St" autocomplete="street-address">
                            </div>
                        </div>
                        
                        <div class="settings-item">
                            <label class="settings-label" for="profile-postal"><span data-i18n="checkout.postal">Postal Code (Optional)</span></label>
                            <div class="settings-control">
                                <input type="text" id="profile-postal" class="settings-input" placeholder="10001" autocomplete="postal-code">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Regional Settings -->
                <div class="settings-group">
                    <div class="settings-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                        <span data-i18n="profile.regional">Regional</span>
                    </div>
                    <div class="settings-list">
                        <div class="settings-row">
                            <div class="settings-item">
                                <label class="settings-label" for="pref-language"><span data-i18n="profile.language">Language</span></label>
                                <div class="settings-control">
                                    <select id="pref-language" class="settings-select">
                                        <option value="en">English (US)</option>
                                        <option value="km">Khmer (ខ្មែរ)</option>
                                        <option value="fr">French (Français)</option>
                                    </select>
                                </div>
                            </div>
                            <div class="settings-item">
                                <label class="settings-label" for="pref-currency"><span data-i18n="profile.currency">Currency</span></label>
                                <div class="settings-control">
                                    <select id="pref-currency" class="settings-select">
                                        <option value="USD">USD ($)</option>
                                        <option value="KHR">KHR (៛)</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notifications -->
                <div class="settings-group">
                    <div class="settings-header">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                        <span data-i18n="profile.notifications">Notifications</span>
                    </div>
                    <div class="settings-list">
                        <div class="settings-item settings-item-toggle">
                            <div class="settings-toggle-info">
                                <span class="settings-label" data-i18n="profile.order_updates">Order Updates</span>
                                <span class="settings-desc" data-i18n="profile.order_updates_desc">Shipping and delivery status</span>
                            </div>
                            <div class="settings-control">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="pref-notif-orders" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                        <div class="settings-item settings-item-toggle">
                            <div class="settings-toggle-info">
                                <span class="settings-label" data-i18n="profile.promotions">Promotions</span>
                                <span class="settings-desc" data-i18n="profile.promotions_desc">Deals, sales and new arrivals</span>
                            </div>
                            <div class="settings-control">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="pref-notif-promos">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div style="margin-top: var(--space-2xl); padding: 0 var(--space-md);">
                    <button type="submit" class="btn btn-primary btn-lg" id="save-all-btn" style="width: 100%;">
                        <span data-i18n="profile.save">Save Changes</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/kh-address-data.js"></script>
    <script src="js/kh-address.js"></script>
    <script src="js/pwa-install.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
