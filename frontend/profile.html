<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('buybibz-theme');
                if (theme !== 'dark' && theme !== 'light') theme = 'light';
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
            } catch (e) {}
        })();
    </script>
    <style>
        html, body { background-color: #fcfdfb; }
        html[data-theme="dark"], html[data-theme="dark"] body { background-color: #101713; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile Settings — BuyBIBZ</title>
    <meta name="description" content="Manage your account profile and shipping address.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../logo/logo.jpg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar" id="navbar"></header>

    <main class="profile-page" style="background: var(--bg-secondary); min-height: 100vh;">
        <div class="container" style="max-width: 600px; padding: var(--space-2xl) var(--space-md);">
            <div class="page-header" style="text-align: left; margin-bottom: var(--space-xl); padding: 0 var(--space-md);">
                <h1 data-i18n="profile.title">Settings</h1>
            </div>

            <form id="combined-settings-form">
                <!-- Personal Information -->
                <div class="settings-group">
                    <div class="settings-header" data-i18n="profile.personal">Personal Information</div>
                    <div class="settings-list">
                        <div class="settings-item">
                            <div class="settings-label">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-tertiary);"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                <span data-i18n="profile.name">Name</span>
                            </div>
                            <div class="settings-control">
                                <input type="text" id="profile-name" class="settings-input" placeholder="John Doe">
                            </div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-tertiary);"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>
                                <span data-i18n="profile.phone">Phone</span>
                                <span style="color: var(--status-error); margin-left: 4px;">*</span>
                            </div>
                            <div class="settings-control">
                                <input type="tel" id="profile-phone" class="settings-input" placeholder="+1 (555) 000-0000" required>
                            </div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-tertiary);"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                                <span data-i18n="profile.email">Email</span>
                            </div>
                            <div class="settings-control">
                                <input type="email" id="profile-email" class="settings-input" disabled>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Shipping Address -->
                <div class="settings-group">
                    <div class="settings-header">
                        <span data-i18n="profile.shipping">Shipping Address</span>
                        <span style="color: var(--status-error); font-size: var(--font-xs); font-weight: 500; margin-left: var(--space-sm);">* Required for checkout</span>
                    </div>
                    <div class="settings-list">
                        <div class="settings-item">
                            <div class="settings-label">
                                <span data-i18n="profile.street">Street</span>
                                <span style="color: var(--status-error);">*</span>
                            </div>
                            <div class="settings-control">
                                <input type="text" id="profile-address" class="settings-input" placeholder="123 Main St" required>
                            </div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">
                                <span data-i18n="profile.city">City</span>
                                <span style="color: var(--status-error);">*</span>
                            </div>
                            <div class="settings-control">
                                <input type="text" id="profile-city" class="settings-input" placeholder="New York" required>
                            </div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label" data-i18n="profile.postal">Postal Code</div>
                            <div class="settings-control">
                                <input type="text" id="profile-postal" class="settings-input" placeholder="10001">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Regional Settings -->
                <div class="settings-group">
                    <div class="settings-header" data-i18n="profile.regional">Regional</div>
                    <div class="settings-list">
                        <div class="settings-item">
                            <div class="settings-label">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-tertiary);"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
                                <span data-i18n="profile.language">Language</span>
                            </div>
                            <div class="settings-control">
                                <select id="pref-language" class="settings-select" dir="rtl">
                                    <option value="en">English (US)</option>
                                    <option value="km">Khmer (ខ្មែរ)</option>
                                    <option value="fr">French (Français)</option>
                                </select>
                            </div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-tertiary);"><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></svg>
                                <span data-i18n="profile.currency">Currency</span>
                            </div>
                            <div class="settings-control">
                                <select id="pref-currency" class="settings-select" dir="rtl">
                                    <option value="USD">USD ($)</option>
                                    <option value="KHR">KHR (៛)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Notifications -->
                <div class="settings-group">
                    <div class="settings-header" data-i18n="profile.notifications">Notifications</div>
                    <div class="settings-list">
                        <div class="settings-item">
                            <div class="settings-label">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-tertiary);"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
                                <span data-i18n="profile.order_updates">Order Updates</span>
                            </div>
                            <div class="settings-control">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="pref-notif-orders" checked>
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-tertiary);"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                                <span data-i18n="profile.promotions">Promotions</span>
                            </div>
                            <div class="settings-control">
                                <label class="toggle-switch">
                                    <input type="checkbox" id="pref-notif-promos">
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div style="margin-top: var(--space-2xl); padding: 0 var(--space-md);">
                    <button type="submit" class="btn btn-primary btn-lg" id="save-all-btn" style="width: 100%;">
                        <span data-i18n="profile.save">Save Changes</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer" id="footer"></footer>

    <script src="js/disable-zoom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa-install.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
